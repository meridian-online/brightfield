feature: "Reactive parameters with input widgets"
as_a: "analyst sweeping a variable across a visualisation"
i_want: "to adjust a slider, menu, search box, or table selection and watch the view update live"
so_that: "I can explore how a parameter affects the data without re-authoring the query"

scenarios:
  - name: "Slider drives a reactive parameter"
    given: "a spec declares a param and a slider bound to it"
    when: "I drag the slider"
    then: "any plot whose query references that param re-queries and re-renders with the new value"
    source_lines: "brightfield-brief.md: 'Params: Reactive single-value variables shared across components. When a param updates, all subscribing clients re-query and re-render.'"

  - name: "Input widgets are first-class param emitters"
    given: "a spec includes slider, menu, search, and table input widgets each bound to a param via as_param"
    when: "I interact with any widget"
    then: "the widget emits the new param value to the coordinator, which dispatches re-queries to all subscribers of that param"
    source_lines: "brightfield-brief.md: 'Input widgets: slider, menu, search, table (sortable, load-on-scroll). These emit param or selection updates and are first-class coordinator clients.'"

  - name: "Multiple subscribers all react to the same param"
    given: "two plots both reference the same param in their query expressions"
    when: "the param value changes"
    then: "both plots re-query and re-render with the new value — no stale view is left behind"
    source_lines: "brightfield-brief.md: 'When a param updates, all subscribing clients re-query and re-render.'"

  - name: "Chained params propagate in DAG order"
    given: "param A drives a query whose result sets param B, and a plot subscribes to param B"
    when: "param A changes"
    then: "the coordinator walks the topological order: re-query for A's subscribers, then update B from the result, then re-query B's subscribers — no out-of-order execution"
    source_lines: "brightfield-brief.md: 'Params: Reactive single-value variables shared across components.'"

  - name: "Unsubscribed param change is harmless"
    given: "a param exists but no plot or widget references it"
    when: "the param value changes"
    then: "no queries fire and no errors surface — the update is silently absorbed"

  - name: "Runtime coordinator propagates a param change end-to-end"
    given: "the engine has loaded a spec with a param, a slider bound to it, and a subscribing plot"
    when: "the coordinator receives a param update event"
    then: "the coordinator looks up subscribers from the graph, re-executes their queries with the new value injected, and returns fresh RecordBatches for the affected marks"

  - name: "Re-query failure during param update does not crash the session"
    given: "a param change triggers re-query on two subscribing marks"
    when: "one mark's re-query fails (e.g. DuckDB error) and the other succeeds"
    then: "the successful mark gets fresh data, the failed mark retains its previous state, and a warning surfaces the error — the session continues"

goal: >
  Runtime coordinator that receives param-change events, walks the
  topological order from SpecAnalysis, and dispatches re-query + re-render
  to subscribing marks. Builds on v1's static analysis (subscriber graph,
  DAG, topo order) which is already shipped.

maturity: "emerging"

specs:
  - orbit/specs/2026-04-21-reactive-parameters-with-input-widgets/spec.yaml
  - orbit/specs/2026-04-24-reactive-parameters-with-input-widgets/spec.yaml
  - orbit/specs/2026-04-29-reactive-parameters-runtime/spec.yaml

references:
  - "brightfield-brief.md"
  - "spec v1 delivered: typed Input fields (as_param, from_source, filter_by), subscriber graph, param DAG with topo sort, cycle detection, type mismatch warnings, SpecAnalysis integration"
  - "engine already has Session::update_param() that re-executes subscribing marks — coordinator needs to orchestrate DAG propagation around it"
