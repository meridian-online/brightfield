[workspace]
members = ["crates/brightfield-workbench", "crates/brightfield-spec", "crates/brightfield-keys", "crates/brightfield-conformance", "crates/brightfield-sql", "crates/brightfield-protocol", "crates/brightfield-engine", "crates/brightfield-render", "crates/brightfield-ui", "crates/brightfield-app", "crates/brightfield-shell"]
resolver = "2"

[workspace.package]
edition = "2021"
# Floor set by gpui at zed pin 1d217ee (std::hint::cold_path, stable since
# 1.95 — zed's own rust-toolchain.toml pins 1.95.0); vello 0.9 needs 1.88.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/meridian-online/brightfield"

# Replace zed's GPL-3.0 tracing shim with a clean-room no-op stub so Brightfield
# binaries link no GPL code (the chain is gpui -> sum_tree -> ztracing -> zlog).
# Guarded by `cargo deny check licenses` (deny.toml) at every pin bump.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "stubs/ztracing" }

# The Meridian design system is developed side by side with brightfield. Both
# the token crate and its egui emitter are consumed as git dependencies, and
# this patch redirects them to a local clone of the design repo checked out
# beside this one, so a change to a token or the theme bridge is picked up
# without a publish + pin-bump round trip. `meridian-egui` is not yet published,
# so the patch is also what makes it resolve at all until it lands upstream.
# Point the paths at a design checkout on the branch you are developing against
# (README: "Working on the design system alongside brightfield").
[patch."https://github.com/meridian-online/design"]
meridian-design = { path = "../design/meridian-design" }
meridian-egui = { path = "../design/meridian-egui" }

[workspace.lints.rust]
unused_must_use = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
