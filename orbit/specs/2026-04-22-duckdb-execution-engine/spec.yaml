goal: >
  Create a new brightfield-engine crate that executes emitted SQL against an
  in-process DuckDB instance and returns Arrow record batches. The engine
  manages connection lifecycle, data source registration (DDL), per-mark
  query execution, and reactive parameter re-execution with a prepared
  statement cache.

constraints:
  - "brightfield-sql stays pure — no DuckDB dependency, no I/O. The engine is a new downstream consumer."
  - "Arrow record batch ownership: Vec<RecordBatch> per query, fully owned by the caller."
  - "Prepared statement cache keyed by plan_hash — scalar param changes rebind without re-preparing."
  - "EngineError is a new enum — does not extend EmitError. Wraps EmitError as EngineError::EmitFailed."
  - "In-memory DuckDB per session — no persistent scratch database in this iteration."
  - "The engine crate depends on brightfield-spec and brightfield-sql but neither upstream crate depends on the engine."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      New crate brightfield-engine exists at crates/brightfield-engine/ with
      Cargo.toml declaring dependencies on brightfield-spec (path), brightfield-sql
      (path), duckdb (bundled feature), and arrow. Workspace Cargo.toml lists
      it in members.
    verification: >
      cargo check -p brightfield-engine compiles without errors.

  - id: ac-02
    ac_type: code
    description: >
      EngineError enum in brightfield-engine/src/error.rs with variants:
      ConnectionFailed { cause }, DdlFailed { source_name, sql, cause },
      QueryFailed { mark_index, mark_kind, sql, cause }, EmitFailed { cause }.
      Each variant carries structured context. Implements std::error::Error
      via thiserror.
    verification: >
      Unit test constructs each variant and asserts Display output contains
      the structured context fields.

  - id: ac-03
    ac_type: code
    description: >
      Engine struct with Engine::new() constructor. Session struct created
      via engine.load_spec(spec, analysis, base_dir) that opens an in-memory
      DuckDB connection, executes all source DDL from emit_sources(), and
      stores any DDL warnings. load_spec returns LoadResult { session, warnings }
      where warnings is Vec<ParseWarning> from emit_sources. Session also
      exposes session.ddl_warnings() -> &[ParseWarning].
    verification: >
      Integration test: parse a spec with a data source, load_spec succeeds,
      the DDL view is queryable (session can execute a raw SELECT against the
      view name). Test with a CSV source containing unknown extras — load_spec
      succeeds and warnings are accessible via ddl_warnings().

  - id: ac-04
    ac_type: code
    description: >
      session.execute_mark(index) executes a single mark's emitted query and
      returns Result<Vec<RecordBatch>, EngineError>. Returns EngineError::EmitFailed
      wrapping EmitError::UnsupportedMark for marks without lowerers.
    verification: >
      Test with an unsupported mark returns EmitFailed(UnsupportedMark).
      Test with a hand-written SQL lowerer (test-only) returns valid RecordBatch.

  - id: ac-05
    ac_type: code
    description: >
      session.execute_all() executes all marks and returns
      Vec<Result<Vec<RecordBatch>, EngineError>> — one result per mark in
      depth-first order. Partial failure is possible (some marks succeed,
      others fail).
    verification: >
      Integration test with a spec containing both a supported (test-only)
      and unsupported mark: one Ok, one Err.

  - id: ac-06
    ac_type: code
    description: >
      session.update_param(name, value) re-executes all marks that subscribe
      to the named parameter and returns Vec<(usize, Result<Vec<RecordBatch>,
      EngineError>)> — one entry per affected mark with its depth-first index
      and result. Partial failure is possible (mirrors execute_all semantics).
      The engine builds a mark-index map during load_spec by walking the
      component tree and collecting mark positions. Only mark components are
      dispatched — inputs, interactors, and legends in the subscriber graph
      are filtered out.
    verification: >
      Integration test: a spec with a param-dependent mark and a non-subscribing
      mark. Call update_param, verify only the subscribing mark appears in the
      result vec. Test partial failure: one subscribing mark succeeds, another
      fails — both results are returned.

  - id: ac-07
    ac_type: code
    description: >
      Prepared statement cache keyed by plan_hash. On scalar param change,
      the cached prepared statement is reused (rebind only — no re-prepare).
      On selection change (structural WHERE change), the query is re-emitted
      and a new statement prepared.
    verification: >
      Test that calling update_param twice with different scalar values for
      the same param produces identical plan_hash values (proxy for cache reuse —
      stable plan_hash means no re-prepare path is taken). Expose a
      #[cfg(test)] method session.cache_len() to assert the cache size stays
      constant across scalar rebinds. Test that a selection update causes a
      new plan_hash (different structural SQL).

  - id: ac-08
    ac_type: code
    description: >
      DDL execution errors surface as EngineError::DdlFailed with source_name,
      the SQL that failed, and the DuckDB cause. Query execution errors surface
      as EngineError::QueryFailed with mark_index, mark_kind, SQL, and cause.
    verification: >
      Integration test: a spec referencing a nonexistent parquet file produces
      DdlFailed with the source name. A test-only lowerer emitting invalid SQL
      produces QueryFailed with the mark index.

  - id: ac-09
    ac_type: code
    description: >
      Session implements Drop — connection is closed when session goes out
      of scope. Creating a new session from the same engine works cleanly
      (no leaked state).
    verification: >
      Test: create session, drop it, create another session with a different
      spec — second session works without errors.

  - id: ac-10
    ac_type: code
    description: >
      All existing tests in brightfield-spec and brightfield-sql continue to pass.
      cargo test --workspace passes.
    verification: >
      cargo test --workspace exits 0 with no regressions.

  - id: ac-11
    ac_type: gate
    description: >
      The brightfield-engine crate has no public dependency on brightfield-spec
      or brightfield-sql internals — it consumes only their public APIs
      (Spec, SpecAnalysis, emit_sources, emit_query, EmittedQuery, EmitError).
    verification: >
      Review the engine's use statements — only pub items from upstream crates.

implementation_notes:
  - "Use duckdb = { version = \"1\", features = [\"bundled\"] } to bundle libduckdb."
  - "Use duckdb::arrow re-export for RecordBatch and all Arrow types — do NOT add an independent arrow dependency. This guarantees type compatibility between duckdb-rs query results and the engine's public API."
  - "The prepared statement cache is a HashMap<u64, PreparedStatement> where the key is plan_hash."
  - "For ac-04 and ac-05 tests, register a test-only MarkLower that produces a simple SELECT query — this avoids depending on real mark lowerers which don't exist yet."
  - "Session.update_param needs to distinguish Binding::Scalar (rebind) from Binding::Selection (re-emit). Use the existing EmittedQuery.bindings to detect which mode applies."
  - "During load_spec, build a MarkIndexMap: walk the spec component tree depth-first, record each Mark's position as (depth_first_index, ComponentPath). This bridges SubscriberGraph (which yields ComponentPaths) to mark indices (which execute_mark needs). Filter subscriber_graph entries to mark components only — paths matching the mark pattern — before dispatching to execute_mark. Inputs, interactors, and legends in the subscriber graph are silently skipped."
  - "Expose #[cfg(test)] method session.cache_len() -> usize for ac-07 verification."

ontology_schema:
  name: "ExecutionEngine"
  description: "In-process DuckDB execution for Mosaic spec pipelines"
  fields:
    - name: "Engine"
      type: "struct"
      description: "Factory that creates Sessions. Stateless."
    - name: "Session"
      type: "struct"
      description: "Owns a DuckDB Connection, loaded Spec, SpecAnalysis, and prepared statement cache."
    - name: "EngineError"
      type: "enum"
      description: "Structured error with variants for connection, DDL, query, and emission failures."
    - name: "PreparedCache"
      type: "HashMap<u64, PreparedStatement>"
      description: "Keyed by plan_hash. Scalar changes rebind; selection changes invalidate."

evaluation_principles:
  - principle: "Structural separation"
    weight: 0.3
  - principle: "Error context quality"
    weight: 0.25
  - principle: "Test coverage"
    weight: 0.25
  - principle: "API ergonomics"
    weight: 0.2

exit_conditions:
  - "cargo test --workspace passes with zero failures"
  - "Engine → Session → execute_all pipeline works end-to-end with a real parquet file"
  - "EngineError variants carry enough context to identify the failure site without reading source code"

