  - "Ours: entrypoint main.rs:~1050 (with_platform); watcher spawn ~:862 POLL=300ms ~:868, rejected-reload eprintln ~:911 — numbers drift with the click-filter merge, re-verify; WorkspaceView absorbs into the DockArea-hosting root; workspace.rs stays framework-free (PresentationMode/resolve_title/framed_window_size-as-initial-size); white bg currently in WorkspaceView — the dock takes over background painting, keep the canvas panel bg white."
  - "MERGE-TRAIN NOTE: this branch forks main @ 7ae2b1f; PR #41 (click-to-filter, ui/app churn) and the raster determinism chore land first — rebase onto main after they merge, before opening this PR."
  - "Tabletop contract incl. recon errata (the pin premise was stale — #40 already landed): tabletop.md alongside this spec. Read before starting."

deferred:
  - "WorkspaceView prune (brightfield-ui/src/workspace_view.rs): superseded as the window root by the DockArea shell; TogglePresentation, workspace_key_bindings, and WORKSPACE_KEY_CONTEXT remain live, the view itself awaits removal. [recorded 2026-07-06]"
  - "Upstream a two-line DockEvent patch to gpui-component — emit LayoutChanged on Dock::done_resizing and subscribe bare DockItem::Tabs centers in subscribe_item — as the principled alternative to the app-side observe workaround in ac-03's trigger-set correction. [recorded 2026-07-06]"
  - "DuckDB column profiling in the sidebar (count/min/max/distinct/nulls) — the card's next increment."
  - "LSP/completions/diagnostics in the editor; on-change live re-render (save-driven v1)."
  - "Focus-cycling keys, cmd-p alias, editor-focused bare-letter handling — keyboard-grammar card."
  - "Their TitleBar (client-side titlebar) on macOS; tiles/floating panels; canvas panel persistence."
  - "Command log as spec-edit stream (VisiData memo) — rides this editor seam once it exists."

ambiguity_score: 0.12
ambiguity_notes: >
  Closed space: two recons + Hugh's greenlight fixed every fork (dep shape,
  entrypoint retention, panel set, save-driven editing, presentation-as-
  visibility, persistence location/versioning, p-key scoping). Residual
  implementer freedom: exact config-dir path helper, notification wording,
  default dock sizes, whether the sidebar derivation reads schema from
  LiveParts or the executed batches — none contractual. Flagged to Hugh
  rather than locked: the p-key-in-editor v1 behaviour and the superseded
  0016 window-size invariant.
