name: public-hygiene

on:
  push:
    branches: [main]
  pull_request:

# Deliberately a workflow of its own rather than a job inside `test`:
#
# * `test` runs on `macos-15` with a 60-minute ceiling and a cold-ish build.
#   This gate needs no toolchain, no cache and no build — it is `git grep` over
#   tracked files and finishes in seconds. It should be the first thing to go
#   red, and it should still report when the Rust suite is queued or cancelled.
# * `test` cancels in-progress runs per ref. This gate is cheap enough that it
#   never needs cancelling, and a leak must be reported on every pushed commit.
jobs:
  planning-identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0, not 1. The tracked-file scan below only needs this one
      # commit, but the commit-message scan two steps down needs the base ref
      # to diff against. A shallow checkout on a `pull_request` event never
      # creates `refs/remotes/origin/<base>`, so the range step would hit its
      # own "does not resolve to anything" error on every pull request — loud
      # rather than silent, but still a gate that never ran. Full history here
      # is seconds, not minutes: this workflow needs no toolchain and no build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate's own regression test runs FIRST. A hygiene gate fails silently
      # in both directions — it can stop matching, or start matching honest
      # prose — so "the gate still works" has to be checked before "the tree is
      # clean" means anything.
      - name: hygiene gate self-test
        run: ./scripts/check-public-hygiene-selftest.sh

      # No `working-directory`. The gate cd's to the repo root itself, so its
      # scan is the whole repository rather than one directory — workspace
      # crates included. What it leaves out it leaves out by name: the
      # allowlist, which quotes the strings it exists to permit, and whatever
      # `git grep -I` treats as binary.
      - name: private planning identifiers
        run: ./scripts/check-public-hygiene.sh

      # The two surfaces the step above cannot see: a commit's own message, and
      # a pull request's title and body. Same rule list,
      # scripts/public-hygiene-rules.txt, read by both scripts — splitting the
      # rules is how the second surface came to be uncovered while the first
      # was gated.
      - name: history hygiene gate self-test
        run: ./scripts/check-history-hygiene-selftest.sh

      # Scoped to NEW history only: the commits this push or pull request adds,
      # never the whole repository's past. This repository carries commits
      # already on `main` that predate the gate and were never swept — scanning
      # them here would redden every pull request for history it did not add,
      # so this deliberately runs no accepted-history record and declares no
      # pre-existing exceptions; see scripts/check-history-hygiene.sh's own
      # header for the mechanism that would support one.
      #
      # On a pull request the base is the actual merge-base with the target
      # branch, computed locally rather than trusted from the event payload, so
      # a pull request opened against a moving target is still scanned for
      # exactly its own commits. On a push to `main` — after a merge — the base
      # is the previous tip, so only what just landed is scanned.
      - name: private references in commit messages
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
            BASE_SHA="$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          ./scripts/check-history-hygiene.sh --range "$BASE_SHA..HEAD"

      # The pull request's own text, which is not in the repository and so is
      # in neither scan above. Passed through the environment rather than
      # interpolated into the script: `${{ }}` inside a `run:` substitutes
      # before the shell sees it, so a title containing a quote or a backtick
      # would be executed rather than scanned.
      #
      # This reads the body AS OF THE EVENT THAT STARTED THIS RUN. A body
      # edited afterwards is covered by
      # .github/workflows/pr-text-hygiene.yml, which triggers on `edited` and
      # runs this same step; that trigger is not here because it would
      # re-run every step in this job on every typo fix in a description.
      - name: private references in the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" >"$RUNNER_TEMP/pr-text.txt"
          ./scripts/check-history-hygiene.sh --text "$RUNNER_TEMP/pr-text.txt"

      # Second honesty gate, same shape: upstream Mosaic performance figures
      # must not be restated as this project's own. Our numbers live in
      # benchmarks/results/, measured by the committed harness. Self-test
      # first, for the same reason as above.
      - name: borrowed-benchmarks gate self-test
        run: ./scripts/check-borrowed-benchmarks-selftest.sh

      - name: borrowed benchmark figures
        run: ./scripts/check-borrowed-benchmarks.sh

      # Third honesty gate: a promise about performance at scale has to say
      # which marks it holds for. Interaction cost stops tracking row count for
      # a mark that aggregates and does not for a row-level one, and shipped
      # sentences — the README's opening line among them — made the promise
      # without the split. Self-test first, for the reason above. Those shipped
      # sentences are must-fail cases there in the words they shipped in; the
      # rest of the cases exist so that no entry in the gate's three pattern
      # lists can be deleted while the self-test is green, which it
      # proves by removing one entry at a time and requiring a case to change
      # its verdict. Its tree cases stage a git checkout and run the gate's own
      # file enumeration, so a scan that has stopped reading files reddens here
      # rather than passing over a tree full of them.
      - name: scale-claims gate self-test
        run: ./scripts/check-scale-claims.py --self-test

      - name: unqualified scale claims
        run: ./scripts/check-scale-claims.py

      # Fourth: our OWN measured figures, restated in prose where nothing keeps
      # them in step with the record. The borrowed-benchmarks gate above stops
      # upstream numbers being claimed as ours; this stops ours drifting from
      # the run they were read out of, which had already happened —
      # docs/interaction-speed.md's table disagreed with the very record it
      # cited. That table is a self-test case twice over, in the digits it
      # shipped with: as written, and read against the run it was quoting. The
      # table on the page TODAY is checked by the step after the self-test; the
      # self-test reaches it only through the cases that run the script as a
      # process over a copy of the checkout and read its exit code.
      - name: measured-figures gate self-test
        run: ./scripts/check-measured-figures.py --self-test

      - name: measured figures match the record
        run: ./scripts/check-measured-figures.py

      # Release-packaging honesty, same cheap-shell shape: package.sh must
      # refuse to build an artifact whose tag disagrees with the crate version.
      # The self-test exercises both directions and runs no compiler (the guard
      # fails before rustc/cargo; the pass path stubs them), so it belongs on
      # this toolchain-free runner rather than in the tagged release workflow —
      # where it would only ever run after a tag, too late to catch the mismatch.
      - name: package version-guard self-test
        run: ./scripts/package-version-guard-selftest.sh

      # The bundled-extension guard, for the same reason and by the same
      # argument. It is called from two places that both run only on a release
      # — scripts/package.sh staging a FineType bundle, and
      # scripts/verify-airgapped.sh reading the one inside a built artifact —
      # so on its own it would be exercised a handful of times a year, always
      # at the moment it is least welcome to be wrong. The self-test needs no
      # toolchain, no network and no real extension: its fixtures are a few
      # hundred bytes of synthesised DuckDB metadata trailer.
      - name: bundled-extension guard self-test
        run: ./scripts/check-bundled-extension-selftest.sh

      # The formula-asset check is the odd one here: only its self-test can run
      # on a pull request, because the check itself addresses a published
      # release through the tap formula and there is no release on a branch. So
      # the check lives in release.yml and its credibility lives here.
      #
      # That split is the whole point. A check that runs on a tag and nowhere
      # else is exercised a handful of times a year, always at the moment it is
      # least welcome to be wrong; this self-test stands a loopback HTTP server
      # in front of throwaway assets and proves — on every pull request, with no
      # network beyond localhost and no toolchain — that a wrong checksum and an
      # unresolvable url each still turn it red.
      - name: formula-asset check self-test
        run: ./scripts/check-formula-asset-selftest.sh
