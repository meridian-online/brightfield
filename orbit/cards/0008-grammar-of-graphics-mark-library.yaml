feature: "Grammar-of-graphics mark library"
as_a: "analyst choosing how to encode my data visually"
i_want: "a broad catalogue of mark types — points, bars, lines, areas, text, rules, statistical and specialised forms"
so_that: "I can pick the encoding that best fits what I'm trying to show"

scenarios:
  - name: "Core marks for a first-release dashboard"
    given: "a spec uses lineY, barY, dot, areaY, rect, text, or rule marks"
    when: "it renders"
    then: "each mark type draws correctly on top of scales, axes, and legends inferred from the spec"
    source_lines: "brightfield-brief.md: 'Priority for initial implementation: lineY, barY, dot, areaY, rect, text, rule.'"

  - name: "Statistical marks for distribution views"
    given: "a spec uses density (1D or 2D KDE) or regression marks"
    when: "it renders"
    then: "the distribution or fit is drawn from the underlying data without a separate precompute step"
    source_lines: "brightfield-brief.md: 'Statistical: density (1D/2D KDE), regression'"

  - name: "Specialised marks for geo and binned views"
    given: "a spec uses geo, hexbin, contour, or raster/heatmap marks"
    when: "it renders"
    then: "the mark draws from its data source using brightfield's native GPU renderer"
    source_lines: "brightfield-brief.md: 'Specialised: geo (GeoJSON), hexbin, contour, raster/heatmap'"

maturity: "emerging"

specs:
  - orbit/specs/2026-04-28-statistical-marks/spec.yaml
  - orbit/specs/2026-07-05-sequential-colour-scale/spec.yaml
  - orbit/specs/2026-07-06-density-marks/spec.yaml
  - orbit/specs/2026-07-10-crossfilter-render-fidelity/spec.yaml
  - orbit/specs/2026-07-10-hexbin-marks/spec.yaml
  - orbit/specs/2026-07-11-axis-inset/spec.yaml

references:
  - "brightfield-brief.md"
