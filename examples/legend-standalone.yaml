# Standalone legend hosting (multi-view inc 6): a `legend: color` node placed as
# a composition sibling (not inside a plot) puts a legend on the plot its `for:`
# names — here the `scatter` plot's `grp` fill encoding — as a swatch for each
# category, named `grp`.
#
#   cargo run -p brightfield-shell --bin brightfield-shot -- --spec examples/legend-standalone.yaml --out legend.png --vello-only
#
# The shell draws that legend in a band it reserves at the right of the plot's
# raster, outside the data. The node says the plot has a legend and `for:` says
# which plot it is, so the scale appears once, on the far right.
data:
  t:
    - { x: 1, y: 3, grp: alpha }
    - { x: 2, y: 5, grp: beta }
    - { x: 3, y: 4, grp: gamma }
    - { x: 4, y: 6, grp: alpha }
    - { x: 5, y: 5, grp: beta }
    - { x: 6, y: 2, grp: gamma }
hconcat:
  - plot:
    - mark: dot
      data: { from: t }
      x: x
      y: y
      fill: grp
    name: scatter
    width: 380
    height: 300
  - legend: color
    for: scatter
