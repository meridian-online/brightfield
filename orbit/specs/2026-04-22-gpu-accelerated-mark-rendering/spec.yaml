goal: "Render Mosaic spec marks (dot, bar, line) as GPU-accelerated interactive charts in a GPUI window using Vello, with axes, colour legend, and 60+ FPS interaction."

constraints:
  - "Vello is the 2D rendering backend; all chart content (marks, axes, grid, legend) renders into a single vello::Scene"
  - "CPU readback to GPUI image element for v1 texture handoff — no shared GPU texture"
  - "Two new crates: brightfield-render (headless, produces vello::Scene) and brightfield-ui (GPUI shell)"
  - "brightfield-render must NOT depend on gpui — it depends on brightfield-spec, arrow, vello, kurbo, peniko, skrifa"
  - "brightfield-ui depends on brightfield-render, brightfield-engine, gpui, wgpu"
  - "Fixed margin model with Observable Plot defaults (top: 20, right: 20, bottom: 30, left: 40)"
  - "Interaction overlay renders immediately during drag; DuckDB re-query fires only on brush release"
  - "MarkRenderer trait returns vello scene fragments, not GpuiElement"
  - "Must work on Apple Silicon (unified memory makes CPU readback near-free)"

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "brightfield-render crate exists at crates/brightfield-render/ with Cargo.toml depending on brightfield-spec, arrow, vello, kurbo, peniko — but NOT gpui"
    verification: "cargo check -p brightfield-render succeeds; grep Cargo.toml confirms no gpui dependency"

  - id: ac-02
    ac_type: code
    description: "ScaleSet type infers linear, band, and time scales from RecordBatch column types and ChannelMap, mapping data domains to pixel ranges"
    verification: "Unit test: given a RecordBatch with f64/string/timestamp columns, infer_scales returns ScaleSet with correct scale types and domain extents"

  - id: ac-03
    ac_type: code
    description: "DotRenderer implements MarkRenderer and produces a vello::Scene with positioned circles at correct x/y data coordinates mapped through ScaleSet"
    verification: "Unit test: render a 3-point batch, verify scene contains 3 fill operations at expected pixel positions"

  - id: ac-04
    ac_type: code
    description: "BarRenderer implements MarkRenderer and produces rectangles with widths proportional to band scale and heights proportional to value scale"
    verification: "Unit test: render a 2-category batch, verify scene contains 2 rects with correct band-width and value-proportional heights"

  - id: ac-05
    ac_type: code
    description: "LineRenderer implements MarkRenderer and produces a connected path following data points in x-order through ScaleSet"
    verification: "Unit test: render a 4-point time-series batch, verify scene contains a single path with 4 vertices in x-sorted order"

  - id: ac-06
    ac_type: code
    description: "Axis renderer draws tick marks, labels (via draw_glyphs), and grid lines for linear, band, and time scale types"
    verification: "Unit test: given a linear scale with known domain, verify tick computation produces correct positions and label strings; verify scene contains stroke operations for ticks and grid lines"

  - id: ac-07
    ac_type: code
    description: "Colour legend renderer draws colour-to-value mapping swatches with labels when a mark encodes a data column as fill colour"
    verification: "Unit test: given a colour encoding with 4 categories, verify legend scene contains 4 coloured rects and 4 text labels"

  - id: ac-08
    ac_type: code
    description: "build_chart_scene orchestrator composes marks + axes + legend into a single vello::Scene with correct layout (margins, plot area rect)"
    verification: "Integration test: given a full spec with data, marks, and encodings, build_chart_scene returns a non-empty Scene; render to pixel buffer and verify non-blank output"

  - id: ac-09
    ac_type: code
    description: "brightfield-ui crate exists at crates/brightfield-ui/ with a ChartElement that wraps Vello-rendered texture as a GPUI image element"
    verification: "cargo check -p brightfield-ui succeeds; ChartElement struct exists with GPUI element trait implementation"

  - id: ac-10
    ac_type: code
    description: "Interaction state tracks brush rect and hovered point; overlay renders selection rectangle in the Vello scene without triggering DuckDB re-query"
    verification: "Unit test: set brush state, re-render scene, verify overlay rect appears in scene; verify no engine execute_mark call during drag"

  - id: ac-11
    ac_type: code
    description: "Workspace Cargo.toml includes brightfield-render and brightfield-ui as workspace members"
    verification: "cargo check --workspace succeeds with both new crates"

implementation_notes:
  - "MarkRenderer trait: fn render(&self, batch: &RecordBatch, channel_map: &ChannelMap, scales: &ScaleSet) -> SceneFragment — produces vello scene fragments"
  - "Scale types: LinearScale (f64 domain), BandScale (string categories), TimeScale (timestamp domain) — each with map(value) -> f64 pixel position"
  - "Tick computation is a pure function: compute_ticks(scale, target_count) -> Vec<Tick { value, label, position }>"
  - "Scene builder pattern: build_chart_scene(spec_data) orchestrates data -> scales -> marks + axes + legend -> vello::Scene"
  - "ChartElement in brightfield-ui: implements gpui::Element, holds a vello::Scene, renders to wgpu texture, reads back to GPUI ImageSource"
  - "InteractionState: enum { Idle, Brushing { rect }, Hovering { point } } — updated by mouse events, consumed by overlay renderer"
  - "Layout: ChartLayout { margins, plot_area: Rect, width, height } computed from element bounds and margin defaults/overrides"
  - "Font loading: load system default sans-serif at startup for axis labels and legend text via skrifa"

ontology_schema:
  name: "ChartRenderPipeline"
  description: "The pipeline from spec + data to GPU-rendered interactive chart"
  fields:
    - name: "ScaleSet"
      type: "struct"
      description: "Collection of inferred scales (x, y, colour, size) mapping data domains to visual ranges"
    - name: "MarkRenderer"
      type: "trait"
      description: "Per-mark-family renderer producing vello scene fragments from RecordBatch + ChannelMap + ScaleSet"
    - name: "ChartLayout"
      type: "struct"
      description: "Computed layout: margins, plot area rect, legend placement"
    - name: "InteractionState"
      type: "enum"
      description: "Current interaction mode: idle, brushing, hovering — drives overlay rendering"
    - name: "ChartElement"
      type: "struct"
      description: "GPUI element wrapping Vello scene rendering and texture handoff"

evaluation_principles:
  - principle: "Rendering correctness — marks appear at correct data-mapped positions"
    weight: 0.35
  - principle: "Architecture separation — brightfield-render is testable without GPUI"
    weight: 0.25
  - principle: "Frame rate — interaction overlay renders without I/O blocking"
    weight: 0.20
  - principle: "Completeness — dot, bar, line marks plus axes and legend all render"
    weight: 0.20

exit_conditions:
  - "All 11 ACs pass verification"
  - "cargo check --workspace succeeds with both new crates"
  - "Headless render test produces non-blank pixel output from a dot/bar/line spec"

