meta:
  title: Scatter — Brightfield example
  description: |
    A self-contained scatter plot over inline data — no external files needed.

      cargo run -p brightfield-app -- examples/scatter.yaml

    On macOS this opens a native window. Anywhere else (or for a quick check),
    render to an image instead:

      BRIGHTFIELD_DUMP_PNG=scatter.png cargo run -p brightfield-app -- examples/scatter.yaml
