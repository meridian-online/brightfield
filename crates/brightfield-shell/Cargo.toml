[package]
name = "brightfield-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "egui/eframe shell hosting the Vello mosaic canvas on a shared wgpu device (gpui-free)"

[dependencies]
# The framework-free render/host seam + Vello renderer + scene builders.
brightfield-render = { path = "../brightfield-render" }
# Spec -> engine -> executed marks -> Vello scene pipeline (all gpui-free).
brightfield-engine = { path = "../brightfield-engine" }
brightfield-spec = { path = "../brightfield-spec" }
brightfield-sql = { path = "../brightfield-sql" }
# Meridian design tokens.
meridian-design = { git = "https://github.com/meridian-online/design", rev = "952eea92e4659a0f80a998709b81742be5d7385b" }
# The egui emitter of those tokens (the design repo's third thin emitter): the
# `Style`/`Visuals`/font bridge and `Mode`, re-exported under this crate's
# `design` module so `brightfield_shell::design::…` call sites are unchanged.
# The bridge used to live in brightfield-shell/src/design.rs; it now lives here,
# which is where ADR 0003/0011 always said an emitter belongs. A `[patch]` in
# the workspace root points both design crates at a side-by-side clone.
meridian-egui = { git = "https://github.com/meridian-online/design", rev = "952eea92e4659a0f80a998709b81742be5d7385b" }

# VERSION LOCK — egui 0.35 rides wgpu 29, the same wgpu major Vello 0.9 uses, so
# `egui_wgpu`'s wgpu and `vello::wgpu` resolve to ONE crate instance and therefore
# one `wgpu::Device`. That is what lets a Vello scene rasterise onto a texture egui
# samples directly, with no second device and no CPU readback. Two wgpu majors in
# the graph would make the device types incompatible and force the readback back.
# Bump egui and vello TOGETHER, and only to versions that still share a wgpu major.
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["wgpu"] }
egui-wgpu = "0.35"

vello = { version = "0.9", features = ["wgpu"] }
kurbo = "0.13"
peniko = "0.6"
pollster = "0.4"
image = "0.25"
# RecordBatch + batch concat for the mark-execution pipeline.
arrow = { version = "58", default-features = false }
# --script ndjson parsing for the headless shot's scripted RawInput.
serde_json = "1"
# `serde` is egui_tiles' only feature and its default, and it is the whole of
# what makes a dock layout persistable. This crate builds a `Tree` and never
# serialises one, so `default-features = false` was costing it nothing today
# and could not have reached the workbench, which declares the feature itself.
# Matched anyway, because the shell is about to take the workbench's layout
# persistence over and a dependency that opts out of the feature its successor
# is built on is a trap laid for the increment after this one.
egui_tiles = { version = "0.16", features = ["serde"] }
brightfield-protocol = { version = "0.1.0", path = "../brightfield-protocol" }
brightfield-keys = { version = "0.1.0", path = "../brightfield-keys" }
# The framework-free argument collector the argument-prompt overlay drives —
# consumed read-only, like the keys registry above.
brightfield-model = { version = "0.1.0", path = "../brightfield-model" }
# The shell contract: Subject, Item, the registry, the one chrome file, the
# workspace, and the Meridian -> egui Style/Visuals/fonts bridge. The protocol
# view is expressed on it: four `Item`s, one `ItemRegistry`, and `PaneChrome`
# drawing every pane's header, empty state and selection. The chart view and the
# one-app `Workspace` follow in later steps.
brightfield-workbench = { version = "0.1.0", path = "../brightfield-workbench" }
# The virtualised table viewer under the data grid and the Steps sheet
# (rerun-io; deliberately styling-free — sticky headers, millions of rows).
# Tracks egui majors: 0.9 rides egui 0.35; bump the two together.
egui_table = "0.9"

[dev-dependencies]
# Tier-1 real-UI snapshot loop: egui_kittest renders the real app headlessly on
# wgpu and perceptually diffs against committed baselines (dify under the hood).
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }

[[bin]]
name = "brightfield-shell"
path = "src/main.rs"

[[bin]]
name = "brightfield-shot"
path = "src/bin/brightfield-shot.rs"

[[bin]]
name = "bf-imgdiff"
path = "src/bin/bf-imgdiff.rs"

[lints]
workspace = true
