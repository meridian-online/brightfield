# Package this branch the way the release does, and install its disk image
# through Homebrew's cask, before anything is published. The check is
# scripts/check-brew-install-branch.sh; this file is the runner it needs and the
# image it installs.
#
# release.yml's `brew-install` job reads the copy Homebrew installs, but only
# after a tag is pushed and the release is out. Brightfield 0.1.5 was published
# with a finetype extension Homebrew rewrote on install, so the installed copy
# refused its own type source, and nothing read the installed copy until a person
# had run `brew install`. This job reads it on a branch that changes packaging
# or the cask: the same aarch64 disk image release.yml builds (same FineType
# pin, same DuckDB CLI, same scripts/package.sh), the same cask generator, and a
# local tap in place of the published one. It also installs the image with the
# cask's exec shim swapped for a link to the app's binary, with one byte of the
# FineType library changed, and over a link the old formula would have left,
# and requires each to end as the script's header says.
#
# No signing secrets reach this job, so package.sh signs the app ad hoc and
# Gatekeeper does not accept it as notarised. The script prints spctl's verdict
# and clears the installed app's quarantine so the command can run; the
# notarised copy is read by release.yml's `brew-install` job.
#
# By hand only: `gh workflow run brew-install-branch.yml --ref <branch>`, once
# this file is on the default branch. It installs through Homebrew, which on the
# Mac Studio would be a person's own Homebrew, so the nightly does not run it;
# the release tag covers it, since release.yml's `brew-install` job reads the
# installed copy of every release. When a pull request touches the paths that
# decide what Homebrew installs, `cargo xtask gate` prints this command for its
# branch; those paths are `BREW_INSTALL_BRANCH_PATHS` in xtask/src/gate.rs.
#
# macos-15 is the hosted arm64 image release.yml builds the aarch64 image on.
# The Intel image is not installed here, for the reason brew-install.yml gives.

name: brew-install-branch

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  brew-install-branch:
    name: Homebrew installs this branch's disk image with its type source intact
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: brew-install-branch-aarch64-apple-darwin

      # The tag is the crate's version, which is what scripts/package.sh names
      # the image after and what the cask's url makes the installed version.
      - name: Read the version this branch packages
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/brightfield-shell/Cargo.toml | head -1)"
          test -n "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch the FineType bundle
        run: scripts/fetch-finetype-bundle.sh aarch64-apple-darwin "${RUNNER_TEMP}/finetype-bundle"

      - name: Fetch the DuckDB CLI
        run: scripts/fetch-duckdb-cli.sh aarch64-apple-darwin "${RUNNER_TEMP}/duckdb-cli"

      - name: Package
        env:
          BRIGHTFIELD_FINETYPE_BUNDLE: ${{ runner.temp }}/finetype-bundle
          BRIGHTFIELD_DUCKDB_CLI: ${{ runner.temp }}/duckdb-cli
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/package.sh "$TAG" aarch64-apple-darwin

      - name: Install the disk image through Homebrew's cask four ways
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/check-brew-install-branch.sh dist "$TAG"
