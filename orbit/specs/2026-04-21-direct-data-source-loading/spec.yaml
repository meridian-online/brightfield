goal: |
  Translate every DataSource AST node into executable DuckDB SQL. The new
  brightfield-sql crate emits a CREATE OR REPLACE VIEW per data source at
  spec-mount time, covering all five formats (Parquet, CSV, JSON/GeoJSON,
  inline rows, DuckDB ATTACH). File paths resolve against the spec file's
  parent directory. A string-snapshot conformance gate (layer-2 DDL slice)
  verifies emission against curated expected-SQL fixtures. Card 0003 later
  extends the same crate with per-plot SELECT emission.

constraints:
  - "New crate `brightfield-sql` at `crates/brightfield-sql/`. Depends on `brightfield-spec` (path). Workspace member. No DuckDB runtime dependency — emission is pure string generation."
  - "`ParseOutput` gains `base_dir: Option<PathBuf>`. `parse_spec_path` populates it from `path.parent()`; `parse_spec` leaves it `None` (fallback to CWD at emit time). This is technically a semver-breaking change (new pub field without `#[non_exhaustive]`). Accepted as tech debt — the crate has no external consumers yet. Existing callers compile because they destructure via methods, not struct literals."
  - "Extension-sniffing dispatch: `.parquet` → `read_parquet()`, `.csv`/`.tsv` → `read_csv(…, auto_detect=true)`, `.json`/`.ndjson` → `read_json_auto()`, `.geojson` without `type: spatial` → `EmitError::UnknownFormat`, `type: spatial` → `ST_Read()`, `.duckdb`/`.db` → `ATTACH … AS … (READ_ONLY)`. Unknown extension → `EmitError::UnknownFormat`. `DataSourceKind::Typed(s)` without a `file:` key → `EmitError::InvariantViolation` (type-only sources are not emittable without a file reference). `DataSourceKind::Opaque` → `EmitError::InvariantViolation` (no meaningful SQL can be generated)."
  - "CSV reader option allow-list: `delim`, `header`, `columns`, `types`, `skip`, `nullstr`. Extras outside allow-list → `ParseWarning::UnknownOption` (reuse card 0001's warning type)."
  - "Inline rows: `CREATE OR REPLACE VIEW \"<name>\" AS SELECT * FROM (VALUES (…), …) AS t(\"col1\", …)`. Column names from first row keys in insertion order (preserving YAML source order via IndexMap — deterministic for snapshot comparison) or synthesised `c0, c1, …` (array-per-row). Row count > 1000 → `EmitError::InlineRowLimit { count }`. Keeps snapshots reviewable."
  - "DuckDB ATTACH uses the data-map key as the alias, `READ_ONLY` enforced. This is a deliberate safety divergence from Mosaic-web — recorded in `deviations.yaml` as `DEV-0001`."
  - "Emission is a pure function of `(&Spec, Option<&Path>)` → `Result<Vec<SourceDdl>, EmitError>`. No I/O at emit time. No DuckDB connection."
  - "Conformance: `SqlEquivalenceCheck` in `brightfield-conformance/src/layer.rs` flips from `Pending` to a string-diff against `<name>.layer2.expected.sql` sibling files. Scoped to data-source DDL only — plot-SELECT conformance stays `Pending` until card 0003."
  - "Expected SQL fixtures use canonical form: view names alphabetical, kwargs alphabetical, whitespace normalised. The canonicalisation function lives in `brightfield-sql/src/render.rs` and is reused by the conformance check."
  - "HTTP(S) URLs in `file:` values pass through verbatim — no path resolution applied."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: |
      New crate `brightfield-sql` at `crates/brightfield-sql/`. `Cargo.toml`
      declares edition 2021+, path dependency on `brightfield-spec`, plus
      `thiserror` and `indexmap`. Added to workspace `members` in root
      `Cargo.toml`. Module layout: `error.rs`, `source.rs`, `emit.rs`,
      `render.rs`, `lib.rs`.
    verification: |
      `cargo metadata -p brightfield-sql` succeeds; workspace root
      `Cargo.toml` includes `brightfield-sql` in members; `ls crates/brightfield-sql/src/`
      shows the five modules.

  - id: ac-02
    ac_type: code
    description: |
      `EmitError` enum in `brightfield-sql/src/error.rs` with variants:
      `UnknownFormat { path: String, extension: String }`,
      `InlineRowLimit { count: usize }`,
      `InvariantViolation { detail: String }`.
      Implements `std::error::Error` via `thiserror`.
    verification: |
      Unit test `dfsql_emit_error_variants` constructs each variant and
      asserts `Display` output contains the discriminating field value.

  - id: ac-03
    ac_type: code
    description: |
      `ParseOutput` in `brightfield-spec/src/parse.rs` gains field
      `pub base_dir: Option<PathBuf>`. `parse_spec_path` sets it to
      `path.parent().map(Path::to_path_buf)`. `parse_spec` (string input)
      leaves it `None`. Existing callers and tests compile without change.
    verification: |
      Unit test `dfspec_parse_spec_path_populates_base_dir`: parse a
      vendored corpus spec via `parse_spec_path`, assert `base_dir` is
      `Some` and equals the parent directory. Unit test
      `dfspec_parse_spec_string_base_dir_is_none`: parse from string,
      assert `base_dir.is_none()`.

  - id: ac-04
    ac_type: code
    description: |
      `pub struct SourceDdl { pub view_name: String, pub sql: String,
      pub source_kind: SourceKindTag }` in `brightfield-sql/src/emit.rs`.
      `SourceKindTag` is an enum mirroring the dispatch arms:
      `Parquet | Csv | Json | Spatial | DuckDb | InlineRows | Query`.
      Note: `Typed` (without file) and `Opaque` are error cases, not
      emission arms — they produce `EmitError::InvariantViolation`.
      `pub fn emit_sources(spec: &Spec, base_dir: Option<&Path>)
      -> Result<Vec<SourceDdl>, EmitError>` iterates `spec.data` in
      insertion order, dispatching each `DataSource` to the appropriate
      emitter function.
    verification: |
      Unit test `dfsql_emit_sources_returns_one_ddl_per_data_entry`:
      parse a spec with 3 data sources, call `emit_sources`, assert
      result has 3 `SourceDdl` entries with correct `view_name` values
      matching the data map keys.

  - id: ac-05
    ac_type: code
    description: |
      Parquet emission: `DataSourceKind::File` where path ends in
      `.parquet` emits `CREATE OR REPLACE VIEW "<name>" AS SELECT * FROM
      read_parquet('<resolved_path>')`. Path resolution joins `base_dir`
      (or CWD fallback) with the file value. HTTP(S) URLs pass through
      verbatim without path joining.
    verification: |
      Unit test `dfsql_parquet_emission`: spec with `file: flights.parquet`
      and `base_dir = Some("/data")` → SQL contains
      `read_parquet('/data/flights.parquet')`. Unit test
      `dfsql_parquet_http_url_passthrough`: spec with
      `file: https://example.com/data.parquet` → URL appears verbatim.

  - id: ac-06
    ac_type: code
    description: |
      CSV emission: `.csv`/`.tsv` files emit `read_csv('<path>',
      auto_detect=true)`. Allow-listed extras (`delim`, `header`,
      `columns`, `types`, `skip`, `nullstr`) are forwarded as kwargs in
      alphabetical order. Extras outside the allow-list produce
      `ParseWarning::UnknownOption`.
    verification: |
      Unit test `dfsql_csv_emission_with_extras`: spec with
      `file: data.csv` and extras `delim: "|", skip: 1` → SQL contains
      `auto_detect=true, delim='|', skip=1`. Unit test
      `dfsql_csv_unknown_extra_warns`: extra `encoding: utf8` produces
      a warning, not an error.

  - id: ac-07
    ac_type: code
    description: |
      JSON emission: `.json`/`.ndjson` files emit
      `read_json_auto('<path>', format='auto')`. `.geojson` without
      `type: spatial` in extras returns `EmitError::UnknownFormat`.
      `type: spatial` emits `ST_Read('<path>')` with optional
      `layer=<extras.layer>` kwarg.
    verification: |
      Unit test `dfsql_json_emission`: `.json` file → `read_json_auto`.
      Unit test `dfsql_geojson_requires_spatial_type`: `.geojson` without
      `type: spatial` → `EmitError::UnknownFormat`. Unit test
      `dfsql_spatial_emission`: `type: spatial` with `.geojson` →
      `ST_Read(…)`.

  - id: ac-08
    ac_type: code
    description: |
      DuckDB ATTACH emission: `.duckdb`/`.db` files emit
      `ATTACH '<resolved_path>' AS "<data-key>" (READ_ONLY)` — NOT a
      `CREATE OR REPLACE VIEW`. The data-map key is quoted as the alias.
      `SourceKindTag::DuckDb` distinguishes this from view-based sources.
    verification: |
      Unit test `dfsql_duckdb_attach_emission`: spec with
      `file: analytics.duckdb` → SQL is `ATTACH '…' AS "analytics"
      (READ_ONLY)`. Unit test `dfsql_duckdb_read_only_enforced`: assert
      the emitted SQL always contains `READ_ONLY`.

  - id: ac-09
    ac_type: code
    description: |
      Inline-row emission: `DataSourceKind::InlineRows` with object-per-row
      extracts column names from the first row's keys. Array-per-row
      synthesises `c0, c1, …`. Emits `CREATE OR REPLACE VIEW "<name>" AS
      SELECT * FROM (VALUES (…), (…)) AS t("col1", "col2")`. Row count
      > 1000 returns `EmitError::InlineRowLimit`.
    verification: |
      Unit test `dfsql_inline_object_rows`: 3 object rows → VIEW with
      VALUES clause, column names from keys. Unit test
      `dfsql_inline_array_rows`: array-per-row → synthesised `c0, c1`.
      Unit test `dfsql_inline_row_limit`: 1001 rows →
      `EmitError::InlineRowLimit`.

  - id: ac-10
    ac_type: code
    description: |
      Query emission: `DataSourceKind::Query` wraps the author's SQL
      directly: `CREATE OR REPLACE VIEW "<name>" AS <query-sql>`.
      `DataSourceKind::Shorthand` treated as a query (bare table name or
      inline SQL). `SourceKindTag::Query` for both.
    verification: |
      Unit test `dfsql_query_emission`: `query: "SELECT * FROM t"` →
      `CREATE OR REPLACE VIEW "src" AS SELECT * FROM t`. Unit test
      `dfsql_shorthand_emission`: shorthand string → same pattern.

  - id: ac-11
    ac_type: code
    description: |
      `render.rs` provides `pub fn canonicalise_ddl(statements: &[SourceDdl])
      -> String` that sorts statements by `view_name` alphabetically,
      normalises kwargs to alphabetical order within each statement, and
      normalises whitespace (single spaces, no trailing, LF line endings).
      This function is the single canonical form used by both snapshot
      generation and conformance comparison.
    verification: |
      Unit test `dfsql_canonicalise_is_deterministic`: two calls on the
      same input produce byte-identical output. Unit test
      `dfsql_canonicalise_sorts_by_view_name`: input in reverse order →
      output in alphabetical order.

  - id: ac-12
    ac_type: code
    description: |
      `SqlEquivalenceCheck` in `brightfield-conformance/src/layer.rs` flips
      from `Pending` to an active check. It calls `emit_sources` on the
      parsed spec, canonicalises the output, and string-diffs against the
      sibling `<name>.layer2.expected.sql` file. Match → `Pass`; mismatch →
      `Fail { details }` showing the diff. Missing expected file →
      `Pending { reason: "no expected SQL fixture" }` (graceful for
      observed-corpus specs that have no fixture).
    verification: |
      Integration test `dfconf_layer_2_curated_pass`: run
      `SqlEquivalenceCheck` on every curated entry that has a
      `.layer2.expected.sql` sibling → all `Pass`. Unit test
      `dfconf_layer_2_missing_fixture_is_pending`: entry without
      `.layer2.expected.sql` → `Pending`.

  - id: ac-13
    ac_type: code
    description: |
      Each curated corpus spec gains a sibling `<name>.layer2.expected.sql`
      file containing the canonical data-source DDL for that spec. Files
      are generated by running `emit_sources` + `canonicalise_ddl` and
      saved as fixtures. All 10 curated specs have this file.
    verification: |
      `ls crates/brightfield-conformance/vendor/curated/yaml/*.layer2.expected.sql`
      lists 10 files. Each file is non-empty and contains at least one
      `CREATE OR REPLACE VIEW` or `ATTACH` statement.

  - id: ac-14
    ac_type: code
    description: |
      Curated `.expected.yaml` files are updated: `layer_2` value flips
      from `pending` to `pass` for specs whose DDL emission matches the
      expected fixture. Any spec with a deviation-suppressed data source
      uses `suppressed(DEV-NNNN)` instead.
    verification: |
      `grep layer_2 crates/brightfield-conformance/vendor/curated/yaml/*.expected.yaml`
      shows `pass` or `suppressed(DEV-NNNN)` for every curated entry —
      no remaining `pending` values for layer_2.

  - id: ac-15
    ac_type: code
    description: |
      `deviations.yaml` gains entry `DEV-0001` for the ATTACH READ_ONLY
      divergence from Mosaic-web. Fields: `surface: "data source — DuckDB
      attach"`, `mosaic_behaviour: "ATTACH without read-only flag"`,
      `brightfield_behaviour: "ATTACH … (READ_ONLY)"`, `rationale`:
      exploration safety, `affected_specs`: list of curated specs that use
      DuckDB attach (may be empty if no curated spec uses .duckdb files),
      `conformance_layers_suppressed: [2]`.
    verification: |
      `grep DEV-0001 deviations.yaml` returns a match.
      `cargo run --bin generate-deviations` succeeds and
      `DEVIATIONS.md` contains "ATTACH read-only".

  - id: ac-16
    ac_type: gate
    description: |
      `cargo test -p brightfield-sql` passes all unit tests. `cargo test -p
      brightfield-conformance` passes, including the now-active layer-2 gate
      for curated corpus. `cargo check --workspace` compiles without
      warnings.
    verification: |
      CI-equivalent: `cargo test --workspace` exits 0. `cargo check
      --workspace` exits 0 with no warnings.

  - id: ac-17
    ac_type: code
    description: |
      Error-path dispatch coverage: `DataSourceKind::Typed(s)` without a
      `file:` key returns `EmitError::InvariantViolation`.
      `DataSourceKind::Opaque` returns `EmitError::InvariantViolation`.
      A `File` source with an unknown extension (e.g. `.xlsx`) returns
      `EmitError::UnknownFormat { extension: "xlsx" }`.
    verification: |
      Unit test `dfsql_typed_without_file_is_invariant_violation`:
      construct a DataSource with `Typed("spatial")` and no file extra →
      `EmitError::InvariantViolation`. Unit test
      `dfsql_opaque_is_invariant_violation`: `Opaque` source →
      `EmitError::InvariantViolation`. Unit test
      `dfsql_unknown_extension_errors`: `file: data.xlsx` →
      `EmitError::UnknownFormat` with `extension: "xlsx"`.

ontology_schema:
  name: "DataSourceEmitter"
  description: "Pure-function emitter translating DataSource AST nodes into DuckDB SQL strings — CREATE OR REPLACE VIEW per source at spec-mount time."
  fields:
    - name: "SourceDdl"
      type: "struct"
      description: "{ view_name, sql, source_kind } — one emitted DDL statement per data source."
    - name: "SourceKindTag"
      type: "enum"
      description: "Parquet | Csv | Json | Spatial | DuckDb | InlineRows | Query — classifies the emission arm."
    - name: "EmitError"
      type: "thiserror enum"
      description: "UnknownFormat | InlineRowLimit | InvariantViolation — errors during emission."
    - name: "emit_sources"
      type: "fn"
      description: "(&Spec, Option<&Path>) -> Result<Vec<SourceDdl>, EmitError> — the public entry point."
    - name: "canonicalise_ddl"
      type: "fn"
      description: "(statements: &[SourceDdl]) -> String — deterministic canonical form for snapshot comparison."
    - name: "DataSourceEmitter"
      type: "module"
      description: "source.rs — per-DataSourceKind dispatch functions for Parquet, CSV, JSON, spatial, DuckDB, inline, query."

evaluation_principles:
  - principle: "Pure emission — no I/O, no DuckDB connection, deterministic output from the same input."
    weight: 0.30
  - principle: "Corpus-grounded — all 10 curated specs emit correct DDL verified by snapshot fixtures."
    weight: 0.25
  - principle: "Honest conformance — layer-2 flips from Pending to a real pass/fail gate for DDL; plot-SELECT stays Pending."
    weight: 0.20
  - principle: "Additive surface — ParseOutput.base_dir and brightfield-sql crate extend without breaking existing callers or tests."
    weight: 0.15
  - principle: "Card 0003 readiness — crate scaffold, SourceDdl type, and render.rs are designed for extension."
    weight: 0.10

exit_conditions:
  - "`cargo test --workspace` passes (all existing + new tests)."
  - "All 10 curated corpus specs have `.layer2.expected.sql` siblings."
  - "Layer-2 conformance gate runs and passes for curated corpus."
  - "`cargo check --workspace` compiles without warnings."
  - "`deviations.yaml` includes DEV-0001 and `DEVIATIONS.md` is regenerated."

