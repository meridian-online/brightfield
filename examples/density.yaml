meta:
  title: Density (2D) — Brightfield example
  description: |
    A 2D `density` mark — a kernel-density estimate over (x, y), drawn as a grid
    of circles whose opacity encodes local density. The lowerer equiwidth-bins
    both axes (here `thresholds: 12`) and the renderer smooths the histogram.

      cargo run -p brightfield-app -- examples/density.yaml

    Headless:

      BRIGHTFIELD_DUMP_PNG=density.png cargo run -p brightfield-app -- examples/density.yaml
