[package]
name = "brightfield-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Brightfield application: spec-driven chart visualisation in a GPUI window"

[[bin]]
name = "brightfield"
path = "src/main.rs"

[dependencies]
brightfield-spec = { path = "../brightfield-spec" }
brightfield-sql = { path = "../brightfield-sql" }
brightfield-engine = { path = "../brightfield-engine" }
brightfield-render = { path = "../brightfield-render" }
brightfield-ui = { path = "../brightfield-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", package = "gpui" }
# The authoring workspace shell (card 0017): DockArea, Panel, code editor,
# Root notifications. Pinned by exact commit (its zed pin matches ours,
# 1d217ee); tree-sitter-yaml is the only grammar feature — the spec editor's
# language.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b7e63cc2", features = ["tree-sitter-yaml"] }
# Their bundled icon SVGs (no fonts) — `.with_assets(Assets)` at the entrypoint.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "b7e63cc2" }
serde_json = "1"
arrow = { version = "58", default-features = false }
vello = "0.9"
image = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", package = "gpui_macos", features = ["runtime_shaders", "font-kit"] }

[dev-dependencies]
# TestAppContext for the panel-shim tests (aws_ac02/ac06) — entities without
# a real window. Dev-only: `cargo run`/`cargo build` never see this feature.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", package = "gpui", features = ["test-support"] }

[lints]
workspace = true
