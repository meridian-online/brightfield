name: lint

# The lint steps that need no Mac, on Linux: each pull request, each merge to
# `main`, and on demand. A pull request's gate is `cargo xtask gate <pr>` on the
# reference Mac, which runs every step and posts the `local-gate` status a merge
# waits on; this run tells a pull request about a formatting slip or a comment
# claim that does not resolve within a minute or two, before the gate does.
#
# `clippy`, `check-release` and `doc` build the workspace's dependency graph,
# and standing the winit/wgpu window stack up on Linux needs the
# system-dependency matrix (Vulkan, wayland/X11, xkbcommon, fontconfig) that
# `test.yml` records as unvalidated in this repo, so they are not here. They
# run in `lint-macos.yml`, by hand, and the Mac Studio's nightly
# (`cargo xtask nightly`) runs them on `main` each night with every other step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A workflow of its own, alongside `public-hygiene` rather than a job inside
# `test`: these steps run no tests and render nothing, so they should report in
# minutes without waiting on the suite, and should still report when the suite
# is red.
#
# Each step below calls one step of `cargo xtask ci` by name, the command a
# local run uses, so this job runs what that command runs and a step name the
# command does not carry fails here with a line naming it.
jobs:
  fmt-citations:
    # Linux, since nothing here builds the workspace: the command builds the
    # `xtask` crate alone, `cargo fmt` reads source without compiling it, and
    # the citation checker is a Python script over the diff.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The same exact pin as `test` and `public-hygiene`, so a red run here is
      # reproducible with the `cargo +1.95.0 ...` the local loop uses: rustfmt's
      # output moves between releases.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo xtask ci --step fmt

      # `cargo doc` resolves what a comment writes AS a link. It says nothing
      # about the same claim written as prose — "`brightfield-sql`'s
      # `AGGREGATE_COUNT_COL`", which lives in brightfield-render and was
      # asserted wrongly twice in two days, both times one grep from refutation.
      # This checks those, and reports at added comment lines, so it stops new
      # claims rather than auditing old ones. Its completeness rule reads the
      # unchanged neighbours of an added line — a sentence wraps — but reports
      # at the line the quantifier is on, so a reword beside old debt is green.
      # The script refuses to report success when it cannot resolve a merge base,
      # so a shallow checkout reddens here rather than passing over an unread
      # diff. This unshallows instead of relying on that.
      - name: comment citations resolve
        run: |
          git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main
          cargo xtask ci --step comment-citations

      # The gate proves it can still fail, every run. This repo already carries
      # checkers that report without gating; the way that happens is that
      # nobody notices the day detection quietly stopped working.
      - name: comment citations — self-test
        run: cargo xtask ci --step comment-citations-selftest
