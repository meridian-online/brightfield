[package]
name = "brightfield-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless chart rendering: Mosaic spec + Arrow data -> Vello scene"

[dependencies]
brightfield-spec = { workspace = true }
# Asset-graph + layout types for the protocol DAG scene —
# UI-framework-free and vello-free by contract, so this crate stays framework-free.
brightfield-protocol = { workspace = true }
# Meridian design tokens (chart ink, Harbour palette, bundled Inter font).
# MIT and dependency-free, so the render crate stays framework-free.
meridian-design = { workspace = true }
arrow = { workspace = true, features = ["chrono-tz"] }
# `wgpu` feature: this crate now owns the framework-free render/host seam
# (`canvas_host` traits + `VelloRenderer`) that the egui shell implements, so it
# needs `vello::wgpu` + `vello::Renderer` in the normal build, not just dev.
vello = { workspace = true, features = ["wgpu"] }
kurbo = { workspace = true }
peniko = { workspace = true }
skrifa = "0.42"
indexmap = { workspace = true }
# Blocking wait on wgpu adapter/device creation + readback polls (VelloRenderer).
pollster = { workspace = true }
# GeoJSON parsing for the geo mark. Already vendored via
# brightfield-spec, so cargo-deny stays clean.
serde_json = { workspace = true }

[features]
# GPU-backed VelloRenderer tests (opt-in: they create a real wgpu device).
gpu-tests = []
# Turns on vello's bump-allocator readback so a render can be asked whether it
# drew everything. Vello downloads its `BumpAllocators` only when `debug_layers`
# is on (`robust = cfg!(feature = "debug_layers")` in its async render path), so
# without this the counters come back `None`. Off in every normal build and in
# CI — it makes a frame pay a GPU→CPU readback. Gates `tests/vello_bump_ceiling.rs`.
vello-bump-probe = ["vello/debug_layers"]

[dev-dependencies]
vello = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true
