  test asserts propagate_param does not clobber selection_state — landing
  0005 first means this test exercises the new chained-walk body,
  proving the rally seam on the actually-shipping behaviour. 0006's
  structural additions (SpecAnalysis field, Vec<BrushBinding> refactor,
  clear_selection method, SelectionDispatcher::clear trait method) rebase
  cleanly on top. Stacked PRs:
  rally/reactive-parameters-runtime -> main, then
  rally/cross-filtered-selections-interactors -> rally/reactive-parameters-runtime.
