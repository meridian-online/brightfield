name: license-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The command runs through cargo, so the job installs the toolchain
      # rust-toolchain.toml pins, the same pin as test.yml, lint.yml and
      # release.yml. cargo-deny itself reads Cargo.toml and Cargo.lock and
      # never invokes rustc.
      - uses: dtolnay/rust-toolchain@1.95.0

      # cargo-deny at an exact version, the one cargo-deny-action@v2 fetched
      # when this job ran through that action, so moving to the command did
      # not move the checker. Bump it here and locally together.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # Two checks, two steps, so a red run names its gate directly. Each calls
      # one step of `cargo xtask ci`, which runs `cargo deny --all-features
      # check <licenses|advisories>` as the action did.
      #
      # Licenses: every dependency must carry a permissive licence from the
      # deny.toml allow-list (MIT binaries).
      - name: licenses
        run: cargo xtask ci --step deny-licenses

      # Advisories: the RUSTSEC feed over the graph we actually ship. Gated
      # here since the shell cutover removed the gpui-carried advisory surface
      # (async-std, rustybuzz-via-usvg et al.) — a finding now means a real
      # vulnerability in a surviving dependency. Resolve with a bump, or waive
      # in deny.toml [advisories] with a written reason; no bare ignores.
      #
      # `always()` so a red licence step still reports advisories here. A local
      # `cargo xtask ci` stops at the first red step instead and lists this one
      # as skipped.
      - name: advisories
        if: always()
        run: cargo xtask ci --step deny-advisories
