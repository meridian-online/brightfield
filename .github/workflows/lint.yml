name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A workflow of its own, alongside `public-hygiene` rather than a job inside
# `test`:
#
# * `test` runs the whole suite behind a 60-minute ceiling, including the
#   egui_kittest pixel tier. These three gates run no tests and render nothing,
#   so a formatting slip, a lint regression or a dead doc link should report in
#   minutes without waiting on it — and should still report when the suite is
#   red.
# * `test` cancels in-progress runs per ref. This one is cheap enough not to
#   need cancelling, and a lint regression should be reported on every pushed
#   commit.
#
# The tree was made clean under each gate before that gate landed: `cargo fmt
# --all` over the workspace, then a warning-by-warning clippy triage in which
# every lint is either fixed or carries an `#[allow]` with a written reason,
# then a site-by-site rustdoc triage in which every finding is fixed and no
# `#[allow]` was added at all. Each gate is green on arrival, not aspirational —
# and each has been watched fail on a deliberately broken tree before landing.
jobs:
  fmt-clippy:
    # macos-15, matching `test`, and NOT the ubuntu-latest that `public-hygiene`
    # uses. Not a copy-paste: clippy has to build the dependency graph to lint
    # it, and standing the winit/wgpu window stack up on Linux needs the
    # system-dependency matrix (Vulkan, wayland/X11,
    # xkbcommon, fontconfig) that `test.yml` records as unvalidated in this
    # repo, so an ubuntu runner here would be a gate nobody had seen pass. The
    # cheap-runner win is real but it belongs to whoever validates that matrix;
    # until then this job is honest about needing the same host as `test`.
    #
    # It is still far cheaper than `test`: no test executes, nothing renders,
    # and `cargo clippy` stops at check.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The same exact pin as `test`, for the same reason: a red gate here has
      # to be reproducible with the `cargo +1.95.0 ...` the local loop uses.
      # Clippy's lint set moves between releases, so an unpinned toolchain would
      # let a newer rustc turn this red on a commit that changed nothing.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      # Shared with `test`'s cache. The git dependencies (the design-system
      # and arcform pins) plus wgpu/vello dominate a cold run.
      - uses: Swatinem/rust-cache@v2

      # `fmt` first: it builds nothing, so a formatting slip reports before
      # clippy has checked a single crate.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # `--all-targets` so tests, benches and examples are linted too. This is
      # load-bearing: the deny-by-default lint that used to make clippy exit 101
      # in this repo lived in a `brightfield-spec` test, and a lib-only run
      # would never have seen it.
      #
      # NOT `--locked`, deliberately: `test` already fails on lockfile drift, so
      # repeating it here would only report the same problem twice.
      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # rustdoc, for the one thing the four gates above cannot see: a doc link
      # that names something which does not exist. `cargo doc` resolves every
      # intra-doc link and warns on the ones it cannot; `-D warnings` in
      # RUSTDOCFLAGS turns that into a failure.
      #
      # This is here because such a link did ship: a module doc named the
      # renderer it delegates to by a name that file has never called, and that
      # resolves to nothing from where it is written. fmt/clippy/test/deny/
      # hygiene were all green on it, and only a human reviewer caught it. A
      # dead link in a crate whose whole job is to be the shared vocabulary is
      # worse than a dead link elsewhere — it is read by everyone building
      # against the contract.
      #
      # `--no-deps` so a warning in a dependency's docs cannot redden this repo.
      #
      # `--document-private-items` is not decoration, and it is the stricter of
      # the two forms this could take. Measured on the tree this gate landed
      # against, it is a strict SUPERSET of the plain public-only run:
      #
      # * everything the public run flags, it flags too — including
      #   `private_intra_doc_links` (a public item linking a private one), which
      #   still fires under the flag, only with a different note ("resolves only
      #   because you passed --document-private-items, but will break without").
      #   Passing the flag does not buy silence on that class.
      # * and it additionally resolves the links written inside private items,
      #   which the public run never looks at. Three of the dead links this
      #   commit fixes lived exactly there — two on private fields of
      #   `ProtocolNav`, one on a private method in `crossfilter`. The
      #   public-only form would have shipped all three: measured on this tree,
      #   private-items finds 43 sites and public-only 40, and the 40 are a
      #   subset of the 43, not a different set.
      #
      # A doc comment on a private item is read by the next person to change
      # that code, which is the reader this repo has most of. So the gate checks
      # every doc comment in the workspace, not the subset that reaches docs.rs.
      #
      # The tree was made clean under BOTH forms before this landed, and no
      # `#[allow(rustdoc::...)]` was added anywhere to get there: every one of
      # the 43 findings was fixed at the source. Where a public doc pointed at
      # a private helper, the link became plain code formatting naming it as
      # private, rather than the helper being made public to satisfy a link —
      # doc links do not get to widen an API.
      - name: cargo doc (intra-doc links must resolve)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

      # `cargo doc` resolves what a comment writes AS a link. It says nothing
      # about the same claim written as prose — "`brightfield-sql`'s
      # `AGGREGATE_COUNT_COL`", which lives in brightfield-render and was
      # asserted wrongly twice in two days, both times one grep from refutation.
      # This checks those, on added comment lines only, so it stops new claims
      # rather than auditing old ones.
      # The script refuses to report success when it cannot resolve a merge base,
      # so a shallow checkout reddens here rather than passing over an unread
      # diff. This unshallows instead of relying on that.
      - name: comment citations resolve
        run: |
          git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main
          scripts/check-comment-citations.py

      # The gate proves it can still fail, every run. This repo already carries
      # checkers that report without gating; the way that happens is that
      # nobody notices the day detection quietly stopped working.
      - name: comment citations — self-test
        run: scripts/check-comment-citations.py --self-test
