[package]
name = "brightfield-spec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Parser for the Mosaic declarative visualisation spec — the stable contract driving brightfield's query engine, coordinator, and renderer."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
indexmap = { version = "2", features = ["serde"] }

# No miette — library boundary discipline (see interview Q4).

[dev-dependencies]
# Integration tests are pure std; no extra crates.

[lints]
workspace = true
