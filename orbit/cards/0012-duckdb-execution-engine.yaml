feature: "DuckDB execution engine"
as_a: "analyst viewing a dashboard"
i_want: "emitted SQL to run against real data and return results I can see"
so_that: "specs go from parse to pixels — not just to SQL text that sits inert"

scenarios:
  - name: "Spec parses and executes end-to-end"
    given: "a valid spec YAML and a parquet data source"
    when: "the engine processes the spec"
    then: "DuckDB runs the emitted queries and returns Arrow record batches for each mark"
    source_lines: "brightfield-brief.md: 'In-process DuckDB instance executes all analytical SQL.'"

  - name: "Data sources are loaded from the spec"
    given: "a spec declares data sources pointing to local parquet or CSV files"
    when: "execution begins"
    then: "each data source is registered as a DuckDB table before queries run"
    source_lines: "brightfield-brief.md: 'Direct data-source loading from Parquet, CSV, and JSON.'"

  - name: "Parameterised queries re-execute on param change"
    given: "a query references a reactive parameter"
    when: "the parameter value changes"
    then: "the query re-executes with the new value and returns updated results"
    source_lines: "brightfield-brief.md: 'When a param updates, all subscribing clients re-query and re-render.'"

  - name: "Execution errors surface clearly"
    given: "a query references a column that does not exist in the data"
    when: "execution runs"
    then: "the error identifies the failing query, the missing column, and the data source"

  - name: "Results flow as Arrow record batches"
    given: "a query executes successfully"
    when: "results are returned"
    then: "they arrive as Arrow record batches in shared memory — no serialisation boundary"
    source_lines: "brightfield-brief.md: 'Apache Arrow as the in-process data transport.'"

maturity: "emerging"

specs:
  - orbit/specs/2026-04-22-duckdb-execution-engine/spec.yaml

references:
  - "brightfield-brief.md"
  - "duckdb-rs: native Arrow record batch returns"
  - "Mosaic: DuckDB-WASM execution coordinator"
