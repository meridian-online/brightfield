[package]
name = "brightfield-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless chart rendering: Mosaic spec + Arrow data -> Vello scene"

[dependencies]
brightfield-spec = { path = "../brightfield-spec" }
# Meridian design tokens (chart ink, Harbour palette, bundled Inter font).
# MIT, dependency-free and gpui-free, so the render crate stays framework-free.
meridian-design = { git = "https://github.com/meridian-online/design", rev = "9dd5d3882a38aa665d74544f87d412dab5129c24" }
arrow = { version = "58", default-features = false, features = ["chrono-tz"] }
vello = "0.9"
kurbo = "0.13"
peniko = "0.6"
skrifa = "0.42"
indexmap = "2"
# GeoJSON parsing for the geo mark (card 0008). Already vendored via
# brightfield-spec, so cargo-deny stays clean.
serde_json = "1"

[dev-dependencies]
vello = { version = "0.9", features = ["wgpu"] }

[lints]
workspace = true
