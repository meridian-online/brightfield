feature: "Axis and plot titles — labelled charts you can tell apart"
as_a: "analytics author composing a multi-view dashboard"
i_want: "each plot's axes to carry their field-name titles and each plot an optional title of its own"
so_that: "a reader can tell which chart is which and what each axis measures — the dashboard is self-describing, matching the labelled axes every other charting tool ships"

scenarios:
  - name: "Axis titles derived from the encoding"
    given: "a plot whose x and y channels are bound to columns"
    when: "it renders"
    then: "each positional axis shows its field name as a title — x below the tick labels, y rotated up the left margin — derived from the encoding by default, so a bare spec already reads as a labelled chart"

  - name: "Explicit title overrides the derived field name"
    given: "an author who wants a friendlier label than the raw column name (or none at all)"
    when: "they set an explicit axis title in the spec (Mosaic-style xLabel / yLabel), or an explicit empty string"
    then: "the explicit text overrides the derived field name; an explicit empty string suppresses that axis title — most-specific-wins, literal-only, matching the axis-inset attr convention"

  - name: "A per-plot title identifies the chart"
    given: "a multi-view dashboard where each plot shows different data"
    when: "a plot declares a title"
    then: "it renders above the plot frame so the chart is identifiable at a glance; absent → no title and no reserved space"

  - name: "The cross-filter dashboard becomes legible (the motivating case)"
    given: "the crossfilter example — two dot plots with no distinguishing marks"
    when: "it renders with this feature"
    then: "each axis is labelled with its field, so the two charts are immediately distinguishable — the finding that motivated the card"

  - name: "Titles are data ink, and the layout grows to fit them"
    given: "titles add text outside the plot frame"
    when: "the plot lays out"
    then: "the margins grow to fit each title without overlapping tick labels, marks, or the axis-inset spacing; because titles are chart content (not authoring chrome), they render in authoring AND presentation AND the headless PNG dump — so every example re-baselines behind a before/after gallery, and an untitled plot is unchanged"

goal: "Plots render their positional-axis titles (the field name from the encoding by default; overridable via Mosaic-style label attrs, explicit-empty suppresses; y rotated) plus an optional per-plot title, with the frame margins growing to fit — making a multi-view dashboard self-describing instead of a set of indistinguishable panels. Titles are DATA INK, not authoring chrome: unlike the keyboard grammar (byte-identical, chrome-only) this CHANGES the rendered scene, so it re-baselines every example PNG behind a before/after gallery (the axis-inset ceremony). Field-name plumbing carries the encoding's column name from the spec through to the axis renderer; the margin budget must compose with the axis-inset range pull without clipping."

maturity: "emerging"

specs:
  - "orbit/specs/2026-07-12-axis-plot-titles/spec.yaml"

references:
  - "In-app eyeball finding (2026-07-12, Hugh): cross-filter charts have no axis titles or plot titles — 'I can't see any labelled axes… I don't know which chart is which.' The motivating need."
  - "orbit/specs/2026-07-11-axis-inset/spec.yaml: the axis margin/range work titles must compose with — DEFAULT_SCALE_INSET pulls ranges inward; titles add ink OUTSIDE the frame, so the two budgets interact and must not clip."
  - "crates/brightfield-render/src/axis.rs: renders tick labels + axis lines today, no axis title; crates/brightfield-render/src/text.rs (draw_text/LABEL_COLOUR/LABEL_SIZE) is the text primitive — y-axis rotation support is an open design question."
  - "Mosaic/Vega-Lite axis title semantics: axis title defaults to the field name, overridable per axis; the dialect attrs (xLabel/yLabel or axis.title) are the surface to mirror."
