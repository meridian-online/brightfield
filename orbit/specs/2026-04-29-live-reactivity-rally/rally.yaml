order_rationale: >
  Disjointness check found shared file modification surface on
  crates/brightfield-engine/src/lib.rs (different methods —
  propagate_param body for 0005, new clear_selection for 0006) and
  crates/brightfield-spec/src/analysis.rs (free function topological_descendants
