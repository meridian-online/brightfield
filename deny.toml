# Dependency gates: `cargo deny check licenses` + `cargo deny check advisories`
#
# Licenses: Brightfield ships MIT binaries; every dependency must carry a
# permissive licence from the allow-list below. The list was born as the
# firewall around the zed/gpui git tree (which carried GPL-3.0 crates); that
# tree is gone, and the gate stays as general hygiene — any copyleft entrant
# fails loudly in CI.
#
# Advisories: the RUSTSEC feed, gated in CI alongside licenses. The advisory
# surface that used to fire here (async-std, rustybuzz-via-usvg, et al.)
# arrived through gpui and left with it; a new finding means a REAL advisory
# in the graph we actually ship — resolve it with a bump, or waive it below
# with a written reason.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "bzip2-1.0.6",
  "NCSA",
  "CDLA-Permissive-2.0",
  # MPL-2.0 is file-scoped weak copyleft: acceptable in an MIT binary provided
  # the MPL-covered files' source stays available (it is: crates.io). Flag any
  # new MPL entrant in review rather than blocking the build.
  "MPL-2.0",
  # 0BSD (BSD Zero Clause) is OSI-approved and maximally permissive — public-
  # domain-equivalent, no attribution clause.
  "0BSD",
  # Open-font licenses for egui's bundled default fonts (Ubuntu-Light + the
  # Noto/emoji fallbacks the egui default FontDefinitions ship). Both are
  # permissive OSS font licenses, fine to redistribute in an MIT binary; they
  # cover font data only, not code. Entrant: egui/eframe.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[advisories]
# No waivers. Anything the RUSTSEC feed flags in the surviving graph must be
# resolved (bump the dependency) or waived HERE with a written justification —
# a bare id with no reason does not pass review.
ignore = []
