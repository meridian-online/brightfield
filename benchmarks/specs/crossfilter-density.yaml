# Scaling scenario: a brushed scatter re-aggregating a 1D density, over one
# Parquet table.
#
# The left plot is a raw dot scatter carrying the interval brush; the right
# plot is a `densityX` — the density lowerer equiwidth-bins and counts in
# DuckDB, so a brush step re-runs a full-table aggregation however many rows
# the table holds, and the result set the renderer sees stays O(bins). The
# data path is what scales with row count here, not the picture.
#
# WHY THE DENSITY BINS THE BRUSHED COLUMN: this scenario predates the
# selection-placement change that lets an aggregating mark be cross-filtered
# by any base column (the predicate now filters the aggregation's INPUT
# rows). It keeps its original shape — brushing the density's own column —
# so the measured series stays comparable with earlier runs of the same
# harness.
#
# NOTE ON THE PRE-AGGREGATION LAYER: `value_a` is ~unique per row, and the
# layer's first cut enters active interval dimensions into the cube at RAW
# data values (exactness over size). The derived cube for this scenario
# therefore grows with the table, and the layer buys little here by design —
# the bounded-cardinality twin (crossfilter-binned-density) measures the
# shape the cube is built for. Both facts belong in the record.
#
# `__DATA_PARQUET__` is substituted by the harness with the absolute path of
# the generated dataset before the spec is loaded. The dataset's columns are a
# pure function of the row index — see the harness's data module.
meta:
  title: Baseline — brushed scatter re-aggregating a density
params:
  brush: { select: crossfilter }
data:
  t:
    file: __DATA_PARQUET__
hconcat:
  - plot:
      - mark: dot
        data: { from: t, filterBy: $brush }
        x: value_a
        y: value_b
      - select: intervalX
        as: $brush
    width: 440
    height: 300
  - plot:
      - mark: densityX
        data: { from: t, filterBy: $brush }
        x: value_a
    width: 440
    height: 300
