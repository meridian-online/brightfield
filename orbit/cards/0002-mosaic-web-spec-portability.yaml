feature: "Mosaic web spec portability"
as_a: "analyst already using Mosaic on the web"
i_want: "my existing spec files to work in brightfield without modification"
so_that: "I can migrate to a native, higher-performance rendering without rewriting my dashboards"

scenarios:
  - name: "Reuse an unmodified Mosaic web spec"
    given: "I have a Mosaic spec that renders in the web environment"
    when: "I open that same spec file in brightfield"
    then: "brightfield produces output equivalent to the web rendering without requiring spec changes"
    source_lines: "brightfield-brief.md: 'Specs authored for Mosaic's web environment should work unchanged.'"

  - name: "Inherit Mosaic's example library and documentation"
    given: "I reference Mosaic's published examples and documentation"
    when: "I load those example specs directly"
    then: "they render in brightfield as documented against Mosaic's schema"
    source_lines: "brightfield-brief.md: 'By retaining Mosaic's spec format, the platform inherits the existing body of example specs and documentation.'"

  - name: "Unsupported spec features are reported explicitly"
    given: "a Mosaic web spec uses a feature brightfield has not implemented natively"
    when: "I open the spec"
    then: "brightfield identifies the unsupported feature and surfaces it to the user rather than silently omitting or approximating it"
    source_lines: "brightfield-brief.md: 'edge cases will emerge. Some Mosaic spec features depend on Observable Plot's rendering quirks or CSS layout model. These will need native equivalents or documented deviations.'"

  - name: "Documented deviations where native equivalents apply"
    given: "a spec uses a feature whose web rendering depends on Observable Plot quirks or CSS layout specifics"
    when: "brightfield renders it"
    then: "brightfield applies its documented native equivalent and the deviation from web output is recorded in the brightfield docs rather than being an accident"
    source_lines: "brightfield-brief.md: 'These will need native equivalents or documented deviations.'"

  - name: "Reference-spec conformance suite guards portability across releases"
    given: "a curated set of Mosaic web example specs drawn from the Mosaic docs"
    when: "brightfield runs its conformance suite"
    then: "each reference spec renders with output matching the web version to within documented deviations, and regressions fail the suite"
    source_lines: "author-directed during review (makes the 'works unchanged' promise in brightfield-brief.md §2 testable)"

goal: "A reference set of Mosaic web example specs renders equivalently in brightfield."

maturity: "planned"

specs:
  - orbit/specs/2026-04-20-mosaic-web-spec-portability/spec.yaml

references:
  - "brightfield-brief.md"
