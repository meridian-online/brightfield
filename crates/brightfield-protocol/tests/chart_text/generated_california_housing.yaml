# Brightfield wrote this dashboard by walking california_housing_sample.csv's own columns: one
# tile per column, each chosen from what that column holds, and every
# tile brushing into one shared crossfilter selection. Nobody authored
# it — and it is an ordinary spec, so change anything in it.
meta:
  title: "california_housing_sample.csv"
params:
  sel: { select: crossfilter }
data:
  opened:
    file: '/data/california_housing_sample.csv'
hconcat:
  - vconcat:
    # longitude: a coordinate pair with latitude, found by its name → point-map
    - plot:
      - mark: dot
        data: { from: opened }
        x: 'longitude'
        y: 'latitude'
        fill: "#b7b3ae"
      - mark: dot
        data: { from: opened, filterBy: $sel }
        x: 'longitude'
        y: 'latitude'
      - select: intervalXY
        as: $sel
      projectionType: equirectangular
      width: 620
      height: 620
    - vspace: 0
  - hspace: 42
  - vconcat:
    # median_income: no trusted label, and DuckDB stored it as DOUBLE → binned-histogram
    - plot:
      - mark: rectY
        data: { from: "opened" }
        x: { bin: "median_income" }
        y: { count: }
        fill: "#b7b3ae"
      - mark: rectY
        data: { from: "opened", filterBy: $sel }
        x: { bin: "median_income" }
        y: { count: }
      - select: intervalX
        as: $sel
      xDomain: Fixed
      xLabel: "median_income"
      width: 380
      height: 100
    # house_age: no trusted label, and DuckDB stored it as BIGINT → binned-histogram
    - plot:
