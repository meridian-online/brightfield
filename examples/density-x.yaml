meta:
  title: Density (1D) — Brightfield example
  description: |
    A 1D `densityX` mark — a kernel-density estimate of the distribution of `x`,
    drawn as a filled curve. The lowerer equiwidth-bins x and counts; the
    renderer convolves the histogram with a Gaussian (Silverman bandwidth). The
    perpendicular axis is a normalised [0, 1] density scale.

      cargo run -p brightfield-app -- examples/density-x.yaml

    Headless:

      BRIGHTFIELD_DUMP_PNG=density-x.png cargo run -p brightfield-app -- examples/density-x.yaml
