[package]
name = "brightfield-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process DuckDB execution engine for Mosaic spec pipelines"

[dependencies]
brightfield-spec = { workspace = true }
brightfield-sql = { workspace = true }
# `parquet` links DuckDB's Parquet reader into the binary. Without it
# `read_parquet` is an extension DuckDB autoinstalls on first use — downloaded
# from extensions.duckdb.org into ~/.duckdb — so a local Parquet opened on a
# machine with no network and a cold extension cache does not open at all, and
# on a machine with a network its first open reaches it. The front door ships
# a bundled Parquet whose whole promise is that it needs neither.
# `the_local_starts_open_with_the_network_denied_and_a_cold_extension_cache` in
# the shell's `tests/front_door.rs` reddens when this feature is off.
duckdb = { workspace = true, features = ["parquet"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The workspace's lints, restated: a member's `[lints]` table either inherits the
# workspace's whole table or carries its own, never both. The one difference is
# `unsafe_code`, `deny` here and `forbid` in the workspace, because `forbid` cannot
# be relaxed by the `#[allow(unsafe_code)]` on the one function that calls DuckDB's
# C API (`condition_statement_count` in `src/lib.rs`).
[lints.rust]
unused_must_use = "warn"
missing_docs = "allow"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
