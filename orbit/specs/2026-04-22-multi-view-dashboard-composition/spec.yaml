goal: "Compute positioned layout trees from Mosaic spec ASTs — hconcat, vconcat, hspace, vspace arrange plots, inputs, and legends into dashboards with pixel-accurate coordinates."

constraints:
  - "Layout is a pure function of the AST — no I/O, no DuckDB, no runtime data"
  - "Simple box model — sequential stacking with fixed sizes, no flex negotiation"
  - "No new crate — layout lives in brightfield-spec alongside analysis.rs"
  - "No new dependencies — layout is pure computation on existing AST types"
  - "Default sizes: plot 640x400, input 200x32, legend 120x24"

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "Rect struct with x, y, width, height (all f64) exists in layout module"
    verification: "Unit test constructs Rect and verifies field access"

  - id: ac-02
    ac_type: code
    description: "LayoutNode enum mirrors Component variants — Plot, HConcat, VConcat, HSpace, VSpace, Legend, Input, Mark, Interactor — each carrying a Rect and children where applicable"
    verification: "Exhaustive match test compiles (adding a variant without a branch fails)"

  - id: ac-03
    ac_type: code
    description: "compute_layout(spec, viewport) walks spec.root and returns a LayoutTree with positioned nodes"
    verification: "Single-plot spec produces a LayoutNode::Plot with position (0,0) and declared or default size"

  - id: ac-04
    ac_type: code
    description: "hconcat stacks children left-to-right — each child's x is the sum of preceding children's widths"
    verification: "Test with hconcat of two plots verifies second plot's x equals first plot's width"

  - id: ac-05
    ac_type: code
    description: "vconcat stacks children top-to-bottom — each child's y is the sum of preceding children's heights"
    verification: "Test with vconcat of two plots verifies second plot's y equals first plot's height"

  - id: ac-06
    ac_type: code
    description: "hspace and vspace insert fixed pixel gaps between adjacent views"
    verification: "Test with hconcat [plot, hspace(35), plot] verifies gap of 35px between plots"

  - id: ac-07
    ac_type: code
    description: "resolve_space_value parses numeric values as pixels and 'Nem' strings as N * base_font_size (default 16)"
    verification: "Unit tests: 35 -> 35.0, '1em' -> 16.0, '2.5em' -> 40.0"

  - id: ac-08
    ac_type: code
    description: "Nested composition (vconcat inside hconcat) produces grid-like layouts with correct positions"
    verification: "Test with hconcat [vconcat [A, B], vconcat [C, D]] verifies C.x equals A.width and D.y equals C.height"

  - id: ac-09
    ac_type: code
    description: "Plots, inputs, and legends all receive layout positions — no component type is skipped"
    verification: "Test with hconcat [plot, input, legend] verifies all three have non-zero width and sequential x positions"

  - id: ac-10
    ac_type: code
    description: "Plot width/height are read from PlotNode.attributes when present, falling back to defaults"
    verification: "Test with plot declaring height:200 produces LayoutNode with height 200, not 400"

  - id: ac-11
    ac_type: code
    description: "Legend as: bindings already appear in the subscriber graph (verify, not implement)"
    verification: "Test parses legends.yaml corpus spec, runs build_subscriber_graph, verifies toggle and interval params have legend subscribers"

  - id: ac-12
    ac_type: code
    description: "layout module is publicly exported from brightfield-spec lib.rs"
    verification: "Downstream crate can import brightfield_spec::layout::compute_layout"

  - id: ac-13
    ac_type: code
    description: "Vendored corpus specs with composition (legends.yaml, crossfilter.yaml) produce valid layout trees without panics"
    verification: "Integration test parses and lays out all corpus specs containing hconcat/vconcat"

implementation_notes:
  - "New file: crates/brightfield-spec/src/layout.rs"
  - "Modify: crates/brightfield-spec/src/lib.rs to add pub mod layout and re-exports"
  - "LayoutNode is a recursive enum with Vec<LayoutNode> children, matching codebase style (Component, QueryPlan)"
  - "compute_layout walks Component tree recursively — leaf nodes get default/declared sizes, concat nodes sum children"
  - "resolve_space_value: check for 'em' suffix on strings, multiply by base_font_size (default 16.0); integers/floats are pixels"
  - "Spec.root being None produces an empty LayoutTree (no panic)"
  - "The legends.yaml corpus spec is the canonical test case for deeply nested composition with mixed types"

evaluation_principles:
  - principle: "Correctness — layout positions are pixel-accurate for all card scenarios"
    weight: 0.4
  - principle: "Completeness — every Component variant is handled, no silent skips"
    weight: 0.3
  - principle: "Simplicity — minimal code, no over-engineering beyond the box model"
    weight: 0.3

exit_conditions:
  - "All 13 ACs pass"
  - "cargo test in brightfield-spec passes with no regressions"
  - "No new dependencies added to Cargo.toml"

