goal: >
  Legends become interactors (card 0009): `legend: color as: $sel for: <plot>`
  makes a window-hosted legend a selection PRODUCER — clicking a category swatch
  dispatches `col = 'category'` (typed #31 quoting) through the existing
  Session::propagate_selection chain so every view consuming $sel re-filters;
  clicking the same swatch clears (single-select toggle); the legend's
  contributor path is its for:-plot's node path, so self-exclusion keeps the
  source plot unfiltered and the launch-time colour-scale snapshot valid (no
  shared-scale plumbing). Sequential gradient legends and unbound legends stay
  inert. The proven dispatch machinery is reused verbatim — the feature adds a
  producer binding, an additive hit-geometry helper, and one coordinator entry
  point. Recon + contract: tabletop-note.md alongside this spec.

constraints:
  - "Dispatch chain untouched: point_predicate / SelectionValue::Text literal quoting / Session::propagate_selection / clear_selection / the coordinator's absorb+build_plot_scene rebuild loop are reused, not forked. If legend dispatch needs bespoke rebuild ordering, refactor commit_brush's loop into a shared private fn rather than duplicating it."
  - "legend.rs (brightfield-render): render functions byte-unchanged; ONE additive pure helper (swatch_entry_rects) + its unit test allowed, reusing the module's private layout constants. No other brightfield-render changes."
  - "Contributor path = the for:-plot's node path (string-equal to compile_selection's self_source), giving self-exclusion by construction. Do NOT give the legend a distinct contributor path in v1 — that wakes the deferred shared-mutable-scale plumbing."
  - "Hit-testing scoped to Scale::Colour. Sequential legends: no listeners, no hitbox. Legends without as:: remain display-only exactly as shipped in 0016."
  - "The analysis arm that registers legend option param-refs as SUBSCRIBERS must skip the as: selection binding (today it wires the legend backwards); non-selection param refs in legend options keep their current behaviour."
  - "CrossfilterCoordinator::new's liveness guard must admit a dashboard whose only interactive surface is a bound legend."
  - "No SQL/emit/plan changes; brightfield-engine untouched. HALT GATE: any pre-existing example PNG byte-diff → halt, revert."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "Producer binding: analysis of a spec with `legend: color as: $sel for: name` yields a LegendBinding { selection, contributor path = the for:-plot's node path, colour column resolved from that plot's first mark's Fill/Stroke channel, legend node path }. for:-resolution matches resolve_legends semantics (name attr; sole-colour-plot fallback). The legend is NOT registered as a subscriber of $sel."
    verification: "lcf_ac01 in brightfield-spec: binding fields asserted against a two-plot fixture; subscriber graph for $sel contains marks only (the backwards-wiring trap pinned by a regression test). verifies: capability"
  - id: ac-02
    ac_type: code
    description: "swatch_entry_rects(box_x, box_y, &Scale) -> Vec<Rect> in legend.rs: pure, additive, reusing the module's private constants; returns one rect per category matching the rendered swatch layout (padding + i*entry_spacing, swatch-size square, label extent included in the clickable rect); empty for non-Colour scales."
    verification: "lcf_ac02 in legend.rs's test module: N categories -> N rects at the constants' positions; Sequential/Band -> empty. A diff guard in review confirms render fns unchanged. verifies: capability"
  - id: ac-03
    ac_type: code
    description: "Coordinator dispatch: legend bindings live on CrossfilterCoordinator (like slider_bindings) with one Option<category> toggle state each; commit_legend_click(legend_index, hit: Option<&str>) implements single-select toggle — new category dispatches col = 'cat' via SelectionValue::Text; same category or empty-panel click clears; subscribers rebuild via the existing absorb loop; new() admits legend-only dashboards."
    verification: "lcf_ac03 in brightfield-ui: toggle state machine (new/same/different/empty transitions) + dispatch/clear calls asserted through the coordinator seam; liveness: a legend-only fixture yields Some(coordinator). verifies: capability"
  - id: ac-04
    ac_type: code
    description: "End-to-end through the real session: a legend click filters downstream subscriber views (row counts change), the for:-plot is NOT filtered (self-exclusion via contributor path), toggle-off restores, and existing selections on other columns stay independent."
    verification: "lcf_ac04 in brightfield-ui/tests/crossfilter_integration.rs mirroring crossfilter_point_toggle_x_filters_downstream and crossfilter_plot_does_not_filter_itself, with a categorical column + quoted text literal (escaping case included). verifies: capability"
  - id: ac-05
    ac_type: code
    description: "Element wiring: PlacedLegend/LegendElement gain optional coordinator handle + legend index; a bound Colour legend registers a hitbox and mouse-up hit-test against swatch_entry_rects (element-local coords, border-pad fringe accounted); Sequential or unbound legends register nothing (prepaint/paint identical to 0016 behaviour)."
    verification: "lcf_ac05: view-model/unit coverage that bound-Colour placements carry the coordinator + index and unbound/Sequential ones do not; hit-test mapping unit-tested against entry rects with the pad offset. The physical click is ac-07. verifies: capability (wiring/hit-math); gesture is stand-in"
  - id: ac-06
    ac_type: code
    description: "Spec surface: a `legend: color as: $sel for: <plot>` spec parses clean, preflights Implemented, and a conformance fixture pins it; `legend: symbol as: $sel` still reports Unimplemented at the channel gate; a new example legend-select.yaml (two plots + bound legend) renders headlessly with its PNG unchanged in composition (legend drawn as before — binding adds no pixels)."
    verification: "lcf_ac06 in brightfield-conformance + the example's baseline PNG; vocab guard untouched. verifies: capability"
  - id: ac-07
    ac_type: manual
    description: "In the app on examples/legend-select.yaml: clicking a swatch filters the linked view; clicking it again restores; clicking another swatch switches; clicking empty legend panel clears; the legend's own plot never changes; the gradient legend (raster-legend.yaml) is inert to clicks."
    verification: "cargo run -p brightfield-app -- examples/legend-select.yaml; eyeballed. verifies: stand-in (real thing is clicking the swatch in the macOS app), accepted because GPUI event dispatch needs the window"

gate:
  id: ac-08
  description: >
    cargo test --workspace green (no regressions in crossfilter_integration,
    point-select, slider, or framed-window suites); every pre-existing example
    PNG byte-identical (raster family exempt only until the determinism chore
    lands, then included); brightfield-render diff = the additive helper + test
    in legend.rs only (render fns byte-unchanged); brightfield-engine diff
    limited to one read-only lookup (Session::contributor_predicate) and
    brightfield-sql diff empty [Correction 2026-07-06: the review's major
    finding — legend toggle state must derive from engine state, not a local
    mirror, or any brush/point gesture on the same (selection, contributor)
    slot inverts the toggle — requires the read-only engine seam; "engine diff
    empty" as originally drafted precluded the only correct fix]; display-only
    and Sequential legends behaviourally identical to 0016.

implementation_notes:
  - "Full recon with file:line evidence relayed 2026-07-05 (click-filter-recon agent) — key coordinates: LegendNode ast.rs:284-291; options parse (as: dropped into bag) parse.rs:765-778; subscriber trap analysis.rs:260-269; brushable-binding pattern to mirror analysis.rs:1088-1160; colour column via ChannelMap::from_mark channel.rs:131 + first_mark_channels analysis.rs:1165-1182; swatch layout render_swatch_legend_at legend.rs:124-190, private constants legend.rs:14-26; dispatch chain crossfilter.rs:145-218 -> chart_view.rs:329-383 -> brush.rs:141-167/172-211 -> engine lib.rs:282-359; self-exclusion lower.rs:443-455 + emit.rs:487-491; liveness guard crossfilter.rs:106-114; element mirror chart_element.rs:36-68/115-126/184-206; wiring site main.rs:985; integration tests crossfilter_integration.rs:390/461."
  - "Border-pad fringe: LegendElement paints with a pad_logical inflation (legend_element.rs:191-256) — subtract it when mapping click coords to entry-rect space."
  - "Tabletop contract (values/halt/kill/verification posture): tabletop-note.md alongside this spec — read before starting."

deferred:
  - "Multi-select (shift-click union) and range-brushing on gradient legends."
  - "Legend-filters-own-source variant (distinct contributor path) — blocked on the shared-mutable-scale plumbing, same as hosted-legend live refresh."
  - "Opacity/symbol legend channels (still Unimplemented at the channel gate)."
  - "Highlight-instead-of-filter legend mode (card 0010's dim-non-selected)."

ambiguity_score: 0.1
ambiguity_notes: >
  Closed space: the recon fixed every mechanism with file:line evidence and the
  tabletop note locked the four judgment calls (contributor path = for:-plot;
  single-select toggle; Colour-only hit-testing; additive-helper amendment to
  the legend.rs freeze). Residual implementer freedom: LegendBinding's exact
  shape/location in analysis.rs, and whether the clickable rect includes the
  label text width (recommended: yes, swatch+label row) — neither affects the
  contract.
