# Tag-driven release: two artifacts per darwin target, from one build.
#
# The packaging IS scripts/package.sh — this workflow only runs it per target
# and lifts the results onto a GitHub release, so a release asset and a locally
# packaged artifact are the same thing, byte-for-byte in construction. Each
# target produces a `brightfield-<tag>-<target>.tar.gz` and a
# `brightfield-<tag>-<target>.dmg`, each with a `.sha256` sidecar.
#
# The tarball's layout is the contract the install.meridian.online convention
# consumes (`<tool>-<version>-<target>.tar.gz` + `.sha256` per asset); when this
# repo onboards there, the script that site serves resolves exactly these names
# by `uname`. Its interior is unchanged by the disk image's arrival, so the
# install script, the Homebrew formula and every pinned older tag keep resolving
# with no shape detection anywhere.
#
# The disk image carries `Brightfield.app` and an `/Applications` alias. It
# exists because a notarization ticket cannot be stapled to a `.tar.gz` and
# because `open` on a bare Mach-O starts Terminal — so a download button needs a
# bundle, and a bundle needs a container that Finder presents as one.
#
# Two macOS targets, deliberately. test.yml runs the suite on macOS only,
# because that is the one hosted runner where the winit/wgpu window stack is
# validated; releasing for platforms the suite has never run on would ship
# binaries nobody has proven. The Linux and Windows legs (and the install-site
# dispatch job, which also wants the full five-target set — see the finetype
# release workflow for the canonical shape) land when those platform stacks are
# validated in CI first.
#
# A separate `verify` job re-proves the air-gapped claim against the packaged
# aarch64 tarball (scripts/verify-airgapped.sh: network-denial negative
# control, then the packaged binary renders a chart and a Protocol manifest
# inside the jail). It reports independently and does NOT gate the release —
# see the comment above the job for why. The x86_64 leg is a cross-compile
# from the arm64 runner: its Mach-O linkage audit still runs (otool reads any
# arch), but it cannot be executed there, so its air-gapped run is the native
# one's by construction — same source, same packaging, different codegen
# target. If the hosted runner turns out to have no window session for the
# verify job, move it behind a self-hosted runner rather than deleting it; the
# claim must stay executable somewhere.
#
# The `update-homebrew` job carries the tag through to the Homebrew tap, so
# `brew install meridian-online/tap/brightfield` serves the release this
# workflow just published. Its shape is ported from the finetype release
# workflow's job of the same name; the comment above it records what that buys.
# Before it pushes, it fetches each url the formula publishes and compares the
# asset against the checksum written beside it — the tap has no pull-request CI
# of its own, so this workflow is where a formula addressing a file that is not
# there has to stop. The comment above that job says what the check covers on
# the Intel side and what it deliberately does not.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            native: true
          - target: x86_64-apple-darwin
            native: false

    steps:
      - uses: actions/checkout@v4

      # The same exact pin test.yml nails; package.sh defaults to it too, so
      # CI and a local `scripts/package.sh` run agree on the compiler.
      - uses: dtolnay/rust-toolchain@1.95.0

      - run: rustup target add ${{ matrix.target }}
        if: ${{ !matrix.native }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # THE SEMANTIC TYPE SOURCE. Until this landed no workflow set
      # BRIGHTFIELD_FINETYPE_BUNDLE, so `stage_finetype` in scripts/package.sh
      # returned at its first line and every artifact this workflow ever built
      # shipped without a type source — reporting storage types for every
      # column, which is the one thing the application exists not to do.
      #
      # The tag is pinned in packaging/finetype-pin.env and read here through
      # the one reader every consumer uses, so two builds of the same
      # brightfield tag stage the same bytes and a bump is a line somebody
      # reviewed. No tag is passed to the fetch script: it reads the same pin,
      # so there is nowhere for this workflow and the pin to disagree.
      #
      # THIS STEP FAILS TODAY AND THAT IS DELIBERATE. A FineType tag publishes
      # CLI tarballs and their checksums; the extension, the model and the
      # taxonomy catalogue are not release assets yet. Until they are, tagging
      # a brightfield release stops here rather than publishing an artifact
      # whose whole differentiator is missing. See
      # scripts/fetch-finetype-bundle.sh for the asset names it expects.
      - name: Read the pinned FineType release
        run: |
          TAG=$(scripts/finetype-pin.sh)
          echo "FineType pin: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the FineType bundle for this target
        run: scripts/fetch-finetype-bundle.sh "${{ matrix.target }}" "${RUNNER_TEMP}/finetype-bundle"

      - name: Package
        env:
          BRIGHTFIELD_FINETYPE_BUNDLE: ${{ runner.temp }}/finetype-bundle
        run: scripts/package.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}"

      # Per-target, per-path, and NOT a glob. `if-no-files-found: error` below
      # and `fail_on_unmatched_files: true` in the release job both fire on an
      # EMPTY glob, and the tarball satisfies both on its own — so a disk image
      # that failed to build would be dropped from the release with the run
      # green. This step is what makes that loud, and it names each file it
      # expects rather than counting what arrived.
      - name: Assert both artifacts were built
        run: |
          NAME="brightfield-${GITHUB_REF_NAME}-${{ matrix.target }}"
          test -f "dist/${NAME}.tar.gz"
          test -f "dist/${NAME}.tar.gz.sha256"
          test -f "dist/${NAME}.dmg"
          test -f "dist/${NAME}.dmg.sha256"
          ls -l "dist/${NAME}.tar.gz" "dist/${NAME}.dmg"

      # Read back what was PACKAGED, which is the reading nothing here has ever
      # done. scripts/check-bundled-extension.sh runs inside package.sh over the
      # bundle it was handed — the staging input, before packaging — so it
      # cannot see a staging step that dropped it. verify-airgapped.sh does read
      # the artifact, but it SKIPS its type-source legs when the artifact
      # carries no bundle (a build without one is supported) and it does not
      # gate this release. A release that stages nothing therefore passed every
      # check this workflow had.
      #
      # Both artifacts, because stage_finetype is called twice — once into the
      # tarball and once into Contents/Resources of the app bundle — and one of
      # those two going wrong is exactly the shape of defect this catches.
      #
      # THE BINARY IS RUN, and this workflow does not get a say in it. The check
      # decides from the target and the machine: on the native leg it loads the
      # bundle with the packaged binary's own --check-type-source, and on the
      # x86_64 leg — a cross-compile from an arm64 runner — it cannot, and says
      # so. There is no flag here to leave off.
      #
      # That used to be `--run`, passed from this file, and a review pass
      # mutated it away: every check in the repository stayed green while the
      # release stopped ever loading the bundle it shipped. Which matters
      # because a bundle can carry every required file, be correctly stamped,
      # match its own manifest — and still not load. Measured on one whose
      # model.safetensors was 200 KB of random bytes under the right name:
      # scripts/check-bundled-extension.sh exit 0, and the packaged binary exit
      # 1 with its canary classifying three email addresses as unknown. No file
      # list can see that.
      #
      # HALF THE RELEASE IS READ AND NOT LOADED, and the step is named for what
      # it does on the leg that can. Both darwin targets build on `macos-15`,
      # which is arm64 here, so the x86_64 artefact is a cross-compile nothing
      # on this runner can execute: its bundle is checked for shape, platform
      # stamp and manifest, and never loaded. Closing that needs an Intel runner
      # leg or Rosetta on this one, and neither is in this change.
      #
      # WHICH ARTEFACTS WERE LOADED IS RECORDED BY THE CHECK, NOT HERE. This
      # step used to carry an `if [ "${{ matrix.native }}" != "true" ]` block
      # emitting that warning itself — a second copy of a decision the check
      # makes from `rustc -vV`, free to disagree with it and checked by nothing.
      # The check now writes the warning and the run-summary line from the
      # branch it took, and scripts/check-artifact-type-source-selftest.sh reads
      # what lands in `$GITHUB_STEP_SUMMARY` rather than asserting it in prose.
      #
      # WHAT THIS STEP IS, STRUCTURALLY, is pinned by
      # scripts/check-release-readback.py on every pull request: which artefacts
      # it is run on, with which arguments, whether a refusal stops the job, and
      # whether the record reaches the run. A `continue-on-error:`, a dropped
      # `.dmg` argument, an `if:`, a pipe or a `|| true` each turn that gate red.
      - name: The packaged artifacts carry a type source (loaded on the native leg)
        run: |
          NAME="brightfield-${GITHUB_REF_NAME}-${{ matrix.target }}"
          scripts/check-artifact-type-source.sh "dist/${NAME}.tar.gz" "${{ matrix.target }}"
          scripts/check-artifact-type-source.sh "dist/${NAME}.dmg" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/brightfield-*.tar.gz
            dist/brightfield-*.dmg
            dist/brightfield-*.sha256
          if-no-files-found: error

  # Deliberately NOT a gate on `release`. This step needs a real window on a
  # hosted runner, which nothing has ever proven — test.yml only renders
  # offscreen (egui_kittest). As a step inside `build` it withheld every asset,
  # including the x86_64 ones, whenever the runner's window session was the
  # thing at fault rather than the binary. So it runs on its own and reports
  # red on its own: a failure here is loud and blocks nothing.
  #
  # That is safe because this is a REGRESSION GUARD, not the primary proof —
  # the air-gapped claim was executed against the packaged artifact on a
  # developer machine before the packaging merged, and re-executed after the
  # rebase. If this job fails, read it as "the claim is no longer verified in
  # CI", check the run, and re-prove it locally or behind a self-hosted runner
  # (see the header) — do not delete it, and do not assume a red here means the
  # published binary phones home.
  verify:
    name: Verify air-gapped (packaged binary, network denied)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the packaged aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-aarch64-apple-darwin
          path: dist

      - name: Verify air-gapped (tarball)
        run: scripts/verify-airgapped.sh "dist/brightfield-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"

      # The image leg, and it runs even when the tarball leg has just failed:
      # the two artifacts fail for different reasons, and a runner with no
      # window session would otherwise hide whether `hdiutil attach` works here
      # at all. That question is the one this job answers ahead of the first
      # signed release.
      - name: Verify air-gapped (disk image)
        if: ${{ !cancelled() }}
        run: scripts/verify-airgapped.sh "dist/brightfield-${GITHUB_REF_NAME}-aarch64-apple-darwin.dmg"

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Deliberately NOT generate_release_notes. With no previous tag to
          # diff against, GitHub generates notes back to the first commit —
          # every merged PR title, including the planning vocabulary that
          # scripts/check-public-hygiene.sh rejects in tracked files. From the
          # second tag on, the diff base is the previous tag and auto-notes are
          # safe to switch back on if hand-writing them stops earning its keep.
          #
          # A release page is a browser-download surface, and this build is
          # unsigned: unpacked by the Finder's Archive Utility the tarball's
          # binary inherits the quarantine attribute and macOS kills it on
          # launch with no explanation. Unpacked by `tar` in a terminal it does
          # not. That is why the tarball instructions lead with the command and
          # say why, and the disk image is added beside them rather than in
          # front of them — a browser download quarantines it too, and it stays
          # that way until the bundle inside is notarized.
          prerelease: true
          fail_on_unmatched_files: true
          # Prose paragraphs are each ONE physical line on purpose. GitHub
          # renders release bodies as GFM, whose hard-line-break extension
          # turns every wrapped line into a visible <br> — a 70-column-wrapped
          # body reads as ragged half-lines on the page. Verify before tagging:
          #   gh api --method POST /markdown -f mode=gfm -f text="$(...)" | grep -c '<br>'
          # must be 0. Code fences are exempt; keep them wrapped as they are.
          body: |
            One native binary for macOS. No server, no webview, no language runtime, no account — the only thing it asks of the machine is a working graphics driver. Nothing here reports anywhere; it reaches out only when a spec names a remote source, a DuckLake catalog or a spatial source. Everything under `examples/` is local and self-contained except `examples/remote/`, which is where the specs that fetch are kept — with no connection one of those does not open, it exits non-zero having named the network and the URL, and nothing else is affected.

            **This is an early preview**, macOS only, and it is not signed or notarized by Apple. That is the one thing to read before you open either download, because macOS treats an unsigned application downloaded through a browser as suspect and says so in language that sounds like the file is broken. It is not broken; each section below says what to do.

            Two downloads, same build. On an Intel Mac, swap `aarch64` for `x86_64` throughout.

            **`brightfield-${{ github.ref_name }}-aarch64-apple-darwin.dmg`** — a disk image holding `Brightfield.app`. Take this one if you want an application: an icon in the Dock and a double-click launch.

            **`brightfield-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`** — the bare binary beside the example specs, its LICENSE and a README. Take this one for the terminal, for a scripted install, or to keep the whole thing in a folder you control.

            ### Check what you downloaded

            Take the `.sha256` sidecar next to whichever file you took, then from the folder they landed in:

            ```
            shasum -a 256 -c brightfield-${{ github.ref_name }}-aarch64-apple-darwin.dmg.sha256
            shasum -a 256 -c brightfield-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256
            ```

            ## The disk image

            Open it, drag `Brightfield.app` onto the `Applications` alias in the window, and eject the image.

            Because this preview is unsigned, macOS will refuse to open the copy you just installed. Clear the download mark once, and it opens from then on:

            ```
            xattr -dr com.apple.quarantine /Applications/Brightfield.app
            ```

            The examples ship inside the bundle, at `Brightfield.app/Contents/Resources/examples`.

            ## The tarball

            ### Unpack it in Terminal, not in Finder

            This build is unsigned, so macOS quarantines anything the Finder's Archive Utility extracts and then kills it the moment you run it — usually with nothing in the terminal but `zsh: killed`, and sometimes a notification saying Apple could not verify it. The `tar` command below does not set that mark:

            ```
            tar -xzf brightfield-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            cd brightfield-${{ github.ref_name }}-aarch64-apple-darwin
            ./brightfield
            ```

            If you already unpacked it in Finder, clear the mark from the whole folder — adjust the path for wherever it landed:

            ```
            xattr -dr com.apple.quarantine ~/Downloads/brightfield-${{ github.ref_name }}-aarch64-apple-darwin
            ```

            ### What you get

            `./brightfield` with no arguments opens on a set of starts that ship inside the binary: the lineage of the EDGAR↔GLEIF crosswalk, and three charts. Or name a spec yourself —

            ```
            ./brightfield examples/bars.yaml
            ```

            The example specs and the EDGAR↔GLEIF Protocol manifest are in the archive, alongside the binary, its LICENSE (MIT) and a README. The Protocol manifest renders from the manifest alone, without a run:

            ```
            BRIGHTFIELD_PROTOCOL_OFFLINE=1 ./brightfield examples/protocol/edgar_gleif/arcform.yaml
            ```

            ### What it reports

            Nothing. No telemetry, no analytics, no update check — nothing in this application reports anywhere, and it needs no network to start, to render, or to open a local protocol.

            It reaches out only when a spec asks it to: a remote source, a DuckLake catalog, or a spatial source. In those cases DuckDB downloads the extension it needs from its own extension repository and fetches the data. A spec over local files does neither.

            `scripts/verify-airgapped.sh` in the repository proves that against the packaged artifact — it denies the network, checks that the denial really bites, and only then renders a chart and a protocol graph inside the jail. Run it yourself; it takes a minute. The Intel build is the same source and packaging, cross-compiled.
          files: |
            artifacts/brightfield-*.tar.gz
            artifacts/brightfield-*.dmg
            artifacts/brightfield-*.sha256

  # The tap formula moves with the release instead of with somebody's memory.
  #
  # Ported from the `update-homebrew` job in the finetype release workflow,
  # which drives Formula/finetype.rb in meridian-online/homebrew-tap today:
  # check the tap out with a token into a subdirectory, regenerate the formula,
  # commit and push behind a no-op guard. That route was chosen over the tap's
  # repository_dispatch entry point because it is the one already running
  # against this tap with this token, and a dispatch would add a failure
  # surface that a pull request cannot exercise.
  #
  # `needs: release` because the formula's `url` fields address release assets.
  # The release has to exist before the sidecars next to those assets can be
  # fetched.
  #
  # Where this repository stands on the Intel install path, stated rather than
  # left silent. The formula publishes an x86_64 block; this job now proves that
  # the asset it addresses exists at that url and hashes to the checksum written
  # beside it (`scripts/check-formula-asset.sh`, below), which is what a
  # `brew install` resolves before it unpacks anything. It does NOT prove the
  # Intel binary then runs: that is a cross-compile from the arm64 runner and,
  # as the header says, it cannot be executed there. No runner in this repository
  # is an Intel macOS host, so until one exists — a self-hosted x86_64 box, or the
  # `verify` job's air-gapped run repeated on that architecture — the Intel path
  # is asset-verified and execution-unverified, and it ships as a preview on that
  # basis. Do not read a green release as the Intel binary having launched
  # anywhere.
  update-homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job runs scripts/check-formula-asset.sh below, so it needs the
      # repository as well as the tap. First, before the tap lands in a
      # subdirectory of the workspace: a checkout cleans its destination.
      - uses: actions/checkout@v4

      # Into `sidecars/` rather than the workspace root, which is now a checkout
      # of this repository: downloads that land beside the tracked tree are one
      # careless glob away from being mistaken for it.
      - name: Download the checksum sidecars from the release
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p sidecars
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            curl -sfL -o "sidecars/brightfield-${TAG}-${target}.tar.gz.sha256" \
              "${BASE}/brightfield-${TAG}-${target}.tar.gz.sha256"
          done
          ls -l sidecars/*.sha256

      - name: Read the checksums
        id: sha
        run: |
          TAG="${GITHUB_REF_NAME}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            value=$(awk '{print $1}' "sidecars/brightfield-${TAG}-${target}.tar.gz.sha256")
            # A sidecar that downloads but parses to something other than a
            # digest would otherwise reach the formula as an empty or truncated
            # sha256, which surfaces as a checksum mismatch in a stranger's
            # `brew install` rather than as a red release run.
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::${target} sidecar did not parse to a sha256: '${value}'"
              exit 1
            fi
            echo "${target//-/_}=${value}" >> "$GITHUB_OUTPUT"
          done

      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: meridian-online/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # Regenerated wholesale, which makes this repository the source of truth
      # for the formula: a hand edit to Formula/brightfield.rb in the tap is
      # overwritten by the next release, so changes to it belong in
      # scripts/write-brightfield-formula.sh.
      #
      # THE FORMULA USED TO BE A HEREDOC RIGHT HERE, and moving it out is not
      # tidying. A heredoc in YAML can only be exercised by pushing a tag, so
      # anything wrong with the formula was discovered on a release, in a
      # repository with no CI of its own, by a stranger's `brew install`. As a
      # script it is generated and read by
      # scripts/check-formula-layout-selftest.sh on every pull request.
      #
      # What was wrong with it: `bin.install "brightfield"` took the executable
      # and discarded the tarball's `finetype/` beside it, so every installed
      # brightfield reported the storage type of every column.
      - name: Rewrite the formula
        env:
          ARM_SHA: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          INTEL_SHA: ${{ steps.sha.outputs.x86_64_apple_darwin }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          scripts/write-brightfield-formula.sh "$TAG" "$BASE" "$ARM_SHA" "$INTEL_SHA" \
            > homebrew-tap/Formula/brightfield.rb
          cat homebrew-tap/Formula/brightfield.rb

      # The install block, read on the file that is about to be pushed. The
      # generator and this check are separate on purpose: a check that only ever
      # read the generator's output would be satisfied by the generator, and
      # this file is what the tap receives.
      - name: The formula installs the tarball's tree, not the binary alone
        run: scripts/check-formula-layout.sh homebrew-tap/Formula/brightfield.rb

      - name: Check the formula addresses this tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            grep -Fq "/download/${TAG}/brightfield-${TAG}-${target}.tar.gz" \
              homebrew-tap/Formula/brightfield.rb
          done
          if command -v ruby >/dev/null 2>&1; then
            ruby -c homebrew-tap/Formula/brightfield.rb
          fi

      # The step above reads the formula as a string: it proves the tag appears
      # where it should and that ruby can parse the file. Neither of those
      # touches the other end of the url. Everything upstream of here is
      # string-handling too — the checksums come from the `.sha256` sidecars,
      # and a sidecar downloading correctly says nothing about the asset beside
      # it being reachable under the name the heredoc just wrote.
      #
      # So this fetches both assets the formula publishes, at the exact urls
      # written into the file, and compares each against the checksum on the
      # next line — the same two facts `brew install` establishes before it
      # unpacks anything. `--min-pairs 2` is one per darwin target: a formula
      # that lost a platform block must not pass by checking the block that
      # survived.
      #
      # It runs BEFORE the push, so a broken pair stops here instead of landing
      # in the tap and surfacing on a stranger's machine. The Intel block is the
      # reason: it is the one no other step in this workflow touches after
      # packaging, on the architecture the runner cannot execute.
      - name: Prove the formula's assets exist and match their checksums
        run: scripts/check-formula-asset.sh --min-pairs 2 homebrew-tap/Formula/brightfield.rb

      - name: Commit and push the formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/brightfield.rb
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update brightfield to ${GITHUB_REF_NAME}"
          git push
