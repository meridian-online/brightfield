goal: "Smooth transitions, hover tooltips, and highlight/dim for marks — feedback affordances that communicate what changed and what is selected."

constraints:
  - "find_nearest is a pure function in brightfield-render — no UI dependency, no spatial index (brute-force scan over post-aggregation RecordBatch)"
  - "Highlight circle renders in Vello scene (render-crate geometry); GPUI tooltip element is deferred to a follow-up card — this card establishes TooltipContent data extraction only"
  - "HighlightState uses per-row opacity multiplication — not a second render pass, not a post-process mask"
  - "HighlightState predicate uses Send + Sync bounds (Box<dyn Fn(usize) -> bool + Send + Sync>) for future GPUI element ownership compatibility"
  - "MarkRenderer::render() gains highlight parameter — all three renderers (Dot, Bar, Line) respect it"
  - "Mark-level interpolation scoped to DotRenderer only — bar/line interpolation deferred (bar needs 3-value MarkPosition, line needs path morphing)"
  - "render_interpolated() default impl must forward highlight parameter to the updated render() signature"
  - "Brush overlays, hover highlights, and tooltips are immediate (0ms) — only data transitions animate; highlight/dim fade animation deferred (initial impl snaps)"
  - "Nearest, NearestX, NearestY, Highlight vocab entries flip from Unimplemented to Implemented"

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "NearestMode enum (X, Y, XY) and NearestHit struct (row, point, distance) in brightfield-render/src/nearest.rs"
    verification: "Unit test constructs NearestHit values, asserts field access; NearestMode variants are exhaustive"

  - id: ac-02
    ac_type: code
    description: "find_nearest() scans RecordBatch rows via ScaleSet, returns Option<NearestHit> — closest point within a configurable max distance threshold"
    verification: "Unit tests: cursor exactly on a point returns Some with distance ~0; cursor far away returns None; NearestMode::X ignores y distance; NearestMode::Y ignores x distance"

  - id: ac-03
    ac_type: code
    description: "HighlightState struct with predicate Box<dyn Fn(usize) -> bool + Send + Sync> and dimmed_alpha (f64) in brightfield-render/src/mark.rs"
    verification: "Unit test constructs HighlightState with a closure predicate, asserts predicate evaluation for matching and non-matching rows"

  - id: ac-04
    ac_type: code
    description: "MarkRenderer::render() signature gains Option<&HighlightState> — DotRenderer, BarRenderer, LineRenderer apply dimmed alpha to non-matching rows when highlight is active"
    verification: "Unit test: render with HighlightState active produces non-empty scene; verify via scene encoding that rendering occurred (same pattern as existing gpu_ac03 tests)"

  - id: ac-05
    ac_type: code
    description: "build_chart_scene accepts optional HighlightState via ChartData and passes it through to renderer"
    verification: "Unit test: build_chart_scene with highlight set produces scene with content; build without highlight also works (backward compatible)"

  - id: ac-06
    ac_type: code
    description: "Transition struct in brightfield-render/src/transition.rs with prev_positions (Vec<(f64, f64)>), start time, duration, and linear easing; TransitionState enum (Idle, Running, Complete)"
    verification: "Unit test: new transition starts as Running; tick past duration transitions to Complete; tick at midpoint returns interpolated t value ~0.5"

  - id: ac-07
    ac_type: code
    description: "MarkRenderer::render_interpolated() default method forwards to render() with highlight; DotRenderer overrides with per-dot lerp between prev and current positions"
    verification: "Unit test: DotRenderer render_interpolated at t=0.0 produces scene content; at t=1.0 produces scene content; default impl for BarRenderer also produces scene content (forwarding)"

  - id: ac-08
    ac_type: code
    description: "TooltipContent struct with field name/value pairs, extracted from RecordBatch at a given row index"
    verification: "Unit test: extract tooltip content from a RecordBatch row, assert field names and values match expected"

  - id: ac-09
    ac_type: code
    description: "InteractorKind Nearest, NearestX, NearestY, Highlight status flipped from Unimplemented to Implemented in vocab.rs"
    verification: "Unit test asserts all four variants have ImplStatus::Implemented"

  - id: ac-10
    ac_type: code
    description: "InteractionState::Hovering variant gains optional NearestHit field; hover handler path calls find_nearest to resolve cursor to nearest data row"
    verification: "Unit test: construct Hovering state with NearestHit, assert field access; construct without NearestHit (backward compatible)"

implementation_notes:
  - "TooltipElement (GPUI rendering) is deferred — this card delivers TooltipContent data extraction and NearestHit resolution. A follow-up card wires TooltipElement with GPUI text rendering and coordinate bridge."
  - "Highlight/dim fade animation (100-150ms) is deferred — initial implementation snaps opacity. TransitionKind::Highlight is a future addition."
  - "Bar/line interpolation deferred — bars need (x, y_top, y_bottom), lines need path morphing. DotRenderer is the only renderer overriding render_interpolated in this card."
  - "prev_positions is Vec<(f64, f64)> which suffices for dot interpolation. A future Vec<MarkPosition> enum with per-renderer variants will support bar/line."

evaluation_principles:
  - principle: "Correctness — find_nearest returns the actual closest point; highlight dims the right rows"
    weight: 0.35
  - principle: "Responsiveness — hover + tooltip rendering within 16ms frame budget"
    weight: 0.25
  - principle: "Composability — highlight, transition, and nearest types compose with existing render pipeline without breaking existing tests"
    weight: 0.25
  - principle: "Visual clarity — dim alpha clearly distinguishes selected from non-selected marks"
    weight: 0.15

exit_conditions:
  - "All 10 acceptance criteria pass with unit tests"
  - "cargo test passes for brightfield-render, brightfield-ui, and brightfield-spec"
  - "All existing tests continue to pass (backward compatibility)"
  - "cargo clippy reports no new warnings in modified crates"

