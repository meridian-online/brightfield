feature: "Authoring workspace — docked panels, spec editor, data sidebar"
as_a: "analytics author building dashboards in the app"
i_want: "a dockable workspace around the canvas — a spec editor with live re-render, a data sidebar profiling my sources, rearrangeable panels"
so_that: "authoring happens in one place at editor speed, instead of alternating between an external editor and a preview window"

scenarios:
  - name: "Edit the spec beside the live canvas"
    given: "a dashboard open with the spec editor panel"
    when: "I edit the spec YAML and save"
    then: "the canvas re-renders through the existing hot-reload loop without leaving the app; a rejected reload surfaces its reason in the workspace, not just on stderr"

  - name: "Panels dock and persist"
    given: "editor, sidebar, and canvas panels in the dock system"
    when: "I drag a panel to a new dock position and reopen the app"
    then: "the arrangement persists — dock state is shell-owned and never serialised into the spec"

  - name: "Column profiles on tap"
    given: "a spec with data sources"
    when: "I open the data sidebar"
    then: "each source lists its columns with type and profile (count, min/max, distinct, nulls) computed by DuckDB"

  - name: "The canvas is a panel like any other"
    given: "the dock system hosts the chart canvas"
    when: "panels are rearranged or resized"
    then: "chart rendering is unaffected — the vello path hosts behind the panel seam, untouched"

  - name: "Presentation mode still previews the consumer view"
    given: "the docked workspace"
    when: "I toggle presentation mode (p)"
    then: "all authoring panels hide, leaving the spec-derived canvas; headless PNG output is identical either way"

goal: "gpui-component adopted at a pinned main commit (zed rev 1d217ee): DockArea absorbs WorkspaceView's shell, an editor panel edits the live spec with save-to-re-render, a sidebar skeleton shows DuckDB column profiles — vello chart path untouched, every headless PNG byte-identical."

maturity: "planned"

specs:
  - "orbit/specs/2026-07-06-authoring-workspace-v1/spec.yaml"
  - "orbit/specs/2026-07-10-crossfilter-render-fidelity/spec.yaml"

references:
  - "gpui-component main @ b7e63cc2 (Apache-2.0; pins zed rev 1d217ee; docks mature, tree-sitter + LSP editor, DataTable virtualized both axes) — adopt via git pin at a chosen commit; the tag route is dead until zed ships the post-split gpui crates.io release (recon 2026-07-05)"
  - "orbit/cards/memos/2026-07-04-framing-the-canvas.md: the Option B trigger and the thin-WorkspaceView design that makes DockArea absorption cheap"
  - "orbit/cards/memos/2026-07-05-rust-ui-field-scan.md: semantic-layer rule as STANDING CONSTRAINT — command registry as data, surface model as plain state machines, views as translation shims; linebender masonry/xilem is the watched successor (Hugh's eye), so the shell must stay swappable and panel logic headless"
  - "MotherDuck Column Explorer: the data-sidebar benchmark"
  - "orbit/cards/memos/2026-07-04-visidata-keyboard-grammar.md: the command-log rides the editor seam once it exists"
