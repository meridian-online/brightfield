# Reactive-param demo (param-effect routing).
#
# The `threshold` param filters the scatter via `filter: "x > $threshold"`.
# Changing the param — through `propagate_param`, or a slider once the input
# widget lands (window-gated) — re-executes the query and drops/adds points.
#
# Verify headless: dump the PNG at the default threshold, then at an override.
#   BRIGHTFIELD_DUMP_PNG=out.png cargo run -p brightfield-app -- examples/param-threshold.yaml
params:
  threshold: 2
data:
  points:
    - { x: 1, y: 3 }
    - { x: 2, y: 5 }
    - { x: 3, y: 2 }
    - { x: 4, y: 8 }
    - { x: 5, y: 4 }
    - { x: 6, y: 7 }
    - { x: 7, y: 6 }
    - { x: 8, y: 9 }
plot:
  - mark: dot
    data: { from: points, filter: "x > $threshold" }
    x: x
    y: y
