---
# Deviation registry — single source of truth for deliberate divergences
# between Mosaic-web rendering and brightfield. Consumed by:
#   - the registry-integrity gate (tests/registry_integrity.rs)
#   - the curated-preflight gate (tests/curated_preflight.rs)
#   - the generate-deviations binary (emits DEVIATIONS.md)
#
# Schema: every record has { id (DEV-NNNN, unique), surface, mosaic_behaviour,
# brightfield_behaviour, rationale, affected_specs (filenames in
# vendor/curated/yaml/), conformance_layers_suppressed (list of 1..=4) }.
deviations:
  - id: DEV-0001
    surface: rendering
    mosaic_behaviour: |
      Mosaic web renders plot/concat layouts, marks (dot, line, rectY, rule,
      frame, etc.), legends, and interactors (intervalX, intervalXY,
      highlight, toggle, nearest) against a live DuckDB session.
    brightfield_behaviour: |
      v1 ships the spec-portability contract only — the AST parser, preflight
      SupportReport, deviation registry, and layer-1 AST round-trip gate. No
      layout, mark, legend, interactor, or input is rendered yet; every
      `ImplStatus` in `brightfield-spec`'s vocabulary registry is `Unimplemented`
      pending the renderer card.
    rationale: |
      Honest scaffolding: layers 2 (SQL equivalence), 3 (encoding
      equivalence), and 4 (interaction equivalence) return
      `LayerOutcome::Pending` rather than fake-green. Flipping an individual
      `LayerCheck` to Pass/Fail is what unblocks each curated spec; this
      deviation is the accounting surface that keeps the preflight gate
      honest until then.
    affected_specs:
      - crossfilter.yaml
      - facet-interval.yaml
      - flights-200k.yaml
      - legends.yaml
      - line.yaml
      - mark-types.yaml
      - overview-detail.yaml
      - seattle-temp.yaml
      - sorted-bars.yaml
      - table.yaml
    conformance_layers_suppressed: [3, 4]
  - id: DEV-0002
    surface: "data source — DuckDB attach"
    mosaic_behaviour: |
      Mosaic web uses ATTACH without a read-only flag, allowing both
      read and write access to the attached DuckDB database file.
    brightfield_behaviour: |
      brightfield emits ATTACH '<path>' AS "<alias>" (READ_ONLY),
      enforcing read-only access to prevent accidental corruption of
      the user's production database during exploration.
    rationale: |
      Exploration safety: the card's scope is read-only analysis. A
      user pointing brightfield at a production .duckdb file should not
      risk inadvertent writes. The READ_ONLY flag is a deliberate
      safety divergence from Mosaic-web's wire shape.
    affected_specs: []
    conformance_layers_suppressed: [2]
  - id: DEV-0003
    surface: "colour scale — sequential scheme default"
    mosaic_behaviour: |
      Mosaic/Observable Plot default an unspecified quantitative colour
      scale's scheme to `turbo` (a rainbow map).
    brightfield_behaviour: |
      brightfield defaults the sequential colour scheme to `viridis`.
      `turbo` remains available by name (`colorScheme: turbo`), so a spec
      that names a scheme renders it; only the *unspecified* default differs.
    rationale: |
      Perceptual uniformity and colourblind safety: viridis is perceptually
      uniform and colourblind-safe, whereas turbo is a rainbow map with known
      perceptual artefacts at the extremes. Viridis is the de-facto modern
      default (matplotlib, ggplot). Spec portability is preserved — a
      `colorScheme: turbo` spec still renders turbo; only the default diverges.
    affected_specs: []
    conformance_layers_suppressed: [3]
