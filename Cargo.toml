[workspace]
members = ["crates/brightfield-spec", "crates/brightfield-conformance", "crates/brightfield-sql", "crates/brightfield-engine", "crates/brightfield-render", "crates/brightfield-ui", "crates/brightfield-app"]
resolver = "2"

[workspace.package]
edition = "2021"
# Floor set by vello 0.9 (rust-version 1.88); kurbo/peniko/skrifa need 1.85.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/meridian-online/brightfield"

# Replace zed's GPL-3.0 tracing shim with a clean-room no-op stub so Brightfield
# binaries link no GPL code (the chain is gpui -> sum_tree -> ztracing -> zlog).
# Guarded by `cargo deny check licenses` (deny.toml) at every pin bump.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "stubs/ztracing" }

[workspace.lints.rust]
unused_must_use = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
