[package]
name = "brightfield-workbench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The shell contract: what a pane declares about itself, and the one place chrome is drawn"

[dependencies]
# egui is the drawing surface, and egui_tiles supplies the tile identity a pane
# is addressed by. Deliberately ABSENT: eframe, egui-wgpu, wgpu, vello, gpui.
# That absence is load-bearing three times over — it is why this crate owns its
# own layout persistence rather than borrowing the gpui shell's, why `ItemCtx`
# carries no GPU handle, and why the whole contract can be asserted in a unit
# test with no adapter, no window and no renderer.
egui = "0.35"
# `serde` is egui_tiles' only feature and its default, and a `Tree` that cannot
# serialise takes the whole arrangement out of the layout file. Naming it here
# states a requirement rather than fixes a live break: this crate would get the
# feature from the default anyway, and it declares it, so it builds correctly
# on its own. It is named because Cargo unifies features across a workspace in
# one direction only — a `default-features = false` elsewhere cannot remove
# what this crate asks for, but relying on *another* crate's default to supply
# it would be the version of this that does break.
egui_tiles = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# JSON is the layout file's format: human-readable, diffable, and already in the
# tree. Confined to `persist` — a `Subject` still carries no serialisation, and
# nothing in the chrome path knows this crate exists.
serde_json = "1"
# The design tokens. Every colour, radius, row height and gap in this crate
# comes from here; nothing is invented locally.
meridian-design = { git = "https://github.com/meridian-online/design", rev = "539c579c43897fdd0c7d5c141221201d5e97a910" }
# The egui emitter of those tokens — the design repo's third thin emitter. It
# owns `Mode` (re-exported from this crate's root) and the `Style`/`Visuals`/
# font bridge that used to live here; a workbench frame is drawn in Meridian
# type and ink because that bridge exists, wherever it lives. A committed
# `[patch]` in the workspace root points both design crates at a side-by-side
# clone for local development, since `meridian-egui` is not yet published.
meridian-egui = { git = "https://github.com/meridian-online/design", rev = "539c579c43897fdd0c7d5c141221201d5e97a910" }
# The command registry, so a declared verb can be checked against the real
# keyboard grammar rather than merely spelled like one.
brightfield-keys = { version = "0.1.0", path = "../brightfield-keys" }

[lints]
workspace = true
