feature: "Param-effect routing (two-tier scalar param reactivity)"
as_a: "analyst sweeping a variable across a visualisation"
i_want: "a param change to actually alter the queries and render that depend on it"
so_that: "dragging a slider (or any param widget) produces a live, visible change instead of a silent no-op"

# Distilled from codebase archaeology (this session), not a brief. The
# reactive-params RUNTIME (card 0005 v3 / rpw3) shipped the coordinator —
# `propagate_param` walks the topological DAG and re-dispatches subscribing
# marks — but a scalar param currently changes NOTHING in any query. Making a
# param actually reach the emitted SQL was explicitly deferred to a "two-tier
# param-effect routing card" (engine/lib.rs:153-160; gomb_ac12's comment), which
# was never written. This card is that work. It is the true blocker for the
# sprint goal "param widgets re-execute downstream queries" and for wiring a
# live slider (a slider today would drag smoothly and move nothing on screen).

scenarios:
  - name: "A scalar param used in a query changes that mark's output"
    given: "a spec declares a scalar param and a mark whose query references it (e.g. a positional channel `y: $k`, or an expression / filter using `$k`)"
    when: "the param value changes via propagate_param"
    then: "the mark's re-executed RecordBatch differs — the new value is reflected in the output data, not discarded"
    source_lines: "empirical probe (this session): `y: $k` on a dot subscribes the mark but re-execution returns a byte-identical batch with no `y` column at all (schema `[\"x\"]`)"

  - name: "Params reach the emitted SQL (the discard stub is closed)"
    given: "emit_query is called with param_values present and a plan that references a param"
    when: "the query is emitted and executed"
    then: "the param's value is present in the executed query (interpolated or bound) and DuckDB sees the concrete value — param_values is no longer thrown away"
    source_lines: "crates/brightfield-sql/src/emit.rs:501 `let _ = param_values;` (documented stub); crates/brightfield-engine/src/lib.rs:752 executes with empty `duckdb::params![]`"

  - name: "A param positional channel becomes real query output"
    given: "a mark binds a positional channel to a bare `$param` (e.g. `y: $threshold`)"
    when: "the mark is lowered and executed"
    then: "the channel appears in the SELECT sourced from the param value, ChannelMap maps that channel to its column, and the renderer draws it — rather than the channel being silently dropped with a warning"
    source_lines: "SimpleLowerer emits `SELECT *` (crates/brightfield-sql/src/lower.rs:52); ChannelMap::from_mark skips `$param` channels with a warning (crates/brightfield-render/src/channel.rs:147)"

  - name: "Two tiers are distinguished: pure-render vs data-shape"
    given: "one param only affects rendering (no query effect) and another changes the query's output shape"
    when: "each param changes"
    then: "the pure-render param updates the view WITHOUT a needless SQL re-execution; the data-shape param re-executes the affected queries — the coordinator routes each to the cheapest correct path"
    source_lines: "engine/lib.rs:153-160 — 'separates pure-style param drags (no SQL re-execution needed) from data-shape param changes'"

  - name: "Caching stays correct across param changes"
    given: "the plan_hash statement cache and the SQL-string cache, which today assume SQL is param-independent"
    when: "a data-shape param change alters the SQL, versus an SQL-invariant param change (e.g. a selection param routed through predicates)"
    then: "the data-shape change misses the cache and re-executes; the SQL-invariant change keeps the cache warm and skips DuckDB — no stale batch is ever returned"
    source_lines: "gomb_ac12_propagate_param_with_unchanged_sql_hits_cache (engine/lib.rs:1302) must still pass; execute_emitted caches by plan_hash + SQL (engine/lib.rs:725-762)"

  - name: "Existing selection / cross-filter behaviour is unaffected"
    given: "a dashboard uses selection params (filterBy: $brush) and live cross-filter brushing"
    when: "param-effect routing lands"
    then: "selections continue to route through selection_state predicates exactly as before — scalar inlining does not touch the selection path"
    source_lines: "selection params are routed through compiled predicates, not inlined (gomb_ac12 comment); cross-filter shipped in cards 0006"

  - name: "Expression params subscribe and react"
    given: "a mark channel or filter is a SQL expression embedding a param (e.g. `y: \"v * $k\"`)"
    when: "the param changes"
    then: "the mark is registered as a subscriber of that param and re-executes — expressions are not silently non-reactive"
    source_lines: "collect_spec_value_subscribers ignores SpecValue::Expression / SpecValue::Param today (crates/brightfield-spec/src/analysis.rs:330-344 `_ => {}`)"

goal: >
  Close the param-effect routing gap so a scalar param change actually flows
  into the queries and render that subscribe to it. Finish the emit→execute
  param-binding stub, get params into the SQL for the in-scope paths (at least
  the bare `$param` positional channel), subscribe expression params, and
  reconcile the plan_hash / SQL caches so results stay correct. Two-tier routing
  distinguishes pure-render param drags from data-shape re-executions. Verified
  headlessly (the batch changes on re-execution) — this unblocks the
  window-gated slider live-wiring.

maturity: "emerging"

specs: []

references:
  - "card 0005 (reactive-parameters-with-input-widgets) — the runtime/rpw3 built propagate_param + ParamDispatcher + commit_slider_release, but deferred making params affect SQL output"
  - "orbit/specs/2026-04-29-reactive-parameters-runtime/decisions.md — deferred computed-param case (iii) and framed the pure-vs-data-shape split"
  - "engine/lib.rs:153-160 + gomb_ac12 comment — the explicit 'two-tier param-effect routing' deferral this card addresses"
  - "empirical probe (this session): scalar params subscribe but re-execution yields byte-identical batches; expression params don't subscribe"
  - "open design questions (for orb:design): interpolation vs prepared-binding; cache-key semantics; which param→SQL paths land (positional channel projection, expression channels/filters, aggregation options like bins/ci); cross-crate alias naming for projected param channels"
