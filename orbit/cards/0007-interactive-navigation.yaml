feature: "Interactive navigation"
as_a: "analyst zooming in on a region of interest"
i_want: "to pan and zoom inside a plot"
so_that: "I can move between overview and detail without editing the spec"

scenarios:
  - name: "Pan within a plot"
    given: "a plot rendered from a spec"
    when: "I drag to pan"
    then: "the visible data range shifts and the view updates continuously"
    source_lines: "brightfield-brief.md: 'Interactors: ... pan and zoom — navigation.'"

  - name: "Zoom within a plot"
    given: "a plot rendered from a spec"
    when: "I zoom in or out"
    then: "the scale domain adjusts and marks re-render at the new extent"
    source_lines: "brightfield-brief.md: 'Interactors: ... pan and zoom — navigation.'"

maturity: "planned"

specs: []

references:
  - "brightfield-brief.md"
