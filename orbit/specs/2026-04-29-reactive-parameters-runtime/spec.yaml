goal: >
  Strengthen the param coordinator into a topological DAG walk and ship the first
  end-to-end input widget (slider). When an analyst drags a slider, the new
  value flows through ParamDispatcher → Session::propagate_param, the walk
  re-executes every affected mark in topological order against full param_state
  AND honours the active selection_state at every level, and the UI receives a
  result vec it can render. Closes the param half of the live-reactivity sprint
  while preserving cross-coordinator symmetry with the shipped selections
  runtime (cfs2).

constraints:
  - "Single coordinator entry point: extend propagate_param in place; do not introduce a sibling propagate_param_chain method (Decision 1)."
  - "Walk semantics: topological re-execution against full param_state at each level; computed-param case (ParamNode::FromQuery) is out of scope (Decision 2)."
  - "Per-walk dedup is first-level-wins via a HashSet<usize> carried across levels; the existing in-level sort+dedup at engine/lib.rs:456-457 still handles the same-level case (Decision 3)."
  - "Partial-failure shape matches propagate_selection exactly: per-subscriber Result, continue on emit/execute error, param_state always updated, walk continues across levels regardless of per-mark errors (Decision 4)."
  - "Widget surface: ship Slider end-to-end; Menu/Search/Table remain Unimplemented and are deferred (Decision 5)."
  - "Coordinator returns Vec<(usize, Result<Vec<RecordBatch>, EngineError>)>; UI observes the result vec and triggers re-render. brightfield-engine remains free of any render dependency (Decision 6)."
  - "Rally seam commitments — read-only or untouched: selection_state, propagate_selection, current_selections, SelectionDispatcher, BrushBinding, brush_rect_to_predicate, on_mouse_up_with_dispatch, emit_query/emit_query_with_passes signatures, update_param, analysis.{subscriber_graph,topological_order,dependency_dag} schemas, brightfield-render's no-gpui invariant, corpus regression gate (cfs ac-13)."
  - "Test prefix is rpw3_; AC ids align 1:1 with test-function suffixes (rpw3_acNN_*); 15 code ACs + 1 gate (ac-16)."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "topological_descendants returns root followed by all descendants in topological order for a simple linear chain (A → B → C produces [A, B, C])."
    verification: "rpw3_ac01_topological_descendants_simple_chain in crates/brightfield-spec/src/analysis.rs tests builds a 3-node DAG and asserts the result vector."

  - id: ac-02
    ac_type: code
    description: "topological_descendants returns the correct descendant set for the athletes.yaml corpus chain (filtered widget chain, case ii from interview Q2)."
    verification: "rpw3_ac02_topological_descendants_athletes_yaml loads the corpus fixture, calls topological_descendants on the root param, and asserts the returned ordering matches the analysis.topological_order projection over descendants."

  - id: ac-03
    ac_type: code
    description: "topological_descendants returns just [root] when the root param has no descendants in dependency_dag."
    verification: "rpw3_ac03_topological_descendants_leaf_root constructs a SpecAnalysis where root has zero outgoing DAG edges, asserts result == [root]."

  - id: ac-04
    ac_type: code
    description: "propagate_param walks topological_descendants and dispatches subscribing marks at every level against full param_state AND the active selection_state. The selection_state slice handed to emit_query at level B is the same one handed at level A."
    verification: "rpw3_ac04_propagate_param_chained_walk constructs a two-level DAG (A → B) with two marks: m_A subscribing only to A, m_B subscribing only to B. Pre-populates session.selection_state with a single brush predicate. Propagates A. Asserts (a) results contains both m_A and m_B; (b) the SQL emitted for both marks contains the brush's WHERE-clause fragment (or, equivalently, both emit_query invocations received Some(predicates) with the same predicate set)."

  - id: ac-05
    ac_type: code
    description: "propagate_param first-level-wins dedup: a mark subscribing to both A and a descendant of A appears exactly once in the result vec, dispatched at A's level — ordering, not just count, is asserted."
    verification: "rpw3_ac05_propagate_param_first_level_wins_dedup constructs A → B with two marks: m_AB whose query references both $A and $B, and m_B whose query references only $B. Propagates A. Asserts (a) m_AB appears in results exactly once; (b) m_AB's index in results is strictly less than m_B's index, proving m_AB was dispatched at A's level (first), not B's level."

  - id: ac-06
    ac_type: code
    description: "propagate_param descendants-only scope: marks subscribing only to non-descendant params (siblings of A) are not re-executed."
    verification: "rpw3_ac06_propagate_param_descendants_only constructs a DAG with A and a sibling C (both children of an unrelated parent), a mark subscribing only to C, propagates A, asserts the C-only mark is absent from the result vec."

  - id: ac-07
    ac_type: code
    description: "propagate_param on a param with no subscribers and no descendants returns an empty result vec, but param_state is still updated."
    verification: "rpw3_ac07_propagate_param_unsubscribed_leaf propagates a fresh param with zero subscribers and zero DAG children, asserts result.is_empty() AND current_params() reflects the new value."

  - id: ac-08
    ac_type: code
    description: "propagate_param partial failure: with two subscribers to the same param via the same subscription edge — one dot mark whose lowerer is registered in default_lowerers (Ok), one rect mark whose lowerer is NOT registered (Err) — the result vec contains both entries with the expected Ok/Err shape, and param_state is updated regardless. Strengthens v2 rpw2_ac04 by exercising the previously-unreachable Err branch."
    verification: |
      rpw3_ac08_propagate_param_partial_failure: registers only the dot lowerer
      via default_lowerers (rect lowerer absent); builds a spec with one dot
      mark and one rect mark, both with `data: { from: q, filterBy: $param }`;
      propagates a new value for $param; asserts:
      (a) results.len() == 2;
      (b) the dot entry is Ok(non_empty_vec_of_record_batches);
      (c) the rect entry is Err(EngineError::EmitFailed { cause: UnsupportedMark, .. });
      (d) session.current_params().get("param") == Some(&new_value).

  - id: ac-09
    ac_type: code
    description: "ParamDispatcher::dispatch on Session forwards to propagate_param identically — same return shape, same param_state effect."
    verification: "rpw3_ac09_param_dispatcher_session_impl invokes <Session as ParamDispatcher>::dispatch(name, value) and asserts the returned Vec<(usize, Result<...>)> equals what propagate_param returns for the same inputs (assert_eq! over an equivalent fixture session), and current_params() agrees."

  - id: ac-10
    ac_type: code
    description: "SliderBinding captures param_name plus min/max/step from the Input.options block on construction."
    verification: "rpw3_ac10_slider_binding_from_input_options constructs a SliderBinding from an Input fixture with options {min: 0.0, max: 100.0, step: 1.0}, asserts the binding fields equal the input."

  - id: ac-11
    ac_type: code
    description: "commit_slider_release is a pure helper that, given a SliderBinding, current value, and any &mut impl ParamDispatcher, invokes dispatch with the binding's param_name and the current value as a SpecValue. Mirrors commit_brush_release in chart_view.rs."
    verification: "rpw3_ac11_commit_slider_release_dispatches feeds a recording-dispatcher double into commit_slider_release with a SliderBinding and a value, asserts the double recorded a single dispatch call with the expected (param_name, SpecValue::Number(value))."

  - id: ac-12
    ac_type: code
    description: "Slider widget's mouse_up handler invokes commit_slider_release. Tested via the lifted-helper boundary used by cfs2_ac11: the slider's release-state struct + commit_slider_release together stand in for end-to-end GPUI events."
    verification: |
      rpw3_ac12_slider_on_mouse_up_dispatches: constructs a SliderState (or
      equivalent UI state struct) with a recording-dispatcher double, simulates
      a mouse_down → mouse_up sequence by transitioning the state to Released,
      and invokes commit_slider_release. Asserts the double recorded one
      dispatch with the expected (param_name, value). End-to-end GPUI event
      simulation is out of scope; the lifted-helper coverage matches the
      cfs2_ac11 precedent.

  - id: ac-13
    ac_type: code
    description: "Slider widget's mouse_down without a subsequent mouse_up does NOT invoke commit_slider_release. Mid-drag is overlay-only state on the widget."
    verification: |
      rpw3_ac13_slider_no_drag_no_dispatch: constructs a SliderState with a
      recording-dispatcher double, simulates mouse_down by transitioning to
      Dragging without ever transitioning to Released, asserts the double
      recorded zero dispatches. Same lifted-helper boundary as ac-12.

  - id: ac-14
    ac_type: code
    description: "InputKind::Slider conformance flip: vocab marks Slider as Implemented; a regression assertion in the vocab conformance tests prevents a future revert to Unimplemented."
    verification: "rpw3_ac14_input_kind_slider_implemented in crates/brightfield-spec/src/vocab.rs tests asserts InputKind::Slider.is_implemented() == true and that the canonical Implemented fixture set contains InputKind::Slider."

  - id: ac-15
    ac_type: code
    description: "propagate_param does not mutate any param_state entry other than the explicitly named one. Locks down Decision 2 case-(iii) deferral as a behavioural property — the walk reads downstream params, never writes them."
    verification: |
      rpw3_ac15_propagate_param_does_not_mutate_downstream_params:
      constructs A → B with an initial param_state where A == a0 and B == b0;
      calls propagate_param("A", new_a); asserts:
      (a) current_params()["A"] == new_a;
      (b) current_params()["B"] == b0 (unchanged).

  - id: ac-16
    ac_type: gate
    description: "Rally seam regression gate: existing v2 tests (rpw2_*), cfs2 tests, and the corpus regression test (cfs ac-13) remain green. propagate_selection, current_selections, SelectionDispatcher, BrushBinding, brush_rect_to_predicate, on_mouse_up_with_dispatch, emit_query/emit_query_with_passes signatures, update_param, and analysis.{subscriber_graph,topological_order,dependency_dag} schemas are untouched. brightfield-render contains no gpui dependency. v2/cfs2 test sources are untouched."
    verification: |
      Run all four checks; each must pass:
      (1) cargo test -p brightfield-engine -p brightfield-spec -p brightfield-ui -p brightfield-render
      (2) cargo tree -p brightfield-render | rg gpui  # must produce zero matches
      (3) git diff origin/main -- \
            crates/brightfield-engine/src/lib.rs \
            crates/brightfield-spec/src/analysis.rs \
            crates/brightfield-ui/src/brush.rs \
            crates/brightfield-ui/src/chart_view.rs \
          | rg -F 'pub fn propagate_selection' \
                 -e 'pub fn update_param' \
                 -e 'pub trait SelectionDispatcher' \
                 -e 'pub struct BrushBinding' \
                 -e 'pub fn brush_rect_to_predicate' \
                 -e 'pub fn emit_query' \
                 -e 'pub fn on_mouse_up_with_dispatch'
          # must produce zero signature-line hits — any hit means a rally-seam symbol's signature changed
      (4) git diff --stat origin/main -- \
            'crates/*/src/**rpw2*' 'crates/*/tests/**rpw2*' \
            'crates/*/src/**cfs*' 'crates/*/tests/**cfs*'
          # must be empty — v2/cfs2 test sources untouched

implementation_notes:
  - "Files modified: crates/brightfield-engine/src/lib.rs (propagate_param body, lines 433-489 — signature unchanged), crates/brightfield-spec/src/analysis.rs (add topological_descendants near build_dependency_dag at lines 315-383), crates/brightfield-spec/src/vocab.rs (InputKind::Slider line 222 flip), crates/brightfield-ui/src/lib.rs (re-export new slider module)."
  - "Files added: crates/brightfield-ui/src/slider.rs holding Slider GPUI widget, SliderBinding, ParamDispatcher trait, impl ParamDispatcher for Session, and commit_slider_release pure helper."
  - "topological_descendants signature: pub fn topological_descendants(analysis: &SpecAnalysis, root: &str) -> Vec<String>. Pure DAG traversal restricted to descendants; root included as first element. No mutation of analysis."
  - "ParamDispatcher trait shape mirrors SelectionDispatcher in crates/brightfield-ui/src/brush.rs:120-140 verbatim — fn dispatch(&mut self, name: &str, value: SpecValue) -> Vec<(usize, Result<Vec<RecordBatch>, EngineError>)>."
  - "commit_slider_release mirrors commit_brush_release in chart_view.rs:181-206; takes &SliderBinding, value, and &mut impl ParamDispatcher; returns the result vec for the caller to thread into ChartState::apply_results + cx.notify()."
  - >
    Walk implementation in propagate_param:
    (1) update param_state[name] := value;
    (2) compute order = topological_descendants(&analysis, name);
    (3) initialise dispatched: HashSet<usize>;
    (4) capture selections_ref: &[Predicate] = self.selection_state.as_slice() ONCE before the loop;
    (5) for each level p in order, gather subscribers via analysis.subscriber_graph[p], skip indices already in dispatched, dedup in-level (existing sort+dedup), then dispatch via emit_query passing self.param_state and selections_ref, append (mark_idx, Result) to results, insert into dispatched on dispatch.
    Invariant: each mark_idx appears in results at most once, at the topologically-earliest level in the walk where its subscription edge first matches (first-level-wins).
    Invariant: every level of the walk receives the same selections_ref slice — captured before the loop, never re-read from self.selection_state inside the loop.
  - "Coordinator-side selection_state passthrough: emit_query already consumes both param_values and selection_predicates after cfs2; the new walk hands the same selection_state slice to every level, so chained re-execution honours the active brush. ac-04 asserts this property directly; capturing selections_ref once before the loop (not inside it) makes accidental short-circuits visible in code review."
  - "SliderBinding<->Input.options coupling lives in slider.rs only; analysis.rs does not learn about Slider specifics — the binding is constructed at the UI layer from an Input AST node."
  - "Computed-param case (Decision 2 case iii — ParamNode::FromQuery) is explicitly out of scope. Document the deferral in the slider module's top-of-file comment AND in propagate_param's body comment so the next driver knows where to start. ac-15 locks the deferral as a behavioural property: the walk does not mutate any param_state entry other than the named root."
  - "ChartView wiring: a future helper ChartView::propagate_param_and_redraw is allowed but not required by this spec. The Slider widget owns its dispatcher invocation; ChartState observation is the consumer's concern."
  - "Test naming discipline: every code AC ac-NN has exactly one test function rpw3_acNN_*. The audit traceability table assumes 1:1 mapping; do not bundle multiple tests under a single AC."

ontology_schema:
  name: "ReactiveParamsV3"
  description: "Models the slice — coordinator chain walk, dispatcher trait, slider widget, and vocab flip."
  fields:
    - name: "topological_descendants"
      type: "function"
      description: "Pure free function in brightfield-spec/analysis.rs. Inputs: &SpecAnalysis, &str (root param). Output: Vec<String> in topological order, root first."
    - name: "propagate_param_walk"
      type: "method body"
      description: "New body of Session::propagate_param. Updates param_state[name], walks topological_descendants, deduplicates marks first-level-wins via HashSet<usize>, dispatches per level via emit_query honouring a selections_ref captured once before the loop."
    - name: "ParamDispatcher"
      type: "trait"
      description: "Mirror of SelectionDispatcher. fn dispatch(&mut self, name: &str, value: SpecValue) -> Vec<(usize, Result<Vec<RecordBatch>, EngineError>)>. Implemented for Session by forwarding to propagate_param."
    - name: "SliderBinding"
      type: "struct"
      description: "{ param_name: String, min: f64, max: f64, step: Option<f64> }. Constructed at the UI layer from Input.options."
    - name: "Slider"
      type: "GPUI widget"
      description: "Track + thumb, mouse handlers, current value as overlay state during drag, commits via commit_slider_release on mouse_up."
    - name: "commit_slider_release"
      type: "function"
      description: "Pure helper. Inputs: &SliderBinding, value: f64, &mut impl ParamDispatcher. Output: Vec<(usize, Result<Vec<RecordBatch>, EngineError>)>. Enables UI tests against a recording dispatcher double via the lifted-helper boundary (cfs2_ac11 precedent)."
    - name: "InputKind::Slider"
      type: "vocab variant flip"
      description: "Status moves from Unimplemented to Implemented in crates/brightfield-spec/src/vocab.rs:222."

evaluation_principles:
  - principle: "Cross-coordinator symmetry — propagate_param's shape, partial-failure behaviour, AND selection_state passthrough mirror propagate_selection, so the runtime layer reads as a single pattern rather than two."
    weight: 0.25
  - principle: "Rally seam discipline — selection_state and the cfs2 surface are read-only or untouched; v2/cfs2 test sources untouched; signature regressions caught by the falsifiable seam-fingerprint diff."
    weight: 0.25
  - principle: "Test depth — 15 code ACs aligned 1:1 with rpw3_acNN_* test functions, plus one gate, covering chained walk + selection passthrough, first-level dedup with ordering, partial failure with named EngineError variant, descendants-only scope, leaf no-op, dispatcher forwarding, slider binding, slider dispatch, no-drag-no-dispatch, vocab conformance, and case-iii deferral guard."
    weight: 0.25
  - principle: "Widget end-to-end — slider lands as a real GPUI widget, not a stub; the lifted-helper boundary keeps tests fast without a GPUI test rig. The trait + binding shape lets Menu/Search/Table slot in later without coordinator changes."
    weight: 0.25

exit_conditions:
  - "All 15 code acceptance criteria green (rpw3_ac01..rpw3_ac15)."
  - "Rally seam gate ac-16 green: cargo test passes, cargo tree -p brightfield-render shows no gpui, signature-fingerprint diff produces no hits, v2/cfs2 test source diff is empty."
  - "Existing rpw2_*, cfs_*, cfs2_* tests pass without source modifications."
  - "Card 0005 specs array contains this spec path."
  - "PR opened against rally/reactive-parameters-runtime targeting main, description references this spec."

