[package]
name = "brightfield-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Measured performance baseline: repeatable interaction-latency and frame-time harness"

[dependencies]
brightfield-engine = { workspace = true }
brightfield-spec = { workspace = true }
brightfield-sql = { workspace = true }
brightfield-shell = { path = "../brightfield-shell" }
brightfield-protocol = { workspace = true }
# The blank-frame readback: `VelloRenderer::frame_ink` renders a composed scene
# and reports what reached the target, so a cell is timed only after its picture
# is proven to exist.
brightfield-render = { workspace = true }
# Dataset generation: deterministic hash-derived columns written to Parquet.
# One workspace `duckdb` spec, shared with brightfield-engine, so Cargo resolves ONE bundled build.
duckdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Adapter identity for the machine profile — same wgpu the shell renders on.
vello = { workspace = true, features = ["wgpu"] }
pollster = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
