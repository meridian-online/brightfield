goal: >
  The axis-inset round — close the crossfilter-round product finding "edge
  points at domain bounds clip to slivers": scale ranges currently land domain
  edges exactly on the plot frame and the frame clip trims the overhang.
  Consume Mosaic's plot-level inset attribute family (inset, xInset/yInset,
  xInsetLeft/xInsetRight/yInsetTop/yInsetBottom) with most-specific-wins
  resolution, and default a small inset (DEFAULT_SCALE_INSET = 5px) on
  continuous positional scale ends so edge marks render whole — zero-baseline
  ends exempt (bars/areas stay flush on the axis). Re-baselines every example
  PNG behind a before/after gallery. Contract and the recorded
  deviation-from-Mosaic-default: tabletop-note.md alongside this spec.

constraints:
  - "Inset is pixel-RANGE-side only; domains untouched; the frame clip stays exactly where it is (scene.rs:84-91, :170-174, :307-318). Plot's own model: insets are additive px pulled off each range end."
  - "Both layout models move together: render layout.rs and ui chart_layout.rs each carry the resolved insets, pinned by a cross-model agreement test. crossfilter.rs imports the render model, chart_state.rs the ui one — both paths must see identical ranges. Unification is a recorded reserve, not attempted here."
  - "Recorded deviation: Mosaic/Plot default inset is 0 (Plot does not clip marks by default; Brightfield does). Brightfield defaults DEFAULT_SCALE_INSET = 5.0 px on continuous ends, zero-baseline ends exempt via the zero_baseline_channel() hook. Explicit spec insets — including explicit 0 — always override. Hugh vetoes via the gallery, not archaeology."
  - "Every example PNG re-baselines — expected, not a halt. A diff NOT explainable by the inset (text reflow, colour shifts, anything beyond marks/axes moving by the resolved amounts) IS a halt. Before set = examples dumped from main at branch point (post-hexbin); cfr-baselines retires when this round lands."
  - "Sanctioned churn: layout.rs gpu_layout_plot_area/gpu_layout_ranges and chart_layout.rs gmr_ac08_* re-pin to inset-aware values; nothing else pixel-exact should exist (scale.rs and axis.rs units build scales directly and must NOT need touching)."
  - "Vendored 54-spec corpus parses and sweeps green after the attrs become consumed (presidential-opinion, axes, wind-map, voronoi, driving-shifts, population-arrows carry plot-level insets today)."
  - "Never cargo fmt --all; suite runs with set -o pipefail + explicit exit check; cargo 1.95 condensed summary line."

acceptance_criteria:
  - id: axi-ac01
    ac_type: code
    description: "Inset resolution: plot-level inset, xInset, yInset, xInsetLeft, xInsetRight, yInsetTop, yInsetBottom resolve from PlotNode.attributes into four per-side pixel insets, most-specific-wins per side (e.g. left = xInsetLeft ?? xInset ?? inset), sides independent; a non-numeric value degrades with a parse warning naming the attribute (not a silent drop); mark-level inset/insetLeft/insetRight (rect gap semantics — flights-200k, crossfilter, flights-hexbin) are recorded-deferred and stay inert in Mark.options as today. The resolution function is a single shared, gpui-free unit both layout models consume."
    verification: "axi_ac01: unit matrix over the precedence chain (global/per-axis/per-side, overrides, explicit 0, malformed) + the corpus attribute shapes. verifies: capability"
  - id: axi-ac02
    ac_type: code
    description: "Range inset, render path: x/y pixel ranges pull inward by the resolved per-side insets before scales are built; defaults per the deviation constraint — DEFAULT_SCALE_INSET on both ends of continuous (linear/time) positional scales, EXCEPT the end pinned to 0 by extend_domain_to_zero on a channel some renderer in the plot declares via zero_baseline_channel() (bars/areas stay flush; multi-mark plots exempt the channel if any mark declares it); band scales get no default (explicit insets still shrink the band range extent, composing with padding, not replacing it); explicit attribute values override defaults including explicit 0 (Mosaic-exact opt-out)."
    verification: "axi_ac02: unit matrix — linear/time/band × default/explicit/zero-anchored ends × single- and multi-mark; bar fixture stays flush at baseline, dot fixture insets both ends. verifies: capability"
  - id: axi-ac03
    ac_type: code
    description: "Interaction parity: the ui ChartLayout carries identical resolved insets; a cross-model agreement test pins render x_range()/y_range() equal to the ui plot-area-derived ranges for the same dims + insets (killing the agree-by-luck class for insets); brush inversion round-trips — a pixel at the inset range end inverts to the domain end (invert_pixel_brush / inverse_f64 consistent with drawn geometry); point-click hit tests stay consistent with rendered mark positions."
    verification: "axi_ac03: agreement unit; inversion round-trip units at inset ends; a point-select probe on an inset fixture. verifies: capability"
  - id: axi-ac04
    ac_type: code
    description: "Widen-only composition: insets bake into launch scales and anchored rebuilds preserve launch range_start/range_end verbatim (anchor_scale already copies ranges — scale.rs:359-398) — a subset-gesture rebuild is pixel-identical with a nonzero inset in play; a widening gesture folds domains only, ranges (and thus the inset) hold still."
    verification: "axi_ac04: anchored-rebuild byte/scene probe with nonzero inset; extends the existing cfs anchoring test family. verifies: capability"
  - id: axi-ac05
    ac_type: code
    description: "The finding closes: a dot whose value sits at domain min/max renders its full disc inside the plot frame — scene probe samples the dot's outer-edge pixels inside the plot rect (today they are clipped away); the frame clip itself is untouched."
    verification: "axi_ac05: packed-RGBA scene probe (the #36 precedent) on an edge-value dot fixture, before-shape asserted against the after-shape. verifies: capability"
  - id: axi-ac06
    ac_type: code
    description: "Re-baseline + gallery: every examples/*.yaml re-dumped; ALL PNGs expected to move (a non-moving PNG is investigated — it means the plot has no continuous positional scale or the inset failed to thread); a before/after gallery covering every example is produced (before = main-at-branch-point dumps, after = branch dumps, side-by-side); the new after set becomes the canonical baseline directory replacing cfr-baselines."
    verification: "axi_ac06: the sweep script run against the before set reports all-DIFFERS-explained; gallery artifact delivered to Hugh. verifies: capability (the sweep); the gallery review itself is axi-ac07."
  - id: axi-ac07
    ac_type: manual
    description: "Hugh's gallery: the full before/after set, with the edge-trim examples called out (scatter, point-select, regression, rules, line/area endpoints) and the bar/area fixtures confirming baselines stayed flush; in-app look at scatter and legend-select at domain extremes. This ack is also the veto point for the 5px default deviation."
    verification: "axi_ac07: gallery ack. verifies: stand-in (real thing is Hugh's eyeball over the full before/after set), accepted because the round's entire cost is visual and the gallery is the review artifact."
  - id: axi-ac08
    ac_type: gate
    description: "Ship gate: full workspace suite green (pipefail, condensed 1.95 summary, explicit exit); double-render determinism unchanged; vendored corpus sweep green; PNG sweep per axi-ac06."
    verification: "axi_ac08: cargo test --workspace; determinism double-render cmp; corpus sweep; full PNG sweep vs the before set with the all-moves-explained report. verifies: capability"

deferred:
  - "Mark-level insets (rect/hexbin inset, insetLeft/insetRight — shrink-each-rect gap semantics, used by flights-200k/crossfilter/flights-hexbin): a different feature riding the mark attr substrate, not the scale range."
  - "Nice domain rounding (Plot's other answer to edge clipping) — domain-side, interacts with widen-only anchoring; its own tabletop if ever."
  - "Layout-model unification (render layout.rs vs ui chart_layout.rs) — reserve path; this round pins agreement by test instead."
  - "inset: $param threading — same literal-only opt_f64 substrate as hexbin's binWidth deferral."
