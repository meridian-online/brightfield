meta:
  title: Regression — Brightfield example
  description: |
    A `regressionY` mark — the ordinary-least-squares fit line with a 95%
    confidence band — drawn over a `dot` scatter of the same data.

      cargo run -p brightfield-app -- examples/regression.yaml

    Headless:

      BRIGHTFIELD_DUMP_PNG=regression.png cargo run -p brightfield-app -- examples/regression.yaml
