feature: "Cross-filtered selections across linked views"
as_a: "analyst investigating patterns across multiple charts"
i_want: "a brush or click in one view to filter the others"
so_that: "I can reason about how a subset of the data appears across different perspectives"

scenarios:
  - name: "Brush on one plot filters the others"
    given: "a dashboard with two plots linked by a shared selection"
    when: "I brush a region in the first plot using intervalX, intervalY, or intervalXY"
    then: "the second plot updates to reflect only the rows inside that brushed region"
    source_lines: "brightfield-brief.md: 'Selections: First-class query predicates (equivalent to SQL WHERE clauses) that can combine filters from multiple interactors across multiple views.'"

  - name: "Selection resolution strategy is declared in the spec"
    given: "a spec declares a selection with a resolution strategy of intersect, union, or single"
    when: "multiple interactors contribute predicates to that selection"
    then: "the resolved predicate combines those contributions according to the declared strategy"
    source_lines: "brightfield-brief.md: 'Supports Mosaic's resolution strategies: intersect — combine all predicates with AND. union — combine with OR. single — only the most recent predicate.'"

  - name: "A view's own selection does not filter itself"
    given: "a plot contributes a predicate to a selection it is also bound to"
    when: "the selection resolves for that plot's query"
    then: "the plot's own predicate is excluded from its own filter so it retains context around the selection"
    source_lines: "brightfield-brief.md: 'Cross-filter resolution — synthesise different predicates for different clients (e.g., exclude a client's own predicate from its own filter).'"

  - name: "Clearing a selection retracts its predicate"
    given: "a selection has been populated by an interactor on one plot and is filtering linked views"
    when: "I dismiss the selection — clicking outside the brushed region or otherwise clearing it"
    then: "the contributor's predicate is retracted, the selection re-resolves without it, and downstream views revert to the unfiltered data"
    source_lines: "brightfield-brief.md: 'Selections are live predicates — interactors contribute and retract them; clients re-resolve on every change.'"

  - name: "A plot can drive multiple selections at once"
    given: "a plot is bound as contributor to two distinct selections (e.g. a point selection on one channel and an interval selection on another)"
    when: "I make both a point selection and an interval selection on the same plot"
    then: "each selection holds its own predicate independently, and any view subscribing to either selection sees only that selection's resolved predicate"
    source_lines: "brightfield-brief.md: 'A single component may emit predicates into multiple selections — each selection is its own first-class channel.'"

  - name: "Selections persist across param changes when the domain still applies"
    given: "a brush is active on a plot whose query references a reactive param"
    when: "a slider changes that param and the plot's data refreshes"
    then: "the brush predicate persists and continues to filter downstream views — the selection is independent of param-driven re-execution as long as the brushed domain is still meaningful"
    source_lines: "brightfield-brief.md: 'Params and selections are orthogonal channels — a param change re-queries data, but selection predicates are retained until explicitly retracted.'"

maturity: "emerging"

specs:
  - orbit/specs/2026-04-21-cross-filtered-selections-across-linked-views/spec.yaml
  - orbit/specs/2026-04-28-cross-filtered-selections-runtime/spec.yaml
  - orbit/specs/2026-07-10-crossfilter-render-fidelity/spec.yaml

references:
  - "brightfield-brief.md"
