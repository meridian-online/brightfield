goal: >
  Axis and plot titles — the in-app finding "I can't see any labelled axes in
  the cross-filter; I don't know which chart is which" closes. Each positional
  axis renders its field-name title (the encoding's column name from the
  ChannelMap by default; x below the tick labels, y rotated up the left margin),
  overridable per axis via Mosaic's xLabel/yLabel (literal-only, most-specific
  over the derived default; an explicit null or empty string suppresses), and
  each plot renders an optional title from its `title` attribute above the frame.
  Titles are DATA INK — they render in authoring, presentation, AND the headless
  PNG dump — so the margins grow to fit them and every example PNG re-baselines
  behind a before/after gallery (the axis-inset ceremony). The margin budget
  composes with the axis-inset range pull without either clipping the other.

constraints:
  - "Titles ride a render arg + a LivePlot field, NOT ChartLayout: both layout models are #[derive(Copy)] and Strings break Copy. The resolved titles thread spec → assembly (main.rs, beside inset resolution) → build_multi_mark_scene via a titles arg (mirroring the existing draw_inline_legend flag) and LivePlot carries them for anchored rebuilds. ChartLayout stays Copy — it gains only the grown MARGINS (f64), never the title text."
  - "Orthogonal to axis-inset, and must stay so: margins are the outer budget OUTSIDE the frame; insets pull the positional RANGE inward INSIDE the frame (DEFAULT_SCALE_INSET, card 0018/#55). The two never clip each other. inset.rs and brightfield-spec::layout::resolve_plot_insets are untouched; a titled plot still applies the 5px inset. The composition needs a new ChartLayout::with_margins_and_insets constructor — today with_margins forces Insets::default and with_insets forces Margins::default (layout.rs:73/85), so no constructor carries both."
  - "Both layout models move together — AND the ui RUNTIME holder, not just the bare struct. render layout.rs (crossfilter.rs imports it) and ui chart_layout.rs each carry the grown margins, but the ui model's runtime holder is ChartState, which today threads insets ONLY and rebuilds via with_insets on every set_dimensions (resize) / set_insets — forcing Margins::default. So margins need the full axis-inset ceremony insets already have: a PlotRender.margins field → ChartState.margins fed via a new set_margins_and_insets → set_dimensions/set_insets rebuilding with_margins_and_insets so a resize does NOT reset them (self.insets preservation is the template) → a brush-inversion/point-click round-trip on a titled fixture (apt-ac06). Without this the render scene draws marks at grown-margin ranges while ChartState.plot_area() inverts gestures at default margins — a ~font-height desync on nearly every titled (i.e. default-derived-title) plot. Pinned by the cross-model agreement test — the axi-ac03 sibling — extended to feed per-side-DISTINCT grown margins. Unification stays a recorded reserve."
  - "Field name is read at the axis-draw sites from the ChannelMap already in scope (ChartData.channel_map, scene.rs; channel_map.get(Channel::X/Y) → column name, channel.rs:112) — no new plumbing to REACH the name. Derived titles are literal column names verbatim (Mosaic makes no attempt to humanise); no arrow synthesis, no prettification."
  - "Fixed title-band margins, not measured: this sizes the CROSS-axis dimension only. A title runs ALONG its axis (y rotated → length runs vertically down the plot height; x/plot-title horizontal → length runs along the plot width), so the dimension it consumes IN the margin is the font height (~TITLE_SIZE + pad), constant regardless of title length — that is what the fixed band reserves, and it is correct in all three orientations. The ALONG-axis extent is NOT bounded: title ink is drawn unclipped (the mark clip is popped before axes/titles draw; compose_dashboard adds no inter-plot clip), so a pathologically long title overflows along-axis and, in a multi-view dashboard, can bleed into a neighbour. Accepted for v1 and recorded with the measured-fit deferral; realistic column-name/author titles do not bleed."
  - "Hot-reload gated via ChromeSnapshot, like insets and colorScheme: a title/label/plot-title edit diverges the snapshot → 'restart to apply'; the watcher does not live-swap a re-titled/re-margined layout (it swaps scenes, never rebuilds the coordinator)."
  - "Render-only: no SQL, no plan hash, no coordinator query change. The vendored corpus keeps parsing and sweeps green once xLabel/yLabel/title become consumed attributes (presidential-opinion, airline-travelers and the labelled corpus specs carry them today)."
  - "Every example PNG re-baselines — expected, not a halt. A diff NOT explainable by added title ink + the fixed margin growth (mark colour shift, tick reflow beyond the margin move, anything else) IS a halt. Before set = examples dumped from main at branch point (post-axis-inset); the axis-inset after set is the current baseline."
  - "Never cargo fmt --all; suite runs with set -o pipefail + explicit exit check; cargo 1.95 condensed summary line."

acceptance_criteria:
  - id: apt-ac01
    ac_type: code
    description: "Derived axis titles: a positional x/y channel bound to a column renders that column name as its axis title by default — x centred below the tick labels, y rotated up the left margin — resolved at the axis-draw sites from the ChannelMap in scope, so a bare spec (no label attrs) already reads as a labelled chart. A channel with no single positional-column binding gets NO derived title: an augment-only axis, and an interval-only axis (rect family x1/x2 or y1/y2 with no plain x/y — Channel::X/Y and Channel::X1/X2/Y1/Y2 are distinct keys, get() returns None, and x1=lo/x2=hi names no single field). MULTI-MARK selection is deterministic: the derived field is taken from the FIRST scene entry whose channel_map binds the positional channel to a column (subsuming the entries[0] default and covering a literal-first mark whose bound sibling would otherwise be dropped); axes are drawn once (scene.rs draw_multi_mark_scene). Placement clears the tick labels: the x-title top edge sits strictly below the x tick-label descender band and the y-title right edge strictly left of the widest y tick label (the card's no-overlap promise, machine-checked, not gallery-only). The resolution is a single gpui-free primitive (resolve_axis_titles) both layout/scene paths consume, mirroring resolve_plot_insets."
    verification: "apt_ac01: resolve_axis_titles unit — absent label attr on a column-bound x/y → derived-field-name; unbound/augment-only/interval-only → no title; a multi-mark literal-first fixture (rules.yaml shape) picks the bound sibling's column. A scene probe confirms the x/y column names appear as title ink at the expected band AND clear of the tick-label band (x-title below the descender line, y-title left of the widest y label). verifies: capability"
  - id: apt-ac02
    ac_type: code
    description: "Explicit override + suppress: xLabel / yLabel in PlotNode.attributes override the derived field name; an explicit null OR empty string suppresses that axis title (empty, no reserved band); a number or boolean value (non-string AND non-null) falls back to the derived default; literal-only — a lifted $param is a recorded deferral, treated as absent. Most-specific-wins over the derived default, matching the axis-inset attr convention (explicit-null = the Mosaic-exact opt-out). resolve_axis_titles is a PURE resolver (returns Override|Suppress|Derive, no warning); the ParseWarning::NonStringLabel for a non-string label is emitted at PARSE time in walk_plot, alongside the existing NonNumericInset scan (label keys xLabel/yLabel/title added to the scanned set) — NOT in the resolver, which runs post-parse at assembly and cannot push into the finalised ParseOutput.warnings."
    verification: "apt_ac02: resolve_axis_titles resolver unit matrix — string → Override(text); null/\"\" → Suppress; absent → Derive(field); number/bool → Derive (pure, no warning). PLUS a parse-layer unit: a non-string xLabel/yLabel/title earns ParseWarning::NonStringLabel naming the attribute (mirroring the NonNumericInset parse-time test). verifies: capability"
  - id: apt-ac03
    ac_type: code
    description: "Rotation primitive: a new draw_text_rotated renders a run bottom-to-top via Affine::translate((x,y)) * Affine::rotate(-PI/2) under the existing text pipeline; the y-axis title uses it, the x-axis title and the plot title use the horizontal draw_text. LABEL_SIZE/LABEL_COLOUR gain a TITLE_SIZE/TITLE_COLOUR sibling (title ink is distinct from tick-label ink); no change to draw_text's existing callers."
    verification: "apt_ac03: a transform unit asserting draw_text_rotated composes translate∘rotate(-PI/2) (glyph run transform), and the y-axis render site calls it; draw_text's existing tick-label callers are byte-unchanged. verifies: capability"
  - id: apt-ac04
    ac_type: code
    description: "Per-plot title: plot.attributes[\"title\"] (a literal string) renders above the plot frame, left-aligned at the frame's left edge (Observable Plot parity); absent → no title AND no reserved top-band growth; a non-string value → ParseWarning::NonStringLabel (parse-time, per apt-ac02) + no title. Independent of the window title (meta.title, card 0016) — a plot titles itself without affecting the workspace strip."
    verification: "apt_ac04: resolve unit (string → Some, absent/non-string → None) + a parse unit (non-string title warns) + a scene probe: title ink present at the top band iff declared, and the top margin grows iff present. verifies: capability"
  - id: apt-ac05
    ac_type: code
    description: "Title-aware margins computed + carried on BOTH static models: the left margin grows by a fixed title band (TITLE_SIZE + pad) when a y-title is present, the bottom margin when an x-title is present, the top margin when a plot title is present — each independent, absent titles leave the Observable-default margin untouched. A new ChartLayout::with_margins_and_insets(width, height, margins, insets) composes custom margins with resolved insets (neither resets the other) on the render model, with the matching translation into the ui model's positional with_margins(w,h,left,top,right,bottom) shape. The cross-model agreement test is extended to feed PER-SIDE-DISTINCT grown margins (belt-and-braces against a constructor-internal side transposition) so render x_range()/y_range() equal the ui plot-area-derived ranges under the SAME grown margins + insets; AND an assembly-level assertion pins the grown margins computed from one AxisTitles feeding BOTH the render Margins struct and the ui 4-arg constructor to equal per-side values (the glue, not just the two constructors)."
    verification: "apt_ac05: a margin-growth unit (present → grown by the band, absent → default) on both models; the extended agreement unit feeding per-side-distinct grown margins (render vs ui ranges equal under grown-margins + insets together); an assembly-glue unit (one AxisTitles → equal per-side margins in both model shapes). verifies: capability"
  - id: apt-ac06
    ac_type: code
    description: "ui RUNTIME margin threading + interaction parity (closes the review HIGH): the ui model's runtime holder is ChartState, which today threads insets ONLY and rebuilds via with_insets on set_dimensions (resize) / set_insets — forcing Margins::default. So: PlotRender carries the resolved grown margins; ChartState stores them (a margins field) fed via a new set_margins_and_insets at assembly (mirroring the set_insets thread); set_dimensions AND set_insets rebuild via with_margins_and_insets so a window resize does NOT reset margins (self.insets preservation is the template). Without this, ChartState.plot_area() — driving brush inversion (invert) and point-click hit-testing — uses default margins while the scene draws marks at grown-margin ranges, desyncing gestures ~font-height on every default-derived-title plot."
    verification: "apt_ac06: a resize-preservation unit (set_dimensions after set_margins_and_insets keeps the grown margins, not Margins::default); a brush-inversion + point-click round-trip on a titled (grown-margin) fixture — a pixel at a mark's rendered position inverts to that mark's datum (extends axi-ac03, killing the desync class). verifies: capability"
  - id: apt-ac07
    ac_type: code
    description: "Orthogonal to axis-inset: inset.rs and brightfield-spec::layout::resolve_plot_insets are diff-clean; a titled plot still applies DEFAULT_SCALE_INSET on continuous ends; margins (outer) and insets (range pull) compose without clipping — an edge-value mark at a domain bound still renders whole (apt fixture preserves axi-ac05's guarantee) now inside the grown margins. The range derives as plot_bounds(grown margins) THEN the inset pull, in that order."
    verification: "apt_ac07: a compose unit (grown margins + nonzero inset → range = inner-of(plot_bounds(grown margins)) pulled by the inset) + an inset.rs/resolve_plot_insets diff assertion (unchanged) + the edge-dot scene probe (axi-ac05 precedent) on a titled fixture. verifies: capability"
  - id: apt-ac08
    ac_type: code
    description: "Hot-reload gated: a title / xLabel / yLabel / plot-title edit diverges the ChromeSnapshot → 'restart to apply' (like insets and colorScheme); the watcher does not live-swap a re-titled or re-margined layout. The resolved titles + grown margins are captured in the snapshot the divergence check reads."
    verification: "apt_ac08: a chrome_divergence unit — a spec differing only by an xLabel (or a plot title) diverges the snapshot; an identical spec does not. verifies: capability"
  - id: apt-ac09
    ac_type: code
    description: "Titles ride the render arg + LivePlot field, not ChartLayout: the resolved titles thread from the spec through assembly (main.rs, beside the inset resolution at build time) into build_multi_mark_scene via a titles arg (mirroring draw_inline_legend), and LivePlot carries them so an anchored rebuild re-emits the same titles; ChartLayout stays Copy (gains grown-margin f64s only, no String). LivePlotMeta carries the titles for the ChromeSnapshot gate."
    verification: "apt_ac09: a build-path unit — the assembled scene for a titled plot carries the title ink, and an anchored (widen-only) rebuild re-emits it; ChartLayout has no String field (type-level / it still derives Copy). verifies: capability"
  - id: apt-ac10
    ac_type: manual
    description: "Re-baseline + gallery: every examples/*.yaml re-dumped; PNGs that gain a positional axis title or plot title move (added title ink + the fixed margin growth) and a non-moving PNG is investigated; a before/after gallery covers every example, each diff title-explainable; the crossfilter example (the motivating case) now shows labelled axes distinguishing its two dot plots. At least one baselined example gains a plot-level `title` (crossfilter is the natural pick — the gallery then shows derived axes AND a rendered plot title) so the plot-title styling veto is backed by a real image, not just a unit probe. The interval-only rect examples (rect-histogram: x untitled/y=count titled; rect-cells: both axes untitled → a byte-identical non-move) are NAMED as expected no-title / non-move cases so they don't read as unexplained non-moves. Hugh's gallery ack is the veto point for title styling — size, colour, plot-title placement (left vs centred)."
    verification: "apt_ac10: the sweep run against the before set reports all-DIFFERS-explained (with the named interval-axis no-moves justified); gallery artifact delivered to Hugh, crossfilter legibility + the rendered plot title called out. verifies: stand-in (real thing is Hugh's eyeball over the before/after set + the crossfilter legibility check), accepted because the round's payload is visual and the gallery is the review artifact."
  - id: apt-ac11
    ac_type: gate
    description: "Ship gate: full workspace suite green (pipefail, condensed 1.95 summary, explicit exit); double-render determinism unchanged; the vendored corpus parses and sweeps green with xLabel/yLabel/title now consumed; PNG sweep per apt-ac10."
    verification: "apt_ac11: cargo test --workspace; determinism double-render cmp; corpus parse+sweep; full PNG sweep vs the before set with the all-moves-explained report. verifies: capability"

implementation_notes:
  - "Resolution: add resolve_axis_titles(plot, channel_map) -> AxisTitles beside resolve_plot_insets in brightfield-spec::layout — a PURE literal reader (Override(String) | Suppress | Derive per axis; the null/empty sentinel → Suppress; number/bool → Derive), NO warning side effect (resolve_plot_insets is the exact template: warning-free reader). Plot title: resolve_plot_title(plot) -> Option<String>. The NonStringLabel warning is emitted at PARSE time in walk_plot (parse.rs:800-808, the NonNumericInset site) — add xLabel/yLabel/title to a label-keys scan there; ParseOutput.warnings (parse.rs:316) is finalised at parse, so a post-parse resolver cannot push into it."
  - "Multi-mark derive source: the scene path holds one channel_map PER entry (entry.channel_map), not a composed plot map, and draw_multi_mark_scene draws axes once outside the per-entry loop (scene.rs:321-328). Pick the FIRST entry whose channel_map binds the positional channel to a column (subsumes the entries[0] default that infer_multi_mark_scales already uses at scene.rs:224/263; covers a literal-first mark, e.g. rules.yaml's ruleY literal 30, whose bound sibling would otherwise be dropped). axis-inset's resolve_insets_for_marks (inset.rs) is the cross-mark-composer precedent. Multi-mark binding the SAME axis to DIFFERENT columns → v1 takes the first; differing-columns composition is deferred."
  - "Interval channels: Channel::X/Y and Channel::X1/X2/Y1/Y2 are distinct enum variants (channel.rs:19-31); get() reads the exact key only (channel.rs:112). rect/rectX/rectY bind x1/x2/y1/y2 with no plain x/y → get(Channel::X) is None → no derived title (an interval axis names no single field; xLabel is the escape hatch). rect-histogram/rect-cells are the expected no-title / non-move cases in apt-ac10."
  - "Render sites: axis.rs render_x_axis (:182) / render_y_axis (:215) gain a resolved title arg; scene.rs build_chart_scene axes (:177-184) and draw_multi_mark_scene axes (:321-328) pass it. Title placement clears the tick-label band: x tick labels sit at plot_y_end+TICK_LENGTH(5)+LABEL_SIZE(11) (axis.rs:206), y labels right-aligned at plot_x_start-8 (axis.rs:238) — place the x-title below the descender, the y-title left of the widest y label. text.rs: add draw_text_rotated near draw_text (:108-113 Affine::translate line), + TITLE_SIZE/TITLE_COLOUR beside LABEL_SIZE (11.0)/LABEL_COLOUR. Title ink is unclipped (mark clip popped before axes draw, scene.rs:171/174/308/318; no inter-plot clip in compose_dashboard :379-386) → long-title along-axis overflow is the accepted v1 limitation."
  - "Margins — static models: render layout.rs Margins default top20/right20/bottom30/left40 (:49-59); add with_margins_and_insets (with_margins :73 and with_insets :85 each reset the other today). ui chart_layout.rs takes positional with_margins(w,h,left,top,right,bottom) (:62) — translate the same grown margins into it; extend the cross-model pin (chart_layout.rs:254-275) to feed per-side-DISTINCT grown margins + an assembly-glue assertion. inset.rs axi_ac05 geometry proof (:451-500) is the edge-dot probe template for apt-ac07."
  - "Margins — ui RUNTIME (the HIGH): ChartState stores insets ONLY (chart_state.rs:48) and rebuilds via with_insets on set_dimensions (:191, resize) / set_insets (:203) — both force Margins::default (chart_layout.rs:82-92). Add a PlotRender.margins field + ChartState.margins fed via a new set_margins_and_insets (mirroring the set_insets thread at main.rs:1378, currently the only ui-model thread); rebuild both set_dimensions/set_insets via with_margins_and_insets preserving self.margins (self.insets is the template). ChartState.plot_area() (chart_layout.rs:106) drives invert / point-click — so the inversion round-trip (apt-ac06) is the real guard, not the static constructor test."
  - "Assembly: main.rs resolves insets at :816-834 then build call :838 — resolve titles + grown margins right beside it, pass into build_multi_mark_scene. LivePlot (crossfilter.rs:84) gains a titles field like scheme; LivePlotMeta (main.rs:434) carries them for the ChromeSnapshot gate (main.rs:483/542). render_plot_scene (crossfilter.rs:691-719) re-emits them on anchored rebuild. draw_inline_legend is the exact precedent for a bool/Option threaded arg — titles follow that seam, not ChartLayout (Copy)."
  - "Attribute source: xLabel/yLabel/title live in PlotNode.attributes (ast.rs:265), same bag as the inset attrs. Aggregate/derived channels (fill {count:} → __bf_count) are a fill-channel concern, not positional — positional x/y are usually plain columns, so the Derive default reads clean; a positional $param axis derives the param name (acceptable, override available)."

ontology_schema:
  name: "AxisTitles"
  description: "A plot's resolved axis + plot titles, gpui-free, consumed by both layout/scene paths and captured in the ChromeSnapshot."
  fields:
    - name: "x"
      type: "AxisTitle"
      description: "Override(String) | Suppress | Derive — the x-axis title decision; Derive resolves to the ChannelMap x column name at the render site."
    - name: "y"
      type: "AxisTitle"
      description: "Override(String) | Suppress | Derive — the y-axis title decision; the render site rotates it -PI/2."
    - name: "plot"
      type: "Option<String>"
      description: "The per-plot title from plot.attributes[\"title\"]; None → no title and no reserved top band."

deferred:
  - "Measured title-fit margins + along-axis clip — the fixed band sizes the cross-axis dimension only; a pathologically long title overflows along-axis (unclipped, can bleed into a neighbour in a multi-view dashboard). Content-measured margins and/or a title-band clip are the follow-on (needs a text-metrics pass)."
  - "Interval-only axes (rect family x1/x2, y1/y2 with no plain x/y) — no derived title in v1 (an interval axis names no single field: x1=lo, x2=hi); xLabel/yLabel is the escape hatch. Deriving from x1 or a shared-scale label is the follow-on."
  - "Multi-mark plots binding the SAME positional axis to DIFFERENT columns — v1 derives from the first column-bound entry; composing/choosing across differing columns is deferred (the resolve_insets_for_marks composer is the eventual shape)."
  - "xLabel/yLabel/title: $param threading — literal-only now, same substrate as inset/binWidth's recorded $param deferral."
  - "Derived-title prettification / humanisation (snake_case → Title Case, aggregate-channel synthesis like {count:} → 'Count', directional arrows) — Mosaic makes no attempt; authors override by hand."
  - "The wider Mosaic axis-attr surface (labelAngle, tickFormat, titleFontSize, titleAnchor) — v1 does derived field name + xLabel/yLabel override + plot title only."
  - "Colour/size LEGEND titles (the fill-channel analogue of an axis title) — a separate feature on the legend substrate; card 0019 scopes to axis + plot titles."
  - "Facet/concat shared-axis title dedup — each plot titles independently in v1."

