---
# Deviation registry — single source of truth for deliberate divergences
# between Mosaic-web rendering and brightfield. Consumed by:
#   - the registry-integrity gate (tests/registry_integrity.rs)
#   - the curated-preflight gate (tests/curated_preflight.rs)
#   - the generate-deviations binary (emits DEVIATIONS.md)
#
# Schema: every record has { id (DEV-NNNN, unique), surface, mosaic_behaviour,
# brightfield_behaviour, rationale, affected_specs (filenames in
# vendor/curated/yaml/), conformance_layers_suppressed (list of 1..=4) }.
deviations:
  - id: DEV-0001
    surface: rendering
    mosaic_behaviour: |
      Mosaic web renders plot/concat layouts, marks (dot, line, rectY, rule,
      frame, etc.), legends, and interactors (intervalX, intervalXY,
      highlight, toggle, nearest) against a live DuckDB session.
    brightfield_behaviour: |
      The renderer and the interaction seam both ship. Marks, axes, scales,
      legends and interactors are drawn as a Vello 2D scene by the
      framework-free `brightfield-render` crate and presented both live
      (egui/wgpu shell) and headless (PNG); an interaction resolves to a
      pushed predicate and a re-query through the Interaction/Coordinator
      seam, which headless tests script today. The layered conformance runner
      GATES layers 1 (AST round-trip) and 2 (data-source SQL/DDL equivalence):
      layer 1 passes across all 10 curated specs, layer 2 across the 9 that
      declare data sources. Layers 3 (visual-encoding equivalence) and 4
      (interaction equivalence) are accounted for HERE — this record names all
      10 curated specs at both layers, so the runner reports those 20 cells as
      `LayerOutcome::Suppressed` against this id rather than leaving them to a
      pending string nobody has to keep true.
    rationale: |
      Conformance is only as strong as its oracle, and what is missing at
      layers 3 and 4 is the ORACLE, not the capability. Nothing yet diffs a
      rendered brightfield scene's mark/scale/channel structure against Mosaic
      web's, and nothing yet holds a scripted interaction's resulting
      selection state against Mosaic web's for the same events. Until
      something does, calling those cells green would be a lie and leaving
      them merely pending would make them invisible — so they are suppressed
      against this written record, which is the accounting surface. Retiring
      it on purpose is per-spec and MANUAL: wire the oracle, drop that
      filename from `affected_specs`, flip the layer in the spec's
      `.expected.yaml`, and the run judges the cell for real. Retiring it
      involuntarily is the runner's job — the check runs even for a
      suppressed pair, and a check that PASSES where this record claims a
      divergence fails the cell as a stale deviation. So a spec whose layer
      starts passing while still listed here does redden the run; what this
      record cannot tell you is the difference between a layer that is still
      broken and one nobody has built an oracle for, because both come back
      not-passing.
    affected_specs:
      - crossfilter.yaml
      - facet-interval.yaml
      - flights-200k.yaml
      - legends.yaml
      - line.yaml
      - mark-types.yaml
      - overview-detail.yaml
      - seattle-temp.yaml
      - sorted-bars.yaml
      - table.yaml
    conformance_layers_suppressed: [3, 4]
  - id: DEV-0002
    surface: "data source — DuckDB attach"
    mosaic_behaviour: |
      Mosaic web uses ATTACH without a read-only flag, allowing both
      read and write access to the attached DuckDB database file.
    brightfield_behaviour: |
      brightfield emits ATTACH '<path>' AS "<alias>" (READ_ONLY),
      enforcing read-only access to prevent accidental corruption of
      the user's production database during exploration.
    rationale: |
      Exploration safety: the card's scope is read-only analysis. A
      user pointing brightfield at a production .duckdb file should not
      risk inadvertent writes. The READ_ONLY flag is a deliberate
      safety divergence from Mosaic-web's wire shape.
    affected_specs: []
    conformance_layers_suppressed: [2]
  - id: DEV-0003
    surface: "colour scale — sequential scheme default"
    mosaic_behaviour: |
      Mosaic/Observable Plot default an unspecified quantitative colour
      scale's scheme to `turbo` (a rainbow map).
    brightfield_behaviour: |
      brightfield defaults the sequential colour scheme to `viridis`.
      `turbo` remains available by name (`colorScheme: turbo`), so a spec
      that names a scheme renders it; only the *unspecified* default differs.
    rationale: |
      Perceptual uniformity and colourblind safety: viridis is perceptually
      uniform and colourblind-safe, whereas turbo is a rainbow map with known
      perceptual artefacts at the extremes. Viridis is the de-facto modern
      default (matplotlib, ggplot). Spec portability is preserved — a
      `colorScheme: turbo` spec still renders turbo; only the default diverges.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0004
    surface: "colour — default categorical palette / default mark colour"
    mosaic_behaviour: |
      Mosaic/Observable Plot default the categorical colour scheme to
      observable10 (first slot #4269d0) and an unencoded mark's colour to
      "currentColor" resolving in practice to the observable10/Tableau10
      steel blue; there is no "meridian" scheme name.
    brightfield_behaviour: |
      brightfield's default categorical palette is the Meridian design
      system's "Harbour" order (8 slots, first slot blue #0083c4) and the
      default single-mark colour is Harbour slot 1. `colorScheme: meridian`
      is Brightfield-local sugar for the Meridian sequential ramp (13
      blue-240 stops); the sequential DEFAULT remains viridis (DEV-0003).
      Explicit `colorDomain`/`colorRange` literals are honoured, and
      `serialise_spec` expands `colorScheme: meridian` into explicit
      `colorRange` stops on export, so exported specs stay
      vanilla-Mosaic-portable.
    rationale: |
      Design-system adoption (Meridian phase 4): Harbour's slot ORDER is a
      colourblind-safety mechanism (chosen for maximum adjacent CVD
      distance) and its colours are tuned to the warm Meridian chart
      surface. Portability is preserved the same way DEV-0003 preserves it:
      a spec that names a portable scheme renders it; only renderer DEFAULTS
      and a Brightfield-local scheme name (expanded to explicit colours on
      export) diverge.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0005
    surface: "scales — positional domain pinning (`Domain: Fixed`, and two numbers)"
    mosaic_behaviour: |
      Mosaic accepts `Fixed` at `xDomain`, `yDomain`, the `xyDomain`
      both-axes shorthand, and the facet axes `fxDomain` / `fyDomain`, at a
      plot and under `plotDefaults`. The domain is fixed after the first
      render, on whatever data the marks then hold, and later filtering
      leaves it where it is. The same keys also take a two-element array,
      Observable Plot's own domain, which sets the axis's ends from the first
      render whatever the rows span.
    brightfield_behaviour: |
      `Fixed` is read from a plot's own `xDomain` and `yDomain` — which now
      includes whatever `plotDefaults` set and the plot itself left unset,
      merged in at parse time before this reading runs — and the capture
      moment is Mosaic's: the pin is taken from the scales the plot's FIRST
      composition drew against, so a plot whose first render is already
      filtered pins the filtered domain. The pin holds the domain through a
      filter, a selection and a re-query, and a band scale keeps its
      category ORDER, so a filtered-away category keeps its slot rather than
      closing the gap.

      The explicit two-element domain is read, at `xDomain`, `yDomain` and
      the `xyDomain` shorthand, from the plot's own keys, from what
      `plotDefaults` sets, and from a `$param` that holds the pair now. Two
      finite numbers with the low end first fix that axis's ends on every
      composition, so the axis keeps them through a filter, a selection and
      a re-query, and the ends the file wrote are not captured from the rows.
      An axis's own key is read before `xyDomain`. A reader's pan or zoom
      takes precedence over the written ends, as it does over a pin. A value
      that is not two numbers low first (`[100, 0]`, `[0, "high"]`, `[0]`) is
      not read as a reversal or as half a pair: the axis draws as if the key
      were absent and the warning banner names the key and the value as
      written. A `$param` the file never declares, or one that holds a
      selection, holds no value and is read as an absent key. Two numbers on
      a date axis or an axis of names change nothing there, and the banner
      says so; `xNice` or `xZero` beside two numbers on a linear, log or
      symlog axis leave the ends as written, and the banner says so.

      Three positions are still NOT read, and a spec using one gets a domain
      inferred from the rows it is currently drawing: `Fixed` at the
      `xyDomain` both-axes shorthand, the facet axes `fxDomain` /
      `fyDomain`, and any spelling of `Fixed` other than the exact string.
      The warning banner names `xyDomain: Fixed` and `fxDomain` /
      `fyDomain` as keys this build does not read (DEV-0014 for `xyDomain`);
      a spelling of `Fixed` that is not the exact string is named as not
      being two numbers.

      One brightfield-local rule sits on top: pan and zoom are offered on
      any plot with a continuous positional scale, and an axis the reader
      has navigated is drawn at the navigated extent rather than the pin,
      until the navigation is reset.
    rationale: |
      The pin is a portability instruction, so the capture moment is copied
      rather than improved on: resolving an unfiltered extent instead would
      make a spec render differently here than in Mosaic, which is the one
      thing `Fixed` exists to prevent.

      The remaining unread positions are scoped by what the renderer can act
      on rather than by what the parser accepts: facets are not rendered, so
      `fxDomain` / `fyDomain` name axes that do not exist here. `plotDefaults`
      no longer belongs on this list — it reaches a plot's attributes as a
      whole, key-agnostic bag rather than a chosen few, so `Fixed` written
      there is read exactly like a value the plot set itself, not one key
      honoured while the rest of the block stayed dark.

      Navigation takes precedence because the two instructions come from
      different people about different events. `Fixed` is the author saying
      the frame must not move when the DASHBOARD moves; a pan is the reader
      moving the frame on purpose. A pin that outranked the gesture would
      make a plot silently refuse to pan.

      Two numbers are read because they are how a file puts several charts on
      one axis, 0 to 100 on a score, and without them each chart's axis moves
      with its rows and a reader who compares two charts by position is
      misled. The high end first is refused and not read as a reversal,
      because `xReverse` is the key that turns an axis. A pair on an axis that
      cannot take two numbers, or beside a nice or zero request that would
      move the ends, is named rather than half-applied, so the file and the
      drawing do not disagree in silence.
    affected_specs:
      - facet-interval.yaml
    conformance_layers_suppressed: [3]
  - id: DEV-0006
    surface: "scales — log bin space base (`xScale: log` on a binned column)"
    mosaic_behaviour: |
      Mosaic's bin transform applies the scale's transform to the column
      before it picks a bin scheme, so a binned column on a log axis is cut
      into equal RATIOS rather than equal widths, and the edges are mapped
      back to the column's own units for the mark to stand on. The transform
      d3 and therefore Mosaic apply for `scale.type = "log"` is the natural
      logarithm.
    brightfield_behaviour: |
      The shape is copied exactly — the same nice 1/2/5 x 10^n step, the same
      outward snap of the extent, the same mapping back — but the bin space
      is `log10(v)` rather than `ln(v)`. Rows at or below zero are dropped,
      as Mosaic drops them, by a predicate that also guards the bin scheme's
      own extent query so a dropped row cannot set the low edge either.

      `symlog` is NOT rebased: it takes d3's own transform, natural logarithm
      included, because the renderer's symlog arm uses exactly that and the
      two have to agree for a bar to stand on its edge.
    rationale: |
      The log scale normalises by its own domain span, so `ln` and `log10`
      place identically.

      What the base moves is where the nice step LANDS. In log10 space a
      step of 1 is exactly one decade, so the bin edges fall on 1, 10 and
      100 — the same values the axis labels, because a log axis is ticked in
      decades.
      In `ln` space they would fall on e and e squared, and the picture would
      carry two grids that never meet: bars standing on one set of edges and
      labels naming another.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0007
    surface: "stacking — per-stack share on a binned rect (`stackOffset: normalize`)"
    mosaic_behaviour: |
      Mosaic has no per-stack-share option for a binned, stacked rect. Its
      own `normalize` name is a `density`-mark option, dividing a kernel
      density estimate by its own sum or maximum so the curve integrates to
      one — a different feature that happens to share the word. Observable
      Plot, which Mosaic's stack transform is drawn from, offers the nearest
      native form of a per-stack share: `offset: "normalize"` on the stack
      transform itself, sitting beside the mark's channels rather than on
      the plot.
    brightfield_behaviour: |
      brightfield takes Plot's word and Plot's spelling, and moves it: a
      column-valued `fill` on a binned rect is carried (lifted) into the
      GROUP BY over the two bin edges and the category, then stacked by a
      window over the aggregation — `SUM(COUNT(*)) OVER (PARTITION BY <bin
      low edge> ORDER BY <category>)` for a slab's top, the same running
      total minus the row's own count for its bottom. `stackOffset:
      normalize` is a plot-level key, not a mark-level transform argument,
      because the control that throws it is a plot's control — one switch
      per plot, beside the plot's own scale switch, offered wherever a stack
      was drawn and nowhere else. When set, both slab edges divide by a
      second window over the same partition with no `ORDER BY` — the bin's
      own total rather than the running part of it.
    rationale: |
      The two `normalize`s share a name and nothing else: one rescales a
      curve, the other rescales a stack. A per-stack share is the feature a
      reader reaches for that word to mean, and Plot's own spelling is the
      nearest existing precedent to borrow rather than inventing a third
      word for the same idea.

      Where the key lives follows from what throws it. The control is a
      single switch per plot, not a per-mark transform argument, so the AST
      carries it on the plot node it is drawn from rather than nested under
      the mark that happens to be stacked.
    affected_specs: []
    conformance_layers_suppressed: [2, 3]
  - id: DEV-0008
    surface: "colour — a diverging scale's pivot (`colorScale: diverging`, `colorPivot`)"
    mosaic_behaviour: |
      Mosaic's diverging colour scale takes its pivot from `colorPivot` and,
      with none written, uses 0, whatever the data holds.
    brightfield_behaviour: |
      With no `colorPivot` the pivot is 0 when the rows drawn hold a negative
      value and a positive value, and the median of those rows otherwise. A
      `colorPivot` that is written is used as it is. The domain is drawn even
      about the pivot, the two ends the same distance from it, the greater of
      the two distances the rows reach.
    rationale: |
      A change, or a distance from a norm, is read as above or below a value.
      Where a column crosses zero, zero is that value; where it does not, a
      pivot of 0 puts every point on one arm and the scale reads as a
      sequential ramp with a midpoint nobody can see, so the column's median is
      the value that splits what is drawn. A spec that writes `colorPivot`
      draws as Mosaic would, and only the default differs.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0009
    surface: "colour — a diverging scale's default arms (`colorScale: diverging`, no `colorScheme`)"
    mosaic_behaviour: |
      Mosaic's diverging colour scale defaults its scheme to `rdbu`:
      ColorBrewer's red at the low end and blue at the high end.
    brightfield_behaviour: |
      With no `colorScheme` the arms are the Meridian design system's blue arm
      at the low end and its brick-red arm at the high end, about the
      design system's midpoint for the theme drawn (warm gray step 2 in light,
      step 4 in dark). `colorScheme: rdbu` draws ColorBrewer's, red at the low
      end and blue at the high end, as Mosaic does. A scheme that is named,
      `viridis` or `blues` say, is drawn about the pivot with its middle colour
      at the pivot.
    rationale: |
      The design system's pair has a neutral midpoint so that "nothing" reads
      as nothing, and its arms are tuned to the chart surface in both themes.
      Blue sits at the low end, where rdbu puts red, so a spec that wants
      Mosaic's colours writes `colorScheme: rdbu`, and only the default
      differs.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0010
    surface: "colour — a fixed domain on a diverging scale (`colorScale: diverging`, `colorDomain` as two numbers)"
    mosaic_behaviour: |
      Mosaic's renderer keeps a diverging scale symmetric about its pivot, and
      does so for a domain the file wrote as well as one inferred from the rows:
      a `colorDomain` that is uneven about the pivot is widened on its short
      side until both ends are the same distance from the pivot, so the ends
      its legend reads are not the ends the file wrote.
    brightfield_behaviour: |
      A `colorDomain` of two numbers is drawn as written. With `colorPivot: 2`
      and `colorDomain: [0, 10]` the legend's ends read 0 and 10, a point at 0
      wears the low pole and a point at 10 the high pole, and each arm of the
      ramp runs over its own span: from 0 to 2 below the pivot and from 2 to 10
      above it. A diverging scale with no `colorDomain` is drawn even about the
      pivot as before (DEV-0008), and so is one whose `colorDomain` is no pair of
      numbers, `Fixed` among them.
    rationale: |
      A domain is fixed in a file so that a colour means the same value in two
      charts, and a renderer that widens it moves the colour of every value on
      one side of the pivot by an amount nobody wrote. Drawing the ends as
      written keeps the legend true to the file, and the arms' unequal rates are
      the cost of an uneven domain that the author chose. A spec that wants
      Mosaic's picture writes a domain even about its pivot, and only the uneven
      one differs.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0011
    surface: "colour — the count of steps of a stepped scale (`colorScale: quantize`, `colorN`)"
    mosaic_behaviour: |
      Mosaic's renderer takes the thresholds of a `quantize` scale from tidy ticks
      of the domain, so `colorN` is a target for the count and not the count: a
      plot with `colorN: 5` over a column running 0 to 500001 comes out as six
      steps there, their edges at round values. With no `colorN` it draws five
      steps, and with a `colorRange` it draws as many steps as the range has
      colours.
    brightfield_behaviour: |
      The count asked for is the count drawn. `colorN: 5` over a column running 0
      to 500001 is five steps of equal width, each a fifth of the domain, the
      domain being the `colorDomain` when the file writes one and the rows' own
      otherwise (so `colorDomain: [0, 50]` gives five steps each 10 wide). A
      point at an edge is in the step above it, and a point past either end is in
      the end step. With no `colorN` it draws five steps, and a `colorRange` of
      two or more colours gives the steps their colours and their count, whatever
      `colorN` says. A `colorN` that is not a whole number from one to 256 draws
      five steps, and the page's warning names the key and the value.
    rationale: |
      The scale row of the settings list reads *steps · 5*, written as `colorN`,
      and a count the analyst types is a count they expect to see: five colours
      they can tell apart and name the band of, with a legend of five blocks.
      Rounding the edges to tidy values gives a different count from the one in
      the file and edges that are not the equal fifths the legend's labels say.
      A spec that wants Mosaic's tidy edges writes a `colorDomain` with round
      ends, and only a domain that does not divide into round steps differs.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0012
    surface: "axes — the x and y axis keys on a plot with a map projection (`xTicks`, `xTickFormat`, `xGrid`, `grid`, `xZero`, `xNice`, `xReverse` and the `y` of each)"
    mosaic_behaviour: |
      Mosaic hands a plot's axis attributes to Observable Plot, which has no x or
      y scale on a plot with a projection: the projection takes their place, so
      the planar units a projected point lands on are no axis, and none of these
      keys sets a scale option. Mosaic web draws the map and does not report a
      key it had no use for.
    brightfield_behaviour: |
      The map is drawn as the same file draws it without the key, and the
      warning banner names each key as changing nothing on a plot with a map
      projection, with the key first and then the plot. A tick count, a number
      or date tick format and a gridline switch that asks for gridlines have no
      frame to act on, because a plot with a projection draws a graticule where
      the frame would be. `xZero` and `xNice`, and `yZero` and `yNice`, leave the
      map's extent where it is, as `xReverse` and `yReverse` leave its
      direction. A key that asks for nothing (a switch set to `false`) is not
      named. A plot with no projection reads each of these keys as it did.
    rationale: |
      An analyst who opens a Mosaic map that sets one of these keys is looking at
      a map that differs from what they wrote only if brightfield acted on the
      key, and is owed a line saying the key was not used if it did not. Reading
      the key on a projected plot would move the map's extent for a request
      Observable Plot has no scale to receive, and say nothing; leaving it
      unread and unnamed would be the silence the axis vocabulary exists to
      end. The picture is the one Mosaic draws, and the banner is what differs.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0013
    surface: "axes — a tick format (`xTickFormat`, `yTickFormat`) of either kind on an axis of names"
    mosaic_behaviour: |
      Mosaic's schema describes a tick format as a d3-format string for a
      numeric scale and a d3-time-format string for a temporal one. An axis of
      names is neither: Mosaic's band axis prints the names, so a format set on
      one has nothing to format.
    brightfield_behaviour: |
      A band axis of names prints its names as they are, and the warning banner
      names `xTickFormat` or `yTickFormat` as changing nothing on a category
      axis, with the key first and then the plot. A number format and a date
      format are named alike, and whether or not the names read as numbers: an
      axis is an axis of names when its column is text that is not a calendar
      day, whatever the text spells. A band of calendar days is a date axis and
      takes a date format; a number format on it is named as the other kind of
      format, as it was. A format that is no format at all is named once, as
      such. A plot with no format on an axis of names says nothing.
    rationale: |
      An analyst who opens a Mosaic chart that sets a format on an axis of names
      sees the names and was told nothing, so a format that looked like it
      should change the labels reads as a fault in brightfield. The picture is
      the one Mosaic draws, because formatting names as numbers or dates would
      draw text Mosaic does not; the banner is what differs, and says the key
      had nothing to act on.
    affected_specs: []
    conformance_layers_suppressed: [3]
  - id: DEV-0014
    surface: "plot attributes — `axis`, `facetGrid`, `facetLabel`, `padding`, `align` and `xyDomain` set to `Fixed`, named rather than read"
    mosaic_behaviour: |
      Mosaic hands these plot attributes to Observable Plot. `axis` places the
      implicit axis on a side of the frame or on both sides, and `null`
      suppresses it. `padding` and `align` space the bands of an ordinal axis.
      `xyDomain` sets the x and y scale domains, and `Fixed` there fixes both
      after the first render. `facetGrid` and `facetLabel` set the default
      gridlines and label of the facet axes.
    brightfield_behaviour: |
      The plot is drawn as the same file draws it without the key, and the
      warning banner names the key as one this build does not read, with the
      key first and then the plot, whatever it is set to, except `xyDomain`
      set to two numbers, which is read (DEV-0005): of the three values
      `xyDomain` takes it is `Fixed` that is named. A key set under
      `plotDefaults` is named once, there, and not at each plot that inherits
      it. `xDomain: Fixed` and `yDomain: Fixed` are read (DEV-0005), and
      `xyDomain: Fixed` is not.
    rationale: |
      The schema rule that decides which plot attributes are axis attributes
      counted a name by an `x` or `y` before a capital letter, so these six were
      neither read nor named: a chart that set one differed from its file and
      the analyst was told nothing. They are named until a chart needs one
      read, which is a change of its own.
    affected_specs: []
    conformance_layers_suppressed: [3]
