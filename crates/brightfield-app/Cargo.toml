[package]
name = "brightfield-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Brightfield application: spec-driven chart visualisation in a GPUI window"

[[bin]]
name = "brightfield"
path = "src/main.rs"

[dependencies]
brightfield-spec = { path = "../brightfield-spec" }
brightfield-sql = { path = "../brightfield-sql" }
brightfield-engine = { path = "../brightfield-engine" }
brightfield-render = { path = "../brightfield-render" }
brightfield-ui = { path = "../brightfield-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "14f0a254", package = "gpui" }
arrow = { version = "58", default-features = false }
vello = "0.4"
tracing = "0.1"
image = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "14f0a254", package = "gpui_macos", features = ["runtime_shaders"] }

[lints]
workspace = true
