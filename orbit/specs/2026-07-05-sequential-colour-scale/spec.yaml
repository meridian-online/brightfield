goal: >
  Add a sequential (continuous) colour scale so numeric magnitude maps to an
  interpolated colour ramp, and switch the raster mark from alpha-on-steelblue to a
  true count→ramp heatmap. Introduces Scale::Sequential { domain_min, domain_max,
  stops } with map_continuous interpolation and a small built-in scheme set
  (viridis/blues/turbo, Mosaic-aligned names, viridis default); the raster's
  augment_scales builds the scale under Channel::Fill from the count domain so the
  existing legend plumbing picks it up; a gradient-bar legend variant renders it
  inline and in the standalone legend: node path; and the plot-level colorScheme
  attribute is consumed on the headless authoring path. Everything is headlessly
  verifiable — ramp math + scheme + inference + legend geometry are unit/integration
  tests, appearance is BRIGHTFIELD_DUMP_PNG dumps eyeballed once. This unblocks true
  heatmaps, continuous legends, and the future heatmap/cell marks.

constraints:
  - "New Scale::Sequential variant (Decision 1). Adding it MUST leave every exhaustive `match Scale` compiling by decision, not by a catch-all: union_scales (scale.rs:455), compute_ticks (axis.rs:39), range_start/range_end (scale.rs:191/:201), domain_min/max (scale.rs:173/:183) each get a Sequential arm."
  - "Scale lives under Channel::Fill, produced by RasterRenderer::augment_scales from the __bf_count domain — NOT by generic infer_column_scale (Decision 4). The inline legend (scene.rs:187/:303), colour_scale_of (main.rs:106) and resolve_legends key off Fill and must not need a parallel channel."
  - "Zero-anchored domain [0, max_count] + a RASTER_MIN_T ramp-position floor replacing RASTER_MIN_ALPHA (Decision 5). The max_count<=0 empty-grid early return (mark.rs:1417) is unchanged."
  - "Scheme names are lowercase and Mosaic-portable: viridis/blues/turbo (Decision 2). Default is viridis (Decision 3). Unknown colorScheme → warn + default, never error."
  - "colorScheme is consumed on the headless assembly path via RasterRenderer { scheme } built per-mark (Decision 6). colorScale/colorDomain/colorRange/colorReverse remain deferred and parse harmlessly (open attribute bag) — no parser change to defer them."
  - "Rally seam — untouched or read-only: the categorical Colour scale + map_colour + CATEGORICAL_PALETTE; render_colour_legend_at swatch path (stays behaviour-compatible for Colour scales); infer_scales/infer_scales_multi/infer_column_scale signatures; the density/2D-binning SQL (no new SQL, no new channel); brightfield-render stays gpui-free."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "Scale::Sequential { domain_min, domain_max, stops: Vec<[f32;4]> } exists; map_continuous(value) clamps+normalises to t in [0,1] and piecewise-lerps between adjacent stops. Endpoints return the first/last stop exactly; the midpoint of a 2-stop ramp is the channel-wise average; a degenerate (min==max) domain returns the top stop; out-of-domain values clamp."
    verification: "scs_ac01 in brightfield-render/src/scale.rs: build a Sequential with stops [black,white], assert map_continuous(min)==black, (max)==white, (mid)==~[0.5;3]; below-min clamps to black, above-max to white; a min==max domain returns the top stop."
  - id: ac-02
    ac_type: code
    description: "SequentialScheme::{Viridis, Blues, Turbo} with lowercase wire_name/from_wire (Mosaic-aligned) and stops() returning >= 5 RGBA control points each; from_wire is case-exact and round-trips; an unknown name yields None (caller warns + defaults to Viridis)."
    verification: "scs_ac02 in brightfield-render/src/scale.rs: for each scheme stops().len() >= 5 and all components in [0,1]; from_wire(wire_name())==Some(scheme); from_wire(\"magma\")/from_wire(\"Viridis\")==None; default scheme is Viridis."
  - id: ac-03
    ac_type: code
    description: "Adding Scale::Sequential leaves the crate compiling with a decided arm at each exhaustive match: union_scales unions two Sequentials by min-of-mins/max-of-maxes (same stops); compute_ticks returns no ticks; range_start/range_end return 0.0; domain_min/domain_max return Some(the ramp extent)."
    verification: "scs_ac03 in brightfield-render: union_scales over two Sequentials with domains [0,10] and [0,25] yields [0,25]; compute_ticks(&sequential,5) is empty; sequential.domain_max()==Some(max). (The build itself failing to compile is the primary guard — no catch-all arm hides a missed site.)"
  - id: ac-04
    ac_type: code
    description: "RasterRenderer becomes RasterRenderer { scheme }; its augment_scales inserts Scale::Sequential under Channel::Fill with domain [0, max_count] (zero-anchored) and stops = scheme.stops(), in addition to the existing half-bin x/y widening."
    verification: "scs_ac04 in brightfield-render/src/mark.rs (extend the raster augment_scales test near mark.rs:2575): after augment_scales, scales.get(Channel::Fill) is Some(Sequential) with domain_min==0.0 and domain_max==the batch's max __bf_count; the x/y half-bin widening still holds."
  - id: ac-05
    ac_type: code
    description: "RasterRenderer::render maps each occupied cell's count through the Fill Sequential scale (count → map_continuous at t.max(RASTER_MIN_T)) at full alpha; two cells with different counts get different fills; RASTER_MIN_ALPHA is gone. With no Fill scale it falls back to the legacy steelblue-alpha path without panicking."
    verification: "scs_ac05 in brightfield-render/src/mark.rs (extend the render test near mark.rs:2544): render into a scene produces cell fills; a probe of a high-count vs low-count cell colour differs (ramp, not constant hue); rendering with the Fill scale removed still produces cells (fallback)."
  - id: ac-06
    ac_type: code
    description: "sequential_legend_size(&Scale)->Option<(w,h)> returns Some for Sequential / None otherwise; render_sequential_legend_at draws a vertical gradient bar (sampled quads) plus min/mid/max numeric tick labels; colour_legend_size and the inline/standalone render dispatch on the variant (Colour→swatches unchanged, Sequential→bar)."
    verification: "scs_ac06 in brightfield-render/src/legend.rs: render_sequential_legend_at into a scene yields path_tags > 0 (bar + labels); it is a no-op for a Linear scale; sequential_legend_size(&sequential) is Some and None for a Band scale; colour_legend_size dispatches Sequential to the bar size; the existing categorical swatch tests still pass."
  - id: ac-07
    ac_type: code
    description: "colour_scale_of accepts Sequential (is_colour extended), so a raster plot's Fill Sequential scale resolves for a standalone legend; resolve_legends returns a placement whose scale is the Sequential and whose size is the gradient-bar size."
    verification: "scs_ac07 in brightfield-app: build the ScaleSet for a raster plot, assert colour_scale_of returns the Sequential; resolve_legends on a spec with a `legend: color for: <raster>` yields one LegendPlacement carrying the Sequential scale, sized via sequential_legend_size."
  - id: ac-08
    ac_type: code
    description: "colorScheme is consumed on the headless path: the app assembly builds RasterRenderer { scheme } per-mark from mark.attributes.get(\"colorScheme\") (default viridis); a raster plot declaring colorScheme: blues produces a Fill Sequential whose stops are the blues ramp; an unknown scheme warns and falls back to viridis."
    verification: "scs_ac08 in brightfield-app: assemble the renderer for a raster mark with attributes {colorScheme: blues} and assert the resulting Fill Sequential stops == SequentialScheme::Blues.stops(); a mark with colorScheme: notascheme falls back to Viridis (and the warning path is exercised)."
  - id: ac-09
    ac_type: code
    description: "A raster spec declaring colorScheme parses cleanly (no ParseError/ParseWarning::Unimplemented) and preflights as Implemented; a conformance/preflight fixture pins this. LegendChannel::Color stays Implemented and now covers continuous."
    verification: "scs_ac09: a corpus fixture (brightfield-conformance) — a raster + colorScheme: viridis spec — parses with no unimplemented warnings and its SupportReport marks the raster Implemented; the vocab guard test (vocab.rs) still asserts LegendChannel::Color is Implemented."
  - id: ac-10
    ac_type: manual
    description: "Raster PNG: examples/raster.yaml (or a new raster-heatmap.yaml) rendered headlessly shows a true colour ramp — dense bins read as the ramp's high end, sparse bins as its low end — instead of alpha-on-steelblue; a colorScheme: blues variant reads as a blue ramp."
    verification: "BRIGHTFIELD_DUMP_PNG=raster.png cargo run -p brightfield-app -- examples/raster.yaml; visually confirm the two blobs render as a viridis (default) ramp and the blues variant as a blue ramp. Eyeballed."
  - id: ac-11
    ac_type: manual
    description: "Legend PNG: a raster dashboard with a standalone `legend: color` renders a vertical gradient bar with min/mid/max tick labels at the legend's layout rect, matching the raster's ramp; the inline (top-right) legend on a bare raster plot renders the same gradient bar rather than swatches."
    verification: "BRIGHTFIELD_DUMP_PNG on examples/legend-standalone.yaml adapted to a raster plot (or the raster example's inline legend): the gradient bar + tick labels are visible and colour-match the cells. Eyeballed."

gate:
  id: ac-12
  description: >
    cargo test --workspace green (no regressions in the render scale/legend/mark
    suites, the app resolve_legends/colour_scale_of tests, or the conformance
    corpus); the categorical Colour scale + swatch legend stay behaviour-compatible
    (existing gpu_ac07*/standalone_legend* tests unchanged); no new SQL and no new
    positional channel; brightfield-render gains no gpui dependency; infer_scales/
    infer_scales_multi/infer_column_scale signatures unchanged.

deferred:
  - "Diverging schemes (RdBu/BrBG/…) — need a two-sided domain + midpoint."
  - "colorScale transforms: log / sqrt / symlog / pow (v1 is linear only)."
  - "Custom colorDomain / colorRange / colorReverse from the spec."
  - "Per-mark colorScheme on the live cross-filter path (headless honours it; live inherits the viridis default — needs a scheme field on MarkInput)."
  - "Full-resolution (256-entry) scheme LUTs — v1 interpolates 7–9 control points."
  - "heatmap / cell categorical-grid marks (they consume this scale later)."
  - "Generic numeric-Fill → Sequential inference in infer_column_scale (v1 builds the scale only via the raster's augment_scales)."

ambiguity_score: 0.2
ambiguity_notes: >
  Low–moderate. The recon fixed the scale shape (mirror Colour, add
  map_continuous), the channel (Fill, produced by augment_scales), the legend
  (gradient-bar variant dispatched by kind), and the visibility floor (RASTER_MIN_T
  replaces RASTER_MIN_ALPHA). Two genuine calls need Hugh's ratification, both
  flagged in decisions.md: (1) default scheme — viridis (recommended: perceptual,
  colourblind-safe) vs turbo (Mosaic's literal default); turbo is available by name
  either way, so only the unspecified default differs. (2) colorScheme override
  scope in v1 — consume it on the headless authoring path only (recommended) and
  defer the live cross-filter path, or thread MarkInput in the same PR. Residual
  implementation detail (decide during ac-08): whether the app assembly owns
  per-mark renderer boxes or overrides only the raster registry entry to carry the
  scheme.
