[package]
name = "brightfield-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process DuckDB execution engine for Mosaic spec pipelines"

[dependencies]
brightfield-spec = { path = "../brightfield-spec" }
brightfield-sql = { path = "../brightfield-sql" }
# `parquet` links DuckDB's Parquet reader into the binary. Without it
# `read_parquet` is an extension DuckDB autoinstalls on first use — downloaded
# from extensions.duckdb.org into ~/.duckdb — so a local Parquet opened on a
# machine with no network and a cold extension cache does not open at all, and
# on a machine with a network its first open reaches it. The front door ships
# a bundled Parquet whose whole promise is that it needs neither.
# `the_local_starts_open_with_the_network_denied_and_a_cold_extension_cache` in
# the shell's `tests/front_door.rs` reddens when this feature is off.
duckdb = { version = "1", features = ["bundled", "parquet"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
