[workspace]
members = ["crates/brightfield-workbench", "crates/brightfield-spec", "crates/brightfield-keys", "crates/brightfield-conformance", "crates/brightfield-sql", "crates/brightfield-protocol", "crates/brightfield-engine", "crates/brightfield-render", "crates/brightfield-ui", "crates/brightfield-model", "crates/brightfield-shell", "crates/brightfield-bench", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
# Historical floor: set by the retired gpui shell's zed pin (std::hint::cold_path,
# stable since 1.95); kept because CI and the local loop pin 1.95.0 exactly and
# nothing needs newer. vello 0.9 itself needs only 1.88 — lower this floor
# deliberately (with a CI re-pin), not incidentally.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/meridian-online/brightfield"

# The Meridian design system (the token crate + its egui emitter) is consumed as
# a pinned git dependency of https://github.com/meridian-online/design — bump the
# `rev` on `meridian-design` and `meridian-egui` in `[workspace.dependencies]` to
# adopt a design change. For live side-by-side
# development, add a LOCAL, UNCOMMITTED `[patch."https://github.com/meridian-online/design"]`
# redirecting the two crates to a design checkout beside this one; the committed
# form stays on the git pin so CI (which has no sibling checkout) resolves.

# The arcform spec library (`arc`) is consumed the same way: a rev-pinned git
# dependency in `[workspace.dependencies]`, used by `brightfield-protocol` and
# `brightfield-shell` (README §"The arcform dependency" has the bump procedure).
# arc parses SQL
# with a vendored fork of sqlparser 0.55 (statement-form PIVOT/UNPIVOT +
# multi-option COPY), wired inside arc's own workspace via `[patch.crates-io]` —
# and Cargo patch tables do NOT propagate through dependencies, so this
# workspace must carry the same patch itself or arc fails to compile (missing
# `SetExpr::Pivot`/`Unpivot` variants). The GIT form below points at the same
# repo+rev as the arc pin: Cargo scans that repository's packages and finds
# `vendor/sqlparser-0.55.0`, so a bare CI checkout resolves with no sibling
# ../arcform on disk. (A path-form patch into a sibling checkout works locally
# and breaks CI — same lesson as the design-repo pin above.) The patch carries
# version 0.55.0, so it applies only to arc's `sqlparser = "0.55"` requirement;
# the workspace's own sqlparser 0.61 keeps resolving from crates.io untouched.
# BUMPING: move this rev and the `arc` rev in `[workspace.dependencies]` IN LOCKSTEP,
# then refresh Cargo.lock (and re-pin tree-sitter-iter if the resolver drifts
# above the toolchain — see the lock).
[patch.crates-io]
sqlparser = { git = "https://github.com/meridian-online/arcform", rev = "f0561cd255e010e12a6ae82edc0b70785c3d19fc" }

# Every dependency two or more members share is declared here once; a member names
# it with `workspace = true` and adds only the features that member alone needs.
# `default-features = false` on an entry binds every member: a member cannot switch
# defaults back on.
[workspace.dependencies]
# Members that more than one member depends on.
brightfield-engine = { path = "crates/brightfield-engine" }
brightfield-keys = { path = "crates/brightfield-keys", version = "0.1.0" }
brightfield-protocol = { path = "crates/brightfield-protocol", version = "0.1.0" }
brightfield-render = { path = "crates/brightfield-render" }
brightfield-spec = { path = "crates/brightfield-spec" }
brightfield-sql = { path = "crates/brightfield-sql" }

# The arcform spec library: the real `arcform.yaml` loader, validators and
# format-preserving write path. Rev-pinned (arc is pre-1.0: every bump is
# potentially breaking; move deliberately). `default-features = false` drops arc's
# CLI — `cli_main` parses the *caller's* argv and can exit the process, so it has no
# business being linkable from `brightfield-protocol`; `brightfield-shell` turns it
# back on, as a feature, for the one child process that runs a Protocol. BUMPING is
# three moves in lockstep: this `rev`, the `[patch.crates-io]` sqlparser rev above
# (arc's vendored sqlparser fork — patch tables do not propagate through
# dependencies), and Cargo.lock. See README §"The arcform dependency".
arc = { git = "https://github.com/meridian-online/arcform", rev = "f0561cd255e010e12a6ae82edc0b70785c3d19fc", default-features = false, features = ["http-fetch"] }
arrow = { version = "58", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `bundled` builds DuckDB from source, so no member needs a system libduckdb. One
# spec here is one `duckdb` build in the graph.
duckdb = { version = "1.2", features = ["bundled"] }
# VERSION LOCK — egui 0.35 rides wgpu 29, the same wgpu major Vello 0.9 uses, so
# `egui_wgpu`'s wgpu and `vello::wgpu` resolve to ONE crate instance and therefore
# one `wgpu::Device`. That is what lets a Vello scene rasterise onto a texture egui
# samples directly, with no second device and no CPU readback. Two wgpu majors in
# the graph would make the device types incompatible and force the readback back.
# Bump egui and vello TOGETHER, and only to versions that still share a wgpu major.
# `eframe` and `egui-wgpu` ride the same line in `brightfield-shell`.
egui = "0.35"
egui_tiles = "0.16"
indexmap = "2"
kurbo = "0.13"
meridian-design = { git = "https://github.com/meridian-online/design", rev = "194322fe70b84e336d9910f78a7afa409d073e82" }
meridian-egui = { git = "https://github.com/meridian-online/design", rev = "194322fe70b84e336d9910f78a7afa409d073e82" }
peniko = "0.6"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlparser = { version = "0.61", features = ["visitor"] }
thiserror = "2"
vello = "0.9"

[workspace.lints.rust]
unused_must_use = "warn"
missing_docs = "allow"
# No crate writes `unsafe` except `brightfield-engine`, which restates the workspace's
# lints with `deny` in this one place and allows the one function that calls DuckDB's
# C API. `forbid` cannot be relaxed by an `#[allow]`, so a crate that inherits this
# table cannot opt out of it either.
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }

# Measured, not assumed — the before/after pair and the machine conditions each
# number was taken under are in the commit that added this block.
#
# `debug = "line-tables-only"` keeps file and line for panics and backtraces and
# drops the variable and type debug info a debugger would use. It is the whole of
# this block's effect: it moves the rustc flag from `-C debuginfo=2`, and both the
# time and the disk saving come from it.
#
# `split-debuginfo = "unpacked"` WAS HERE AND WAS REMOVED, because it is the
# platform default on macOS and setting it changes the rustc command line by zero
# bytes. Verified with `cargo build -v` on a workspace crate with no `[profile.dev]`
# block, no `.cargo/config.toml` and no `CARGO_PROFILE_*` in the environment: cargo
# already emits `-C split-debuginfo=unpacked`. `find target/debug -maxdepth 1 -name
# '*.dSYM'` returns 0 in the untuned arm as well as the tuned one — there was never
# a `.dSYM` bundle here to eliminate. Recorded rather than deleted silently, because
# this card asks that a lever which does not pay be written down as one.
[profile.dev]
debug = "line-tables-only"
