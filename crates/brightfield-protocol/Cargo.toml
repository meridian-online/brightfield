[package]
name = "brightfield-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol+Run contract -> typed asset graph -> deterministic layout (framework-free, vello-free)"

[dependencies]
# The arcform spec library: the real `arcform.yaml` loader, validators and
# format-preserving write path. The pin, the features and BUMPING are on `arc`
# in the workspace root's `[workspace.dependencies]`; see README §"The arcform
# dependency".
arc = { workspace = true }
# NOT used by this crate directly. arc's private engine links DuckDB even in
# its library shape, and libduckdb-sys defaults to linking a SYSTEM libduckdb
# (DUCKDB_LIB_DIR) that neither CI runner nor a fresh clone has. This entry
# exists solely to switch libduckdb-sys to its `bundled` build via feature
# unification, so the workspace builds hermetically everywhere. Drop it if arc
# ever stops linking DuckDB into the library target.
duckdb = { workspace = true }
# The Meridian design tokens. Dependency-free by its own contract (ADR 0003) and
# framework-neutral — plain floats — so it costs this crate none of its
# no-UI-framework, no-vello property. It is here for one reason: the layout's
# three spacing constants ARE design-system spacing, and two of the three had
# drifted off the ladder while they were bare floats in `layout.rs`.
meridian-design = { workspace = true }
brightfield-sql = { workspace = true }
# The chart parser and its edit reducer, for `chart_text`: a chart edit is
# written into a chart file's text through arc's splice, and the parser is what
# finds the plot the edit names and checks the text it gives back.
brightfield-spec = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
# The emitted Protocol+Run JSON contract + live `.jsonl` stream (the default input).
serde_json = { workspace = true }
# The workspace sqlparser version (brightfield-sql's) — the tokenizer drives
# the statement splitter; the visitor feature drives per-statement asset
# extraction.
sqlparser = { workspace = true }

[lints]
workspace = true
