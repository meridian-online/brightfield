name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A push to a PR branch supersedes the run already in flight for that ref.
# Worth having here specifically: every run is a cold-ish `macos-15` build of a
# large graph (wgpu/vello/egui/duckdb) behind a long `timeout-minutes` ceiling,
# so stacked pushes otherwise burn expensive minutes on results nobody will read.
#
# A push to `main` supersedes nothing. A merge used to cancel the `main` run
# still in flight for the merge before it, which ended that run with no verdict
# on a commit that had already landed. The group is per commit on `main` for
# the same reason: one group shared by every `main` run lets a third merge
# replace a second run still queued behind the first, which is also a run with
# no verdict.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # ---------------------------------------------------------------------
    # One canonical runner, on purpose.
    #
    # macOS is brightfield's primary live-window target, and the only hosted
    # runner where the egui_kittest pixel tier has a real wgpu adapter to
    # render through — so running here means the *whole* suite runs,
    # snapshots included, with nothing quietly opted out.
    #
    # A Linux job is deliberately not added yet: the winit/wgpu window stack
    # there needs a system-dependency matrix (Vulkan, wayland/X11, xkbcommon,
    # fontconfig) nobody in this repo has validated, and standing one up just
    # to skip the visual gate would add build minutes without adding a gate.
    # There is no skip switch for the pixel tier to reach for either — see the
    # module comment in crates/brightfield-shell/tests/snapshot.rs for why, and
    # for the `#[ignore]` + explicit-opt-in shape if a GPU-less runner is added.
    #
    # If the pixel tier reddens on the hosted runner's paravirtualised GPU,
    # read the uploaded diff artifact and fix the baseline (regenerate from the
    # failing run's .new.png artifact) or add a documented per-OS threshold in
    # kittest.toml — do NOT blanket-loosen the floor to make it green.
    # ---------------------------------------------------------------------
    runs-on: macos-15
    # 1.25 times the slowest of the last ten `main` runs of this job that ran
    # to a verdict or to the ceiling, read from each run's job list on
    # 2026-10-05: the slowest, 60.4 minutes, is a run stopped at the previous
    # 60-minute ceiling, so its true length is longer and the margin is a floor.
    # This figure was derived before the GPU-sharing targets ran apart from
    # the rest (the two `cargo test` steps below); derive the next ceiling
    # from the job list of runs made under the split, not from this comment.
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      # The sibling data repo, for the ONE test target that reads it:
      # `crates/brightfield-protocol/tests/sibling_manifests.rs`, which loads
      # every `arcform.yaml` the pipeline ships through the `arc` rev this
      # workspace pins. That pin drifted three weeks behind the operator
      # catalog once already, and the only signal was a person opening a
      # Protocol in the shell and being told `unknown operator 'text_embed'`.
      #
      # This is a git checkout of a first-party PUBLIC repo, not a data fetch —
      # so it does not make this workflow network-dependent in the sense
      # `nightly-network.yml` argues against. It reads the same host the run is
      # already cloning itself from, with the default `GITHUB_TOKEN` (a public
      # repo needs no extra credential), and `persist-credentials: false`
      # because nothing here pushes.
      #
      # A red step below means either this PR moved the pin backwards or the
      # sibling repo moved ahead of it. Both are worth a person's attention and
      # both are fixed the same way — README §"The arcform dependency".
      - name: check out the sibling data repo's Protocols
        uses: actions/checkout@v4
        with:
          repository: meridian-online/open-analytics
          path: .sibling/open-analytics
          persist-credentials: false

      # An exact toolchain PIN — not an MSRV check. Cargo.toml's
      # `rust-version = "1.95"` is a *floor* (the oldest toolchain allowed to
      # compile the workspace); this line instead nails CI to the one patch
      # release the local loop uses (`cargo +1.95.0 ...`), so a CI failure is
      # reproducible on a dev machine. rust-toolchain.toml at the repo root
      # carries the same 1.95.0 for a bare `cargo` in a fresh checkout; this
      # step is the CI half and the two are meant to move together.
      #
      # The consequence, stated plainly: nothing here ever compiles on current
      # stable, so a regression introduced by a newer rustc goes unnoticed until
      # someone bumps this. Widening to a matrix (pin + stable) is the fix when
      # that matters; it is deliberately out of scope for this workflow.
      #
      # `1.95.0` is a real ref in dtolnay/rust-toolchain (a branch, alongside
      # `1.95`) — confirmed with `git ls-remote`, which is also the form that
      # action documents for exact versions.
      - uses: dtolnay/rust-toolchain@1.95.0

      # Caches ~/.cargo (registry + git checkouts, which matter here: the
      # design-system and arcform pins are git dependencies) plus ./target.
      - uses: Swatinem/rust-cache@v2

      # Frees disk on the macOS runner before ANY of this job's cargo builds,
      # not just the pin-staleness step below. It moved here, ahead of the
      # workspace suite, after a cold run of a lockfile-change PR was proven
      # green on the sibling-manifest step (see the comment on that step)
      # only for `cargo test --workspace` itself to go on and fail on a LATER
      # cold run — `ld: write() failed, errno=28` (ENOSPC) linking a
      # `brightfield-shell` test binary — because that run's own log showed
      # only a couple of gigabytes free right after the workspace suite
      # finished, before the sibling-manifest step's own duplicate compile
      # ever ran. A step that frees disk for the steps after it has to run
      # before the FIRST step that can fill the disk, not just before the
      # one this card was filed over. None of what it removes is needed to
      # build or test this workspace: no iOS/watchOS/tvOS or Android target
      # is ever built here, and the pin-staleness step's own error text names
      # the one Xcode (`Xcode_16.4.app`) this job actually invokes
      # `ar`/`ranlib` from, so every other pre-installed Xcode version is
      # dead weight on this runner. Each `rm -rf` is allowed to fail on its
      # own (`|| true`) rather than the whole step failing: a path this
      # runner image has already dropped or renamed should not turn a
      # disk-reclaim step into a red gate, it should just mean less was
      # freed, which the before/after `df -h` below still shows.
      - name: reclaim disk before this job's cargo builds
        shell: bash
        run: |
          set -u
          echo "--- disk before reclaiming:"
          df -h /

          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            [ "$app" = "/Applications/Xcode_16.4.app" ] && continue
            echo "removing $app ($(du -sh "$app" 2>/dev/null | cut -f1))"
            sudo rm -rf "$app" || true
          done

          for path in "$HOME/Library/Android" /Library/Developer/CoreSimulator/Profiles/Runtimes; do
            if [ -e "$path" ]; then
              echo "removing $path ($(du -sh "$path" 2>/dev/null | cut -f1))"
              sudo rm -rf "$path" || true
            else
              echo "$path not present on this runner image"
            fi
          done

          echo "--- disk after reclaiming:"
          df -h /

      # No `cargo fmt --check` / `cargo clippy -D warnings` step here, on
      # purpose: both now exist, in `lint.yml`. They are a separate workflow so
      # they report in minutes without queueing behind this suite, and so they
      # still report when this suite is red or cancelled.

      # THE ENGINE THE RUN TESTS DRIVE. `arc run` executes a Protocol's SQL
      # steps by spawning a DuckDB executable, and this runner has no duckdb on
      # its search path — the condition an app started from Finder is in, and
      # the one tests/run_control.rs failed under before this step existed
      # ("engine 'duckdb' not found on PATH or not executable"). The pinned CLI
      # a release stages is installed under RUNNER_TEMP by the script that pins
      # it (the zip's sha256 checked before unpacking, the executable's after)
      # and named to the job in ARC_DUCKDB_BIN. NOT on PATH: the runs reach it
      # through the variable arc reads, as a packaged app's runs reach the copy
      # staged beside it, so nothing here can pass on a search-path lookup.
      - name: install the pinned DuckDB CLI the run tests hand to arc
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          engine=$(scripts/fetch-duckdb-cli.sh "$host" "${RUNNER_TEMP}/duckdb-cli")
          "$engine" --version
          echo "ARC_DUCKDB_BIN=${engine}" >> "$GITHUB_ENV"

      # THE WORKSPACE SUITE, IN TWO STEPS: the targets that share the GPU run
      # alone on one thread, and every other target runs under cargo's default
      # threads (one per core). The whole workspace used to run on one thread
      # because a few targets need it, which made every target that needs no
      # device wait in line behind them.
      #
      # WHY ONE THREAD, TWO KINDS. The shell's pixel and snapshot targets
      # render through a wgpu device, and under cargo's default threads their
      # tests contend for it: at brightfield 17ea980 on 2026-10-07,
      # `dashboard_baseline` failed 7 of its 19 tests in one run and 9 in
      # another on an 8-core machine at default threads, and passed all 19 on
      # one. The first group below is every target whose process asked Metal
      # for a device, including through a child it spawns. That was measured,
      # not read off the source: each test executable was run with a dyld
      # interposer on `MTLCreateSystemDefaultDevice` and `MTLCopyAllDevices`
      # that logs the call, and a target is listed when its log was non-empty.
      # The second group opens no device and still needs one thread:
      # `grid_spot` failed
      # `no_chrome_ink_is_drawn_inside_the_heros_data_area` in each of the
      # five runs made at more than one thread (8 threads three times, 3
      # twice), with the status band reading "spec changed on disk" where it
      # expects "240 of 240 rows", and passed all 10 tests on one thread.
      #
      # THE LIST IS THESE COMMENT LINES. Both steps read every line below that
      # begins `serial-targets:` out of this file, so the names a reader sees
      # here are the names that run on one thread and the comment cannot
      # disagree with the step. A target on no list runs on default threads,
      # so a new target that opens a device belongs on the first group; the
      # sign it was left off is a test that fails at default threads and
      # passes when run alone. Each step refuses to run when the list is
      # empty, and the second refuses a name that is not exactly one cargo
      # test target.
      #
      # Every crate's `--lib` unit tests run in this step too, though only
      # brightfield-shell's opens a device. Cargo cannot select one crate's
      # library without `--exclude` or `-p`, and each of those rebuilt
      # dependencies the workspace build already holds (measured 2026-10-07:
      # `--exclude brightfield-shell --lib` rebuilt 23 units, `-p
      # brightfield-model --lib` 81). That rebuild is the one the pin-staleness
      # step's comment below describes, and this runner has no disk to spare
      # for a second copy.
      #
      # First group, the targets that open a device:
      # serial-targets: automatic_sample banded_bar_ink bar_orientation
      # serial-targets: binned_histogram close_question_baseline colour_literals
      # serial-targets: committed_selection_ink dark_mark_ink dashboard_baseline
      # serial-targets: data_grid decimal_column editor_snapshot frame_ink front_door
      # serial-targets: gallery_gate ghosted_histogram grouped_histogram
      # serial-targets: grouped_histogram_shares keyed_canvas legend_baseline
      # serial-targets: legend_below_baseline legend_short_chart log_binned_histogram
      # serial-targets: navigation_extent outline_list pane_reflow
      # serial-targets: part_of_whole_histogram point_map_baseline
      # serial-targets: protocol_degrade_channel protocol_frame_crop
      # serial-targets: ranked_category_bars sampled_export scatter_kind scripted_open
      # serial-targets: shelf_band shelf_band_window shelf_edit shelf_fallback
      # serial-targets: snapshot sorted_bar_ink surfaces versions_panel
      # serial-targets: versions_step_back workflow_graph_baseline
      # Second group, the target that opens none and needs one thread anyway:
      # serial-targets: grid_spot
      #
      # `--locked` because Cargo.lock is tracked: without it CI would happily
      # re-resolve around the committed lock and go green on a dependency graph
      # nobody reviewed, and lockfile drift would never be caught. With it, a
      # stale lock is a hard error here.
      - name: cargo test, the GPU-bound targets on one thread
        shell: bash
        run: |
          set -eu
          serial=$(sed -n 's/^ *# serial-targets: *//p' .github/workflows/test.yml | tr -s '[:space:]' ' ')
          if [ -z "$serial" ]; then
            echo "::error title=no serial targets::no line of .github/workflows/test.yml begins 'serial-targets:'. The GPU-bound targets are listed in those lines; without them this step would run no one-thread target and the next step would run every target in parallel."
            exit 1
          fi
          read -r -a names <<<"$serial"
          args=()
          for t in "${names[@]}"; do
            args+=(--test "$t")
          done
          cargo test --locked --workspace --lib "${args[@]}" -- --test-threads=1

      # Every other target, on cargo's default threads. It is not gated on the
      # step above passing, so a red there still reports these too; a
      # cancelled run stops both. The targets are the whole workspace's test
      # targets minus the serial list above, read from `cargo metadata`, so a
      # new target runs here until someone lists it. `--workspace` on every
      # command, never `--exclude` or `-p`, so each reuses the build above.
      - name: cargo test, every other target on cargo's default threads
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          serial=$(sed -n 's/^ *# serial-targets: *//p' .github/workflows/test.yml | tr -s '[:space:]' ' ')
          if [ -z "$serial" ]; then
            echo "::error title=no serial targets::no line of .github/workflows/test.yml begins 'serial-targets:'. Running on would put the GPU-bound targets on default threads."
            exit 1
          fi
          all=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          for package in json.load(sys.stdin)["packages"]:
              for target in package["targets"]:
                  if "test" in target["kind"]:
                      print(target["name"])
          ')
          read -r -a names <<<"$serial"
          for t in "${names[@]}"; do
            n=$(grep -cx -- "$t" <<<"$all" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error title=a serial target is not one test target::'$t' is named in a serial-targets line and matches ${n} cargo test targets; it was renamed, deleted, or shares its name with another crate's target, which a --test name cannot tell apart."
              exit 1
            fi
          done
          args=()
          while read -r t; do
            case " $serial " in
              *" $t "*) ;;
              *) args+=(--test "$t") ;;
            esac
          done < <(sort -u <<<"$all")
          cargo test --locked --workspace --bins "${args[@]}"
          cargo test --locked --workspace --doc

      # THE PIN-STALENESS CHECK. Its own step with its own pass/fail, for the
      # same reason the conformance scoreboard below is one: the number that
      # matters — how many shipped Protocols the pinned `arc` could load — is
      # unreadable buried in the workspace suite's log.
      #
      # `-- --ignored` is required: the two tests in that target are
      # `#[ignore]`d because their input is not in this checkout, so the
      # workspace suite above compiled them and ran neither.
      #
      # THIS STEP COMPILES `libduckdb-sys` A SECOND TIME, into the same
      # `target/`, no matter how its cargo invocation is shaped. Measured
      # directly: `-p brightfield-protocol --test sibling_manifests` (the
      # form below), `--workspace --test sibling_manifests`, and
      # `-p brightfield-protocol --test sibling_manifests --features
      # duckdb/parquet` (explicitly matching the feature union the step above
      # activates: `brightfield-protocol` alone requests `duckdb`'s `bundled`
      # feature, three other workspace members request `bundled` + `parquet`)
      # all three recompiled `libduckdb-sys`, `arrow` and `duckdb` rather than
      # reusing the step above's build. A `--test <NAME>` filter narrows
      # Cargo to the unit graph that one target actually needs, regardless of
      # `-p` versus `--workspace` or an explicit `--features`, so this step's
      # build is a genuinely different, separately-fingerprinted compile from
      # the workspace suite's, every time. On a warm cache both builds are
      # already on disk and this is invisible; on a cache-key miss (any
      # `Cargo.lock` change) the runner rebuilds both from nothing, and the
      # workspace suite above already leaves the runner within a few
      # gigabytes of its ceiling — so this step's rebuild, on its own only a
      # few gigabytes, is what exhausted it with `ranlib: can't write to
      # output file (No space left on device)`. Rather than chase Cargo's
      # resolver further, the runner's disk is reclaimed near the top of
      # this job, before the workspace suite runs — see "reclaim disk before
      # this job's cargo builds" above — of what neither that build, this
      # one, nor this workspace's tests need. It reclaims ahead of the
      # workspace suite rather than only ahead of this step because the
      # workspace suite itself can fill the disk first on a cold run; a step
      # that frees disk for later steps has to run before the first step
      # that can exhaust it.
      #
      # THE GUARD, and it is the point of this step's shape. `cargo test --
      # --ignored` with a filter that matches NOTHING exits 0 and prints
      # "0 passed", so a green step here would otherwise prove nothing at all.
      # libtest's executed count is parsed back out of the summary and held to
      # a floor of 2 — the two `#[ignore]`d tests in `sibling_manifests.rs`. It
      # is a floor, not an equality, so a third one added there does not redden
      # this at review time; what it catches is a covered test renamed, deleted
      # or filtered away to nothing.
      #
      # The count of MANIFESTS is guarded one level down, inside the test:
      # `collect_manifests` refuses an absent root, a missing subtree, and a
      # subtree under its own floor, and its refusals are themselves exercised
      # by the non-ignored `floor_*` tests that the workspace suite above runs.
      # Two floors at two altitudes, because either one alone reads as coverage
      # it does not have.
      #
      # `--locked` for the same reason the suite above uses it.
      - name: shipped Protocols load through the pinned arc
        shell: bash
        env:
          OPEN_ANALYTICS_DIR: ${{ github.workspace }}/.sibling/open-analytics
        run: |
          set -u

          # The number of `#[ignore]`d tests in the target, stated once so a
          # reader and the log both see what this step expects to have run.
          floor=2
          log="${RUNNER_TEMP}/sibling-manifests.log"

          # The disk figure this step exists to watch, printed before and
          # after so a reader sees whether this step is the one that filled
          # it — no guessing from a "No space left on device" message alone.
          echo "--- disk before the sibling-manifest step:"
          df -h /

          # The exit code is captured, never masked: no pipe into head/tail,
          # output redirected to a file, the code kept in a variable and the
          # file printed afterwards.
          code=0
          cargo test --locked -p brightfield-protocol --test sibling_manifests \
            -- --ignored --test-threads=1 --nocapture >"$log" 2>&1 || code=$?
          cat "$log"

          echo "--- disk after the sibling-manifest step:"
          df -h /

          # libtest's summary line:
          #   test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 5 filtered out; finished in 0.10s
          # so the number before the literal "passed;" is what EXECUTED, as
          # opposed to what was compiled or filtered out. Anchored to the start
          # of a line so the phrase occurring inside a test's own output does
          # not add to the count.
          ran=$(awk '/^test result:/ { for (i = 1; i <= NF; i++) if ($i == "passed;") n += $(i - 1) } END { print n + 0 }' "$log")
          echo "--- sibling_manifests: cargo exited ${code}, ${ran} test(s) executed (floor ${floor})"

          failed=0
          if [ "$code" -ne 0 ]; then
            echo "::error title=the pinned arc cannot load a shipped Protocol::cargo test exited ${code} — the failure above names the manifest and quotes arc's own diagnostic. Bump the pin: README section \"The arcform dependency\" (the arc rev, the root [patch.crates-io] sqlparser rev, and Cargo.lock, in one commit)."
            failed=1
          fi

          if [ "$ran" -lt "$floor" ]; then
            echo "::error title=executed too few tests::expected at least ${floor} ignored test(s) to execute in sibling_manifests, ${ran} executed — the filter matched nothing, or a covered test was renamed, deleted or un-ignored. A green run here would prove nothing."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "${ran} sibling-manifest test(s) executed and passed (floor ${floor})"

      # The portability contract's scoreboard, as its own step with its own
      # pass/fail. Separate from the suite on purpose: the number that matters
      # here — how many spec x layer cells are green, and at WHICH layer — is
      # the one thing a reader wants at a glance, and it is unreadable buried
      # in a thousand-line test log.
      #
      # The binary exits non-zero on any failing cell, and a cell fails when
      # its outcome differs from what the spec's curated `.expected.yaml`
      # declares. So this step reddens on a layer REGRESSING (a pass that went
      # pending) as readily as on one breaking, which is the whole reason the
      # expectations are assertions rather than notes.
      #
      # `--locked` for the same reason the suite above uses it.
      - name: conformance cell counts
        run: cargo run --locked --bin conformance -- --layers 1,2,3,4 --corpus curated

      # On failure, hand back what the pixel tier actually rendered plus its
      # perceptual diff, so a red visual gate is diagnosable without a Mac.
      - name: upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kittest-snapshot-output
          path: |
            crates/**/tests/snapshots/**/*.new.png
            crates/**/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7

  # The disk-image half of scripts/check-artifact-type-source-selftest.sh.
  #
  # public-hygiene.yml runs the same file on ubuntu, where every tarball case
  # runs in seconds and the image cases report as not applicable — `hdiutil`
  # is macOS-only. This job is what keeps those three cases from being a branch
  # nothing in CI ever takes: the `.dmg` is the artifact a download button
  # hands a stranger, and its bundle sits at Contents/Resources/finetype rather
  # than beside the executable, so it is a separate path through the check and
  # a separate way to ship an application with no type source in it.
  #
  # Its own job rather than a step inside `test` because it needs no cache and
  # no build: it should report in a couple of minutes rather than behind the
  # full suite.
  #
  # It does need a toolchain, which is new and is not free.
  # scripts/check-artifact-type-source.sh refuses to guess the host triple from
  # one source, so it exits without `rustc`; the self-test then reads
  # `rustc -vV` itself rather than asking the code under test what the host is,
  # which is what makes its fixtures independent of the uname table they are
  # checking. The step is explicit rather than left to the runner image's rust:
  # rust-toolchain.toml pins 1.95.0, so a bare `rustc` here would sync that
  # toolchain mid-run anyway, undeclared. public-hygiene.yml's job of the same
  # name carries the same step and the longer argument.
  artifact-type-source:
    name: The packaged artifact carries a type source (disk image)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: ./scripts/check-artifact-type-source-selftest.sh

  # The other half, and the expensive one: a real scripts/package.sh run, read
  # back with the real check.
  #
  # The job above drives the CHECK against fixtures somebody assembled. This one
  # drives PACKAGING and then the check over what packaging produced, which is a
  # different claim and the one no gate on a pull request could make before it
  # existed: `stage_finetype` is called once into the tarball tree and once into
  # `Contents/Resources` of the app bundle, and deleting either call — or
  # reducing it to a `mkdir -p` — left every check in this repository green. The
  # only thing that would have caught it is the read-back on a tag.
  #
  # scripts/package-finetype-selftest.sh cannot reach those calls: it stops
  # before the compiler on purpose, so that it can run on a runner with no Rust.
  #
  # Its own job, on macOS, and both are forced. macOS because the app bundle and
  # the disk image are darwin-only paths in scripts/package.sh and because
  # hdiutil, codesign and plutil are macOS tools; its own job because it runs
  # packaging four times — once intact and once per mutation it drives — and
  # should not queue behind the full suite. No cache and no real compile:
  # `cargo` is stubbed with a short C program, which is a genuine Mach-O for the
  # linkage audit, the version floor and codesign, and which answers
  # `--check-type-source` so the read-back's run leg is actually reached.
  #
  # The same run stages the DuckDB CLI the Run control drives —
  # `engine/duckdb` in the tarball, `Contents/Helpers/duckdb` in the app — and
  # the file reads each back at the path the shell's runner looks, runs it, and
  # drives the deletion of each staging call and an impostor executable. It
  # fetches the real pinned CLI, because package.sh refuses anything else.
  #
  # The toolchain step is explicit for the same reason it is explicit in the job
  # above: `rustc -vV` is read by scripts/package.sh and by the check, and a
  # rustc that is merely preinstalled on the runner image is a dependency
  # nothing in this repository declares.
  packaged-artifact-staging:
    name: Packaging stages the type source and the DuckDB CLI into both artifacts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: ./scripts/package-artifact-staging-selftest.sh
