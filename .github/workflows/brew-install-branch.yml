# Package this branch the way the release does, and install the package through
# Homebrew, before anything is published. The check is
# scripts/check-brew-install-branch.sh; this file is the runner it needs and the
# package it installs.
#
# release.yml's `brew-install` job reads the copy Homebrew installs, but only
# after a tag is pushed and the release is out. Brightfield 0.1.5 was published
# with a finetype extension Homebrew rewrote on install, so the installed copy
# refused its own type source, and nothing read the installed copy until a person
# had run `brew install`. This job reads it on the pull request that changes
# packaging or the formula: the same aarch64 package release.yml builds (same
# FineType pin, same DuckDB CLI, same scripts/package.sh), the same formula
# generator, the same installed-copy check, and a local tap in place of the
# published one. It also installs the package without the formula's
# `preserve_rpath` line and with one byte of the extension changed, and requires
# both to be refused; the script's header says why each is there.
#
# Only on the paths that decide what Homebrew installs, because it compiles the
# release binary, which takes most of the job's time. `workflow_dispatch` runs it
# by hand on a branch once this file is on the default branch.
#
# macos-15 is the hosted arm64 image release.yml builds the aarch64 package on.
# The Intel package is not installed here, for the reason brew-install.yml gives.

name: brew-install-branch

on:
  pull_request:
    paths:
      - scripts/package.sh
      - scripts/set-extension-rpath-id.sh
      - scripts/write-brightfield-formula.sh
      - scripts/check-formula-layout.sh
      - scripts/check-brew-install.sh
      - scripts/check-brew-install-branch.sh
      - scripts/fetch-finetype-bundle.sh
      - scripts/finetype-pin.sh
      - scripts/fetch-duckdb-cli.sh
      - .github/workflows/brew-install-branch.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  brew-install-branch:
    name: Homebrew installs this branch's package with its type source intact
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: brew-install-branch-aarch64-apple-darwin

      # The tag is the crate's version, which is what scripts/package.sh names
      # the package after and what the formula's url makes the installed version.
      - name: Read the version this branch packages
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/brightfield-shell/Cargo.toml | head -1)"
          test -n "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch the FineType bundle
        run: scripts/fetch-finetype-bundle.sh aarch64-apple-darwin "${RUNNER_TEMP}/finetype-bundle"

      - name: Fetch the DuckDB CLI
        run: scripts/fetch-duckdb-cli.sh aarch64-apple-darwin "${RUNNER_TEMP}/duckdb-cli"

      - name: Package
        env:
          BRIGHTFIELD_FINETYPE_BUNDLE: ${{ runner.temp }}/finetype-bundle
          BRIGHTFIELD_DUCKDB_CLI: ${{ runner.temp }}/duckdb-cli
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/package.sh "$TAG" aarch64-apple-darwin

      - name: Install the package through Homebrew three ways
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/check-brew-install-branch.sh dist "$TAG"
