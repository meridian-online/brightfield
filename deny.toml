# Dependency gates: `cargo deny check licenses` + `cargo deny check advisories`
#
# Licenses: Brightfield ships MIT binaries; every dependency must carry a
# permissive licence from the allow-list below. The list was born as the
# firewall around the zed/gpui git tree (which carried GPL-3.0 crates); that
# tree is gone, and the gate stays as general hygiene — any copyleft entrant
# fails loudly in CI.
#
# Advisories: the RUSTSEC feed, gated in CI alongside licenses. The advisory
# surface that used to fire here (async-std, rustybuzz-via-usvg, et al.)
# arrived through gpui and left with it; a new finding means a REAL advisory
# in the graph we actually ship — resolve it with a bump, or waive it below
# with a written reason.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "NCSA",
  "CDLA-Permissive-2.0",
  # MPL-2.0 is file-scoped weak copyleft: acceptable in an MIT binary provided
  # the MPL-covered files' source stays available (it is: crates.io). Flag any
  # new MPL entrant in review rather than blocking the build.
  "MPL-2.0",
  # 0BSD (BSD Zero Clause) is OSI-approved and maximally permissive — public-
  # domain-equivalent, no attribution clause.
  "0BSD",
  # MIT-0 (MIT No Attribution) is MIT without the attribution clause. Entrant:
  # borrow-or-share, under jsonschema (brightfield-ossie).
  "MIT-0",
  # Open-font licenses for egui's bundled default fonts (Ubuntu-Light + the
  # Noto/emoji fallbacks the egui default FontDefinitions ship). Both are
  # permissive OSS font licenses, fine to redistribute in an MIT binary; they
  # cover font data only, not code. Entrant: egui/eframe.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[advisories]
# Anything the RUSTSEC feed flags in the surviving graph must be resolved
# (bump the dependency) or waived HERE with a written justification — a bare
# id with no reason does not pass review.
ignore = [
  # paste 1.0.15 — unmaintained-crate NOTICE, not a vulnerability. A
  # compile-time proc-macro (no code of it ships in a binary), reached only
  # through the AVIF encoder chain of `image` (rav1e -> ravif), whose
  # default-features are enabled by third-party consumers we do not control
  # (dify under egui_kittest; smithay-client-toolkit on the Linux target) —
  # so feature-narrowing our own `image` dependency cannot remove it. No
  # fixed release exists ("no safe upgrade"); drop this waiver when
  # image/rav1e move off paste.
  "RUSTSEC-2024-0436",
  # unsafe-libyaml 0.2.11 — unmaintained-crate NOTICE, not a vulnerability. It
  # is the parser under serde_yaml, which is itself deprecated and archived,
  # and which this workspace uses directly (brightfield-spec,
  # brightfield-protocol, brightfield-conformance) and through arcform's `arc`
  # crate. No maintained release of either exists ("no safe upgrade"), and
  # replacing the YAML parser changes how every chart file is read, so it is
  # its own change in both repos, under the conformance corpus. Drop this
  # waiver when both move off serde_yaml.
  "RUSTSEC-2024-0449",
  # The five below arrive with Typst 0.15.1, which brightfield-report uses to
  # set a Protocol's report as a PDF, and each is fixed only by a Typst release
  # that moves off the crate. Drop each when a Typst release does.
  #
  # quick-xml 0.38.4 — two denial-of-service VULNERABILITIES on hostile XML:
  # quadratic time on duplicate attribute names, and unbounded allocation in
  # `NsReader`. It is reached only through hayagriva's citationberg, which
  # parses citation styles when a document calls `bibliography` or `cite`. The
  # source brightfield-report writes never calls either: every character of the
  # report's prose is escaped, so no report can call a function, and the world
  # it compiles in serves no file but the chart pictures. citationberg 0.7 asks
  # for quick-xml 0.38, so the fixed 0.41 cannot be chosen from here.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # bincode 1.3.3 and yaml-rust 0.4.5 — unmaintained-crate NOTICES, not
  # vulnerabilities, both under syntect, which Typst uses to colour code
  # blocks. No safe upgrade exists.
  "RUSTSEC-2025-0141",
  "RUSTSEC-2024-0320",
  # rustybuzz 0.20.1 and ttf-parser 0.25.1 — unmaintained-crate NOTICES, not
  # vulnerabilities: Typst's text shaper and font parser. They read only the
  # fonts bundled with meridian-design. No safe upgrade exists.
  "RUSTSEC-2026-0206",
  "RUSTSEC-2026-0192",
  # zip 6.0.0 — three advisories in `ZipArchive::extract` and
  # `ZipStreamReader::extract`: SUID/SGID bits kept on extraction, symbolic
  # links whose targets leave the destination, and permissions applied through
  # such links. Fixed in zip 9, which nothing in this graph can take yet: zip 6
  # is required by libduckdb-sys's build script and by arcform's `arc` crate.
  # Neither reaches the affected code with untrusted input. libduckdb-sys calls
  # `extract` only when built without its `bundled` feature and with
  # DUCKDB_DOWNLOAD_LIB set, on a prebuilt libduckdb zip it downloads; this
  # workspace builds DuckDB with `bundled`, from the crate's own tarball
  # (unpacked with `tar`), so that call is never compiled. arc's archive_extract operator
  # opens a `ZipArchive` and reads the members it selects one at a time; it
  # never calls `extract`. Drop these waivers when libduckdb-sys and arcform
  # move to zip 9 or later.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
