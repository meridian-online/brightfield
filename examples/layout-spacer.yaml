# Spacer hosting (multi-view inc 6): an `hspace:` between two plots reserves a
# horizontal gap, so the right plot is offset by the spacer's width. The layout
# pass folds the gap into each plot's placed rect, which drives both the window
# and the headless composite — no per-spacer rendering needed (a gap is empty).
#
#   cargo run -p brightfield-shell --bin brightfield-shot -- --spec examples/layout-spacer.yaml --out spacer.png --vello-only
data:
  t:
    - { x: 1, y: 3 }
    - { x: 2, y: 5 }
    - { x: 3, y: 4 }
    - { x: 4, y: 6 }
    - { x: 5, y: 5 }
hconcat:
  - plot:
    - mark: dot
      data: { from: t }
      x: x
      y: y
    width: 320
    height: 260
  - hspace: 64
  - plot:
    - mark: line
      data: { from: t }
      x: x
      y: y
    width: 320
    height: 260
