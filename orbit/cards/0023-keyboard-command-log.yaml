  - "crates/brightfield-spec/src/parse.rs:1391-1437: the canonical `impl Serialize for Spec` — reformats + drops comments, hardcoded block order meta/data/params/config/plotDefaults/root (:1414-1435); DataSourceKind Typed/Opaque re-emit via `extras` (:1486-1491), a round-trip loss risk. The re-serialise the COMMIT alone triggers."
  - "crates/brightfield-spec/src/analysis.rs:95 (ComponentPath), :112 (parent_plot), :1098 (a mark's path segment is `mark[{kind.wire_name()}]`; a plot's children index positionally as `plot[{i}]`) — mark addressing is positional+kind-keyed, so a within-plot insert/remove renumbers later siblings."
  - "crates/brightfield-engine/src/lib.rs:1061 build_mark_index_map: HashMap<path, (flat_index, kind)> — the reducer must NOT persist positional path strings across an add/remove edit (they renumber); it walks the live AST and snapshots the whole Spec for undo."
  - "crates/brightfield-app/src/main.rs:638 build_everything (parse -> analyse_spec -> Engine::new/load_spec registers the source views + owns the session -> execute_all -> build MarkInput). same_layout (:1166) checks plot count + geometry NOT mark count; chrome_divergence (:1197) bounces a new colour facet; the watcher swaps scenes but NEVER rebuilds the coordinator (:1219 vs the coordinator built once :1538) — the staleness boundary."
  - "crates/brightfield-ui/src/crossfilter.rs:201 CrossfilterCoordinator (holds session/marks/plots, NO Spec); :86-120 MarkInput (batch/channels/kind/renderer_override); :442 cycle_scheme — the `c` template that recolours cached batches and re-scenes but NEVER re-queries (why a structural edit needs the heavier re-lower path); build_plot_scene re-infers scales, so a changed kind/channel re-scenes correctly; :240 a static dashboard builds no coordinator."
  - "crates/brightfield-app/src/shell.rs:590,595-596 reseed_from_disk/set_value (the fidelity-safe buffer bridge a COMMIT routes through); :527 the byte-faithful cmd-s buffer save (the deviation baseline); :288 cycle_colour_scheme (the transient handler template); :1369 run_palette (bare-action-only -> needs the argument-prompt mode); :994 palette_runnable (greys reserved rows); :846 the second-dock-citizen doc."
  - "crates/brightfield-app/src/spec_save.rs:50 save_spec_atomic (the reusable atomic flush); :113 decide_save (the two-writer guard — a dirty editor buffer + a commit is a conflict the spec must surface, not clobber)."
  - "crates/brightfield-app/src/keymap.rs:22 (actions!), :64 (keybinding_for), :94 (action_for_longname): the three arms each newly-Built verb needs; coverage tests kbg_ac01 (:141) + kbg_ac12 (:153) fail on a missing arm (compiler/test-enforced)."
  - "crates/brightfield-app/src/log_model.rs:31 FeedbackLog: the append-only newest-first cap-200 Severity{Error,Warning} rejection log with NO clear/cursor API — left as the diagnostics log; the CommandLog is a NEW, distinct model."
