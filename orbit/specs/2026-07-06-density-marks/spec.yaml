goal: >
  Card 0008 density-family instalment: three specialised marks that ride the
  shipped substrate with zero new SQL — heatmap (the KDE-smoothed sibling of
  raster: the kde_2d grid rendered as Sequential-ramp cells), cell v1
  (pre-aggregated categorical x × categorical y + numeric fill → Band×Band
  rect grid coloured through a Sequential built in augment_scales), and
  contour (marching squares over the same reconstructed KDE grid, N
  iso-levels, literal stroke). colorScheme works on all ramp fills, headless
  and live (the 0016 scheme threading). Hexbin (+hexgrid + self-aggregating
  cell) is deliberately re-staged to a follow-up — the recon showed it is the
  expensive one (new axial SQL, pixel-space binWidth mismatch, hex-lattice
  geometry gap, ~12-test placeholder churn). Contract + staging rationale:
  tabletop-note.md alongside this spec.

constraints:
  - "Zero new SQL: heatmap and contour register against DensityLowerer{TwoD} exactly as raster does; cell v1 is pass-through (SimpleLowerer-class) over pre-aggregated rows. No new QueryPlan node types; no lowerer beyond a thin contour attr-shield wrapper."
  - "The KDE-grid reconstruction currently inline in Density2DRenderer::render is extracted to a shared helper used by density, heatmap, and contour — proven behaviour-identical by byte-identical density example PNGs (this is a halt condition, not a hope)."
  - "Contour attr-shield: `thresholds` on a contour mark means iso-level count and must NOT reach DensityLowerer's bin-count read (lower.rs:268-271). The shield lives in the lowerer registration layer, not the parser."
  - "Cell scope: pre-aggregated numeric fill only. Fill Sequential is built in augment_scales (numeric fill otherwise infers Linear — the trap); domain [0,max] when min>=0 else [min,max]; Utf8 fill keeps the existing categorical Colour path untouched. No CellLowerer, no cellX/cellY."
  - "scale.rs map_category/band_width/infer_column_scale signatures untouched; Band-on-both-axes uses existing per-channel inference."
  - "Placeholder discipline: hexbin/hexgrid stay Unimplemented (the ~12 negative tests across engine/sql/app/conformance are untouched). Promoting cell orphans exactly one stub (parse.rs dfspec_ac08) — swap its unimplemented-mark to voronoi."
  - "brightfield-ui untouched; brightfield-app diff = renderer registration + per-mark scheme assembly only (mirror raster's); no window/reload changes."
  - "HALT GATE: any pre-existing example PNG byte-diff → halt, revert — including the raster trio (deterministic since #42) and especially the density examples (the refactor proof)."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "Shared KDE-grid helper: the histogram-reconstruct + kde_2d grid build is extracted from Density2DRenderer::render into a helper consumed by density, heatmap, and contour; density rendering is behaviour-identical."
    verification: "dmk_ac01: unit test pins the helper's grid against the values the inline path produced (fixture batch -> known grid probe values); the density/density-x example PNGs are byte-identical to main (gate). verifies: capability"
  - id: ac-02
    ac_type: code
    description: "Heatmap renders: every KDE grid cell filled via map_continuous through the Fill Sequential scale (zero-anchored [0, max_density]); augment_scales builds the Fill scale and widens axes to the grid extent; colorScheme honoured headless AND live (scheme rides the raster assembly path + LivePlotMeta threading); bandwidth attr reaches kde (silverman fallback when absent)."
    verification: "dmk_ac02: scene probe — two cells with different densities encode different ramp colours (packed-RGBA sampling per the #36 precedent); Fill scale asserted Sequential with zero-anchored domain; a colorScheme: blues heatmap's stops == Blues.stops() through the real build seam, and the live-path seam (render_plot_scene) matches. verifies: capability"
  - id: ac-03
    ac_type: code
    description: "Cell renders: one rect per (x category, y category) pair positioned via map_category/band_width on two Band scales; numeric fill maps through a Fill Sequential built in augment_scales with the specified anchoring; a Utf8 fill cell keeps categorical Colour behaviour; colorScheme honoured both paths."
    verification: "dmk_ac03: scene probe asserts rect count == occupied category pairs and distinct fill colours for distinct values; augment_scales unit test pins Sequential domain anchoring for min>=0 and min<0 fixtures; Utf8-fill fixture asserts the Colour scale path unchanged. verifies: capability"
  - id: ac-04
    ac_type: code
    description: "Contour renders: marching squares over the shared grid at N iso-levels (thresholds attr, default per Mosaic fixture conventions), stroked with the literal stroke colour; the attr-shield keeps thresholds out of the density SQL."
    verification: "dmk_ac04: geometry test — a synthetic single-Gaussian grid yields closed iso-paths whose count matches thresholds and whose vertices bracket the known level crossings; the shield regression test asserts thresholds: 12 on contour leaves the emitted SQL's bucket count unchanged while iso-line count changes. verifies: capability"
  - id: ac-05
    ac_type: code
    description: "Vocab + preflight: Heatmap, Contour, Cell promoted to Implemented; hexbin/hexgrid/cellX/cellY remain Unimplemented; the parse.rs unimplemented-mark stub swaps cell -> voronoi; the curated mark-types fixture passes with zero expected-file churn; conformance corpus green."
    verification: "dmk_ac05: vocab guard test updated for the three promotions and pins the non-promotions; dfspec_ac08 runs on voronoi; curated corpus + preflight suites green with no expected-yaml edits. verifies: capability"
  - id: ac-06
    ac_type: code
    description: "Examples: heatmap.yaml and contour.yaml over the raster two-blob cloud (heatmap with colorScheme variant coverage between them), cell.yaml with a new small inline day-by-hour dataset; all three render headlessly; every pre-existing example PNG byte-identical."
    verification: "dmk_ac06: the three new examples render without warnings and preflight Implemented; the byte-compare harness passes over all pre-existing examples including the raster trio and density pair. verifies: capability"
  - id: ac-07
    ac_type: manual
    description: "Gallery eyeball: the heatmap reads as a smooth two-blob density ramp (not raster's discrete bins), the contour's iso-lines trace the same structure, and the cell grid reads as a calendar-style value matrix with a coherent ramp."
    verification: "BRIGHTFIELD_DUMP_PNG renders of the three new examples, eyeballed. verifies: stand-in (real thing is Hugh's gallery eyeball of the new PNGs), accepted because appearance quality is a human judgement"

gate:
  id: ac-08
  description: >
    cargo test --workspace green; every pre-existing example PNG
    byte-identical (raster trio + density pair explicitly included);
    brightfield-ui diff empty; brightfield-app diff = registration + scheme
    assembly; scale.rs public signatures unchanged; the ~12 hexbin negative
    tests and all curated expected-files untouched.

implementation_notes:
  - "Recon (main @ 0b971af, relayed 2026-07-06) coordinates: DensityLowerer post-#42 lower.rs:242-301 (equiwidth_bin_centre :320-328, build_density_2d :362-387, ORDER BY); raster registration reusing TwoD lower.rs:431-436; QueryPlan IR ir.rs:91-156 (Projection :105, Aggregation :111, positional GROUP BY render.rs:205-207); kde_2d kde.rs:120-177 flat row-major grid, silverman_2d_per_axis :244-251; Density2DRenderer grid reconstruct mark.rs:1258-1270, kde call :1288, cell loop :1294-1308; RasterRenderer render :1391-1479, RASTER_MIN_T :1321, augment_scales union-not-clobber :1521-1545 zero-anchor :1535-1539; DENSITY_COUNT_COL :1224/:1413; Band inference scale.rs:846-869, map_category :169-186, band_width :189-207; numeric-fill-infers-Linear trap :750-820/:857; SequentialScheme :312-359; vocab rows Cell :112-114, Heatmap :152, Contour :153, Hexbin/Hexgrid :158-159; curated channels mark-types.yaml :39-51; cell parser stub parse.rs:1513; regression grouped precedent lower.rs:210-220."
  - "Heatmap vs raster in one line: raster ramps raw __bf_count per occupied bin; heatmap ramps the smoothed kde grid over ALL cells. Keep both registered against the same TwoD lowerer."
  - "MERGE-TRAIN NOTE: branch forks main @ 0b971af, fully independent of the shell/interaction tracks; merges on its own verification."
  - "Tabletop contract incl. the hexbin re-staging rationale (flagged to Hugh): tabletop-note.md alongside this spec."

deferred:
  - "hexbin + hexgrid (own spec: axial/cube-round Projection SQL, data-space binWidth semantics decision, hex size threading past the bin_step convention, the 12-test placeholder swap dance)."
  - "Self-aggregating cell (fill: count/avg -> CellLowerer); cellX/cellY."
  - "Per-level Sequential stroke for contour; explicit threshold-level lists; denseLine."
  - "RegressionLowerer stroke-group ORDER BY (jitter class noted in #42, separate chore)."

ambiguity_score: 0.12
ambiguity_notes: >
  Closed space: the ref-pinned recon fixed every mechanism with file:line
  evidence; the one judgment call (re-staging hexbin out) is argued on four
  evidenced axes in the tabletop note and flagged to Hugh rather than buried.
  Residual implementer freedom: helper module placement, contour default
  threshold count, the cell example dataset shape, grid resolution constants
  — none contractual.
