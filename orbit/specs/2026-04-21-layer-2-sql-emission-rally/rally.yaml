order_rationale: |
  Non-disjoint designs force serial order. Both cards establish and extend
  the same new crate (brightfield-sql), both mutate the same SqlEquivalenceCheck
  in brightfield-conformance/src/layer.rs, and both extend EmitError. Card 0004
  lands first because (a) its crate scaffold is smaller and establishes the
  shape 0003 extends, (b) its ParseOutput::base_dir addition is an independent
  early landing, and (c) its CREATE OR REPLACE VIEW at spec-mount lifecycle is
  the substrate 0003's D5 shape-cache depends on — plot SELECTs reference
  views by bare name and the views must exist first. Card 0003 then extends
  brightfield-sql with the IR (QueryPlan), per-mark visitor, prepared-statement
  lifecycle, and sqlparser-rs structural conformance.
