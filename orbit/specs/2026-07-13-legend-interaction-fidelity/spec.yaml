goal: >
  Legend interaction fidelity — a bound (click-to-filter) legend both LOOKS clickable and SELECTS
  more than one category, closing two gaps against Vega-Lite/Mosaic that share one code path.
  (A) AFFORDANCE: today a bound legend paints byte-identical to a static colour key (no cursor, no
  hover state); the only cue it is live is the card-0009 selected dim that appears AFTER a click.
  Add, to BOUND CATEGORICAL legends only (is_clickable() = binding.is_some() && Scale::Colour):
  a PointingHand cursor over the legend's existing prepaint hitbox, and a hover hot-state on the
  swatch under the pointer. (B) MULTI-SELECT: the legend is single-select v1 (a click replaces the
  category); add Vega-Lite `toggle: event.shiftKey` semantics — plain click replaces, shift-click
  toggles a category into/out of an OR'd union, shift-clicking the last member clears. The union is
  an OR *inside the legend's single contributor predicate* (Predicate::Or), which already round-trips
  verbatim through the engine store → compile_selection → the emitted WHERE — so the whole card lands
  in brightfield-ui + brightfield-render/legend.rs only; ENGINE, SQL and SPEC are byte-untouched, and
  because headless renders capture LAUNCH state (no selection, no hover) NO example PNG re-baselines.
  The two halves supply each other's render-state inputs — the affordance provides the hovered index,
  multi-select provides the selected SET — which is why they are one card. Selected-state stays
  DERIVED from the live engine slot (the F1 lesson), never a UI mirror. This card also introduces the
  FIRST CursorStyle in the app; the cursor seam is built for the draggable-brush card to reuse.

constraints:
  - "UI + render-legend ONLY. All edits live in crates/brightfield-ui/src/{legend_element.rs, crossfilter.rs, legend_scene.rs, brush.rs, chart_view.rs} and crates/brightfield-render/src/legend.rs. The engine store (brightfield-engine/src/lib.rs propagate_selection/contributor_predicate/selection_predicates_for_emit), the SQL layers (brightfield-sql ir.rs/lower.rs/emit.rs/render.rs), and brightfield-spec (ast/parse/analysis/vocab) are BYTE-UNTOUCHED. This is a machine-checkable claim: a diff over those crates must be empty."
  - "NO example PNG re-baseline. Unlike the axis-inset / titles data-ink cards, headless renders capture LAUNCH state — no selection, no hover — so the rendered scene is unchanged at rest. The default render-state (empty selected set + None hover) MUST be byte-identical to today's `selected: None`. The public wrapper render_colour_legend_at (legend.rs:144) and the app composite PNG path (brightfield-app/src/main.rs:1288) forward empty-set + None. A diff in ANY example PNG is a halt, not an expectation."
  - "Vega-Lite click semantics (Hugh-decided): plain click (shift=false) = single-select REPLACE, byte-identical to today; shift-click (event.modifiers.shift) = toggle a category into/out of the contributor's OR'd set. Shift-clicking the last remaining member CLEARS the contributor; a shift-click that resolves to NO entry (a gap/padding click) is a NO-OP — only a plain empty-space click clears. Plain-click behaviour and its tests (lcf_ac03/lcf_f1a/lcf_f1b/cfr_ac05) must pass with only the new shift=false argument threaded."
  - "The union is an OR WITHIN the legend's ONE contributor predicate — NOT SelectionResolution::Union (which ORs ACROSS contributors, an orthogonal axis that must not be dragged in). Legends stay crossfilter-only (the LegendBindingNonCrossfilter precondition, analysis.rs:1313), so the engine store keeps exactly one (ComponentPath, Predicate) row per legend; only that row's predicate shape changes (bare Expr ⇄ Or). VERIFIED end-to-end: a single-contributor Predicate::Or stores verbatim (lib.rs:325-326), compiles verbatim (lower.rs compile_selection), and renders into WHERE (col = 'a' OR col = 'b') (render.rs:278-287)."
  - "Never store an empty Or. Predicate::Or([]) Displays as FALSE (ir.rs:68) → WHERE (FALSE) → zero rows (blanks subscriber plots). Removing the last member MUST call session.clear(name, contributor). A size-1 set MUST collapse to a bare Predicate::Expr so it is byte-identical to a plain single-select and shares its statement-cache entry. A size-≥2 set stores Predicate::Or(members) with members sorted canonically (by rendered 'col = literal') so identical sets emit identical SQL (statement-cache stable). The same canonical sort key is used at store time and in any equality assertion."
  - "Derive-not-mirror preserved (the F1 lesson). BOTH the shift-toggle decision AND the selected-state read go through contributor_predicate (the live engine slot); there is NO UI-stored selected set. A brush that replaces the slot is observed directly (a non-decomposable predicate → the legend shows no selected categories)."
  - "Hover emphasis is COLOUR/ALPHA ONLY, never new geometry. The hovered swatch gets an emphasis distinct from BOTH full-strength and the 0.35 UNSELECTED_ENTRY_ALPHA dim, applied via colour/alpha. It must NOT add a ring/stroke/shape: the existing cfr_ac06 scene probe asserts encoding().path_data equality under selection (legend.rs ~:640) — new geometry would trip it. The exact emphasis value (a brighten, or a lighter / higher-alpha tint of the swatch fill and label) is an in-app eyeball detail (Hugh's window loop); the constraint is geometry-invariance + distinctness. A per-entry BACKGROUND FILL is out of scope: no per-entry background rect exists today (render_swatch_legend_at draws only the swatch rect + label), so it would be new geometry — tripping BOTH the cfr_ac06 path_data invariant AND the byte-identical no-rebaseline floor."
  - "set_cursor_style is PAINT-PHASE only (it debug_assert_paint()s) and reuses the SINGLE whole-legend hitbox already registered in prepaint (legend_element.rs:273) — no new hitbox. Consequence: the PointingHand shows over the whole legend panel including inter-row gaps where a click resolves to nothing (swatch_hit_category returns None there). Accepted for v1 — a whole-panel 'this legend is interactive' signal is the intent; per-swatch cursor precision would need per-swatch hitboxes (deferred). The cursor is set ONLY when is_clickable() (bound + Scale::Colour); unbound/Sequential legends register no hitbox and stay the default Arrow."
  - "Refresh only on hover-index CHANGE. MouseMove fires continuously; gate window.refresh() on hovered.get() != next (mirroring chart_element.rs:166-178's `if changed`) or a bound legend repaints on every pointer motion."
  - "Hover state survives per-frame element recreation: it lives as hovered_index: Rc<Cell<Option<usize>>> on the long-lived PlacedLegend descriptor (owned by ChartView.legends), cloned into each frame's throwaway LegendElement — the exact lifetime pattern of the existing `pressed: Rc<Cell<bool>>` (legend_element.rs:63). A field on LegendElement alone would reset every frame. Seeded in PlacedLegend::new; the sole external constructor (main.rs:162 via ::new) needs no change."
  - "Cursor seam built for reuse: keep the set_cursor_style call minimal and co-located with the mouse-listener block so the draggable-brush card can reuse the pattern (it will need its OWN brush-region hitbox and Resize*/OpenHand/ClosedHand variants, all present in gpui platform.rs, not the legend's hitbox)."
  - "Never `cargo fmt --all` (rustfmt-version skew churns the repo). Suite runs with set -o pipefail + explicit exit check."

acceptance_criteria:
  - id: lif-ac01
    ac_type: code
    description: "Cursor affordance on bound legends only. In LegendElement::paint, inside the existing bound-categorical block `if let (Some((legend_index, coordinator)), Some(hitbox)) = (&self.binding, &*prepaint) { if matches!(self.scale, Scale::Colour {..}) { .. } }` (legend_element.rs:294-335), call `window.set_cursor_style(gpui::CursorStyle::PointingHand, hitbox)` (gpui window.rs:3169; PointingHand at platform.rs:1851). Gated by is_clickable() (binding present && Scale::Colour, :216-218): an unbound legend and a Sequential/gradient legend register no prepaint hitbox and set no cursor (default Arrow). Paint-phase only; reuses the single whole-legend hitbox (no new hitbox)."
    verification: "lif_ac01: is_clickable() unit — true for bound + Colour (.with_binding), false for unbound Colour, false for Sequential-even-if-bound (the exact gate the cursor keys off). The platform cursor itself has no headless harness in brightfield-ui (no gpui test window), so is_clickable() is the machine-checked seam; the actual PointingHand-over-bound / Arrow-over-static is Hugh's in-app eyeball. verifies: capability"
  - id: lif-ac02
    ac_type: code
    description: "Hover hot-state lifetime + reset. PlacedLegend gains `hovered_index: Rc<Cell<Option<usize>>>` (after `pressed`, :63), seeded None in PlacedLegend::new, cloned into LegendElement::new (mirroring `pressed`). A new pure helper `swatch_hit_index(local: Point, scale: &Scale) -> Option<usize>` (the `.position(contains)` pre-map of swatch_hit_category) is added next to swatch_hit_category, and swatch_hit_category is refactored to call it so the two can never disagree. A MouseMove listener (MouseMoveEvent — add to the gpui import), registered ONLY inside the bound-categorical paint block, sets hovered_index via swatch_hit_index using element-local coords (event.position − bounds.origin), resets it to None when !hitbox.is_hovered(window) or between entries, and calls window.refresh() ONLY on change."
    verification: "lif_ac02: swatch_hit_index unit (mirrors lcf_ac05, legend_element.rs:498) — each entry centre → Some(i) in order; padding corner, inter-row gap, far-outside → None; Sequential → None. Assert swatch_hit_category == swatch_hit_index.map(category) on the same fixture. The window-driven listener body is out of headless scope; the change-gate (hovered.get() != next) is asserted at the helper level. verifies: capability"
  - id: lif-ac03
    ac_type: code
    description: "Hover render emphasis (colour/alpha only). render_colour_legend_at_selected (legend.rs:167) and render_swatch_legend_at (:187) grow from `selected: Option<usize>` to `(selected: &BTreeSet<usize>, hovered: Option<usize>)`. Per entry i: `let dim = !selected.is_empty() && !selected.contains(&i)` (dims non-members to UNSELECTED_ENTRY_ALPHA=0.35, unchanged); `let hot = hovered == Some(i)` gives a colour/alpha emphasis DISTINCT from both full-strength and the 0.35 dim — NO new geometry (path_data invariant). build_legend_scene (legend_scene.rs:33) keeps category-NAME boundary vocab: `(scale, selected: &BTreeSet<String>, hovered: Option<&str>)`, mapping names→indices at :40. Sequential arm ignores both."
    verification: "lif_ac03: extend the cfr_ac06 scene probe (legend.rs:569) inspecting encoding().draw_data packed colours — the hovered swatch encodes the NEW emphasis colour, present in neither the full-strength nor the 0.35-dim sets; encoding().path_data is unchanged vs no-hover (geometry invariance); Sequential ignores hovered. verifies: capability"
  - id: lif-ac04
    ac_type: code
    description: "Default state byte-identical → no PNG re-baseline. An empty selected set + None hover reproduces today's `selected: None` output byte-for-byte; a singleton set {i} reproduces today's `Some(i)` dim-others behaviour. The public wrapper render_colour_legend_at (:144) forwards an empty set + None, and the app composite PNG path (main.rs:1288, unbound) is unchanged. No example PNG re-baselines; a diff in any example PNG is a halt."
    verification: "lif_ac04: AUTOMATED at-rest gate (cargo test) = scene probe — build with (empty set, None) and assert the packed draw_data contains NO 0.35-dim colour (equals the pre-card None output); build with ({i}) and assert it equals the pre-card Some(i) output. MANUAL pre-merge tripwire = the example-dump sweep via `scripts/compare-example-pngs.sh <main-baseline>` (`cmp -s`; NO committed goldens in-repo) — every example PNG must stay byte-identical vs a baseline captured from main; a DIFFERS is a halt. verifies: capability"
  - id: lif-ac05
    ac_type: code
    description: "Shift-click builds an OR union. The mouse-up site (legend_element.rs:315-327) reads `event.modifiers.shift` and threads an `additive: bool` into commit_legend_click (:490) → apply_legend_click (:535), both ALSO gaining the legend's candidate categories (the same list ac08 derives against — apply_legend_click today receives only `hit: Option<&str>`, so this is new plumbing). On shift=true with a Some(cat) hit: build `member = point_predicate(col, literal(cat))`; read `current = contributor_predicate(..)`, decompose to its raw member set (None → {}; Expr(e) → {e}; Or(v) → v; any other → {}), then INTERSECT that set against the candidate categories' point_predicates — every member matching no candidate category is DROPPED (the SAME membership logic as legend_selected_categories, ac08). So a slot holding a FOREIGN predicate — a same-plot point-selection's bare Expr, or a brush And, sharing this one contributor slot — collapses to a fresh REPLACE and is NEVER folded into the Or (build cannot desync from ac08's display). Toggle the clicked member in/out of that filtered set; NORMALISE + store — empty → session.clear; size-1 → bare Predicate::Expr; size-≥2 → Predicate::Or(members sorted canonically). Shift + hit=None (a gap/padding click where swatch_hit_index returns None — the region the whole-panel cursor invites) is a NO-OP: leave the union untouched, return None; only a PLAIN click (shift=false) on empty space clears, so gate the existing None-branch clear (crossfilter.rs:567-575) `if !additive`."
    verification: "lif_ac05: extend the legend_toggle_coordinator fixture (crossfilter.rs:2059) — shift-click 'gentoo' → slot is a bare Expr, rows==3; shift-click 'adelie' → slot_expr contains ' OR ' with both literals, rows==5 (the union 3+2); shift 'gentoo' then 'adelie' yields the SAME slot_expr string as 'adelie' then 'gentoo' (canonical sort). NB the ' OR ' check requires slot_expr to format via DISPLAY (`format!(\"{p}\")`), NOT Debug (`{p:?}`): Debug renders the union as `Or([Expr(..), Expr(..)])`, which never contains the SQL substring ' OR ' (emitted only by Predicate's Display, ir.rs:71). Switch the existing slot_expr helper (crossfilter.rs:2103) from `{p:?}` to `{p}` — safe, every current slot_expr assertion is a literal-substring or None check that holds under Display incl. lcf_ac03's `'gentoo'` — or assert structurally by matching `Predicate::Or(v)`. FOREIGN-slot case: seed the slot with a bare point-Expr (session.dispatch(.., Predicate::Expr(\"x = 5\"))) then shift-click 'gentoo' → slot is a BARE Expr species='gentoo' (fresh replace, never an Or containing 'x = 5'); assert legend_selected_categories agrees ([gentoo]). HIT=NONE case: with a 2-member Or active, a shift-click resolving to hit=None leaves slot_expr AND rows unchanged; a plain click (shift=false) with hit=None still clears to baseline. verifies: capability"
  - id: lif-ac06
    ac_type: code
    description: "Plain click unchanged (regression floor). With shift=false, apply_legend_click stores a bare Predicate::Expr with the exact today replace-vs-toggle-same-clears-vs-empty-panel-no-op semantics; a size-1 shift set is byte-identical to a plain single-select (shares its cache entry). The single-select tests pass with only the shift=false argument threaded."
    verification: "lif_ac06: lcf_ac03 / lcf_f1a / lcf_f1b / cfr_ac05 pass unchanged (shift=false threaded); assert slot_expr (DISPLAY-formatted, per lif-ac05 — under Debug the ' OR ' negative is vacuously true and gives NO regression protection, since Debug's `Or([..])` never contains ' OR ' either) shows a BARE Expr (never ' OR ') on every plain-click path. verifies: regression"
  - id: lif-ac07
    ac_type: code
    description: "Deselect-all clears; never an empty Or. Shift-clicking the last selected member removes it, emptying the set, and MUST call session.clear(name, contributor) — never store Predicate::Or([]) (which Displays FALSE → WHERE (FALSE) → zero rows). After clear, the subscriber returns to its unfiltered baseline."
    verification: "lif_ac07: in the toggle fixture — build a 2-member Or, shift-click one member → slot back to a bare Expr (rows==that member's count), shift-click the last member → slot None / cleared, rows==baseline unfiltered (NOT zero). An explicit assert that the slot is never Or([]). verifies: capability"
  - id: lif-ac08
    ac_type: code
    description: "Selected-state derived, plural. legend_selected_category (crossfilter.rs:601) becomes legend_selected_categories → Vec<String> (order-stable in `categories`): read contributor_predicate, decompose to the member-predicate set (None→{}; Expr→one; Or→v), and return every candidate category whose point_predicate is IN that set. Purely derived from the live slot each call (no stored mirror); empty when the slot is empty, holds a brush, or the legend index is unknown. All downstream consumers (legend_element.rs:347-352, build_legend_scene, the raster cache key) take the plural."
    verification: "lif_ac08: after dispatching Or([adelie, gentoo]) the accessor returns exactly [adelie, gentoo] in categories order; after a brush replaces the slot it returns [] (F1a — display shows no category); membership is tested against the Or members, not a mirror. verifies: capability"
  - id: lif-ac09
    ac_type: code
    description: "Multi-swatch dimming + cache key. With a selected set of size ≥2, render dims ALL non-members to 0.35 and keeps every member full-strength. LegendRaster.selected: Option<String> becomes BTreeSet<String> and gains hovered: Option<String>; raster_cache_hit (legend_element.rs:166) ANDs device dims, selected-set equality, AND hovered equality. So re-selection or hover re-rasterises correctly, and static/unbound/Sequential legends (empty set + None) still hit the cache — a gesture elsewhere never re-runs Vello for them."
    verification: "lif_ac09: extend cfr_ac06_selected_state (legend.rs:569) — a set {1,2} dims only index 0, both members full-strength; extend cfr_ac06_raster_cache_keys (legend_element.rs:445) — same dims+set+hover → hit; differing hover → miss; differing set membership → miss; empty-set+None both sides → hit (never re-rasterises static/Sequential). verifies: capability"
  - id: lif-ac10
    ac_type: code
    description: "Engine/SQL/spec untouched — proven end-to-end. A single contributor holding Predicate::Or round-trips verbatim: stored by propagate_selection (lib.rs:325-326), compiled by compile_selection (lower.rs, verbatim under Single; wrapped in a one-element And/Or under Intersect/Union — semantically identical, extra parens only), and rendered into WHERE by render_predicate (render.rs:278-287). No change to ir.rs/lower.rs/emit.rs/render.rs or the engine store; no spec/analysis/vocab change."
    verification: "lif_ac10: a lower/render unit exercising the legends' ACTUAL resolution — compile_selection over a CROSSFILTER selection with a contributor whose path DIFFERS from self_source (path == self_source would be dropped → WHERE TRUE and the OR assertion would fail), contributors = &[(other_path, Or([Expr(\"c = 'a'\"), Expr(\"c = 'b'\")]))], rendered via render_query, yields a WHERE whose substring contains (c = 'a' OR c = 'b') — the Crossfilter And-wrap emits the semantically-identical double-paren ((c = 'a' OR c = 'b')); the substring holds inside it. Use the SAME spaced Expr strings on input and asserted output (render_predicate emits Expr verbatim). Plus a machine check: `git diff` over brightfield-engine/brightfield-sql/brightfield-spec is EMPTY at PR time. verifies: capability + boundary"

open_questions:
  - "Foreign predicate in the shared slot (RESOLVED in ac05, review v1.1): a legend shares its (selection, contributor) slot with the same plot's brush/point interactors. Any slot predicate NOT composed of THIS legend's category members — a brush And OR a foreign point-selection's bare Expr — is dropped by ac05's membership-intersect, so a shift-click starts a FRESH set (never a weird Or([foreign, category-Expr])). Resolved by deriving the toggle set with the SAME membership logic as ac08 (legend_selected_categories), so build and display cannot desync."
  - "Hover emphasis exact visual: colour/alpha-only is fixed (path_data tripwire + no-rebaseline floor); brighten vs a tint/alpha-bump of the existing swatch+label is Hugh's in-app call at impl time (a per-entry background fill is out — no such rect exists today, so it would be new geometry)."
  - "Cursor granularity: whole-panel PointingHand (incl. inter-row gaps) accepted for v1; per-swatch precision deferred (needs per-swatch hitboxes that don't exist today)."

review:
  - "REVIEW-SPEC (2026-07-13, /orb:review-spec — 4-lens + adversarial-verify workflow, 18 raw findings → 6 surviving): verdict REQUEST_CHANGES → folded to v1.1. Three must-fixes, ALL on lif-ac05 — (1) the decompose folded a FOREIGN bare Expr (a same-plot point-selection) into the Or, contradicting ac08's membership derive → now intersects against candidate categories; (2) slot_expr formats via Debug so the ' OR ' substring check couldn't pass and ac06's negative was vacuous → require Display; (3) shift+hit=None would clear the whole union (the region the cursor invites) → now a NO-OP. Plus three LOW nits: ac03 background-fill was infeasible (new geometry) → tint/alpha only; ac04 split the automated scene-probe gate from the manual PNG sweep; ac10 exercise the real Crossfilter path + consistent Expr spacing. Companion: review-spec-2026-07-13.md. DROPPED as already-covered: hot∧dim precedence, multi-legend isolation, presentation-mode affordance, hot-reload staleness (ChromeSnapshot-gated), the hover change-gate, the brush cross-element case."
  - "Signature-churn watch-item: the shift bool on apply_legend_click/commit_legend_click touches ~8 test call sites in crossfilter.rs (2124-2287) + the real caller legend_element.rs:327; the plural rename of legend_selected_category ripples through legend_element.rs:347-352, build_legend_scene, render_colour_legend_at_selected, LegendRaster.selected, and raster_cache_hit — a MISSED site silently drops multi-swatch dimming (a review must confirm every consumer took the plural)."
  - "SQL-cache cosmetic: a single-contributor Or wrapped by Union/Intersect renders double parens ((a OR b)) — valid, semantically identical, but changes the emitted SQL string → structural hash → statement-cache key (the re-contribution cache-warmth edge already noted at lib.rs:318-323). Not a correctness bug; flag so a reviewer doesn't misread it."

