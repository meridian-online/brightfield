[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The repository's gate as one command: `cargo xtask ci` runs what a pull request's checks run, in order, and CI's jobs call its steps by name."

[dependencies]
# Read for one thing: the test targets in `cargo metadata`, which decide how
# the test steps split the suite. Already in the lock for six other members.
serde_json = "1"

[lints]
workspace = true
