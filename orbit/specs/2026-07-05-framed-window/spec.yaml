goal: >
  Put a frame around the canvas — title strip, real legends in the window, a key
  to hide the chrome — without changing a single pixel of what the PNG renders.
  A new WorkspaceView becomes the window root, hosting a header strip (dashboard
  title from meta.title, filename fallback, mirrored to the native titlebar) and
  a padded content area mounting the existing ChartView; a new display-only
  LegendElement paints what render_colour_legend_at / render_sequential_legend_at
  already produce, at the placed_legends rects, closing the last headless/window
  gap and promoting ComponentKind::Legend; the live path gains the colorScheme
  threading #36 deferred so a blues heatmap matches its own PNG; and bare `p`
  (canvas-scoped, Brightfield's first GPUI action) toggles presentation mode —
  chrome hides, canvas re-centres, window size unchanged. Load-bearing value:
  window/PNG parity. All pre-existing example PNGs stay byte-identical.

constraints:
  - "brightfield-render/src/legend.rs is STRICTLY read-only — the positioned APIs (render_colour_legend_at :108, render_sequential_legend_at :197, colour_legend_size :43, sequential_legend_size :71) are reused, never forked. Escalate if reuse divergence exceeds ~50 LOC (pivot: rasterise the composite's legend region instead)."
  - "No parser changes in brightfield-spec — meta.title already exists (ast.rs:49, typed Meta block). Title resolution consumes it."
  - "WorkspaceView is a translation shim: no chart/coordinator logic; the presentation state machine is a plain gpui-free type (semantic-layer rule — review checkpoint: could this file's logic run headless?)."
  - "LegendElement is display-only: no mouse handlers, no coordinator, no index. Hit-testing arrives with the click-to-filter card. Chart and slider children keep their existing separate index spaces untouched."
  - "Presentation toggle keeps the window size; the canvas re-centres in the freed space. No window-resize calls in the toggle path."
  - "colorScheme threading is render-only: MarkInput/LivePlotMeta carry the scheme to renderer construction. No SQL, plan_hash, or query-cache changes (kill condition: if it needs them, re-defer and document)."
  - "One GPUI action (TogglePresentation) + one canvas-scoped key context binding `p`. No global keymap infrastructure (pivot: raw key-down handler, defer the action registry to the keyboard-grammar card)."
  - "HALT GATE: any pre-existing example PNG byte-diffs during shell/legend/toggle work → halt, revert the offending commit before proceeding. New examples added by this spec are exempt."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: "A pure window-size function computes framed window size = dashboard bbox + chrome extents (header height + content padding), and presentation mode does not change the window size (only the canvas mount origin). The function has no gpui types in its signature beyond plain dimensions."
    verification: "fww_ac01 in brightfield-ui: framed size for a WxH dashboard equals W+2*pad x H+header+2*pad (whatever the chosen constants); with presentation on, window size is unchanged while the canvas origin re-centres in the full window. verifies: capability"
  - id: ac-02
    ac_type: code
    description: "Title resolution is a pure function: Some(meta.title) wins; a spec without meta.title resolves to the spec file's stem; the same resolved string feeds both the native titlebar (set_title) and the header strip."
    verification: "fww_ac02: a spec with meta.title 'Sales Overview' resolves to that string; examples/dashboard.yaml (no meta.title) resolves to 'dashboard'; both consumers are fed from the single resolver (one call site each). verifies: capability"
  - id: ac-03
    ac_type: code
    description: "The presentation state machine is a plain gpui-free type (bool-like enum + toggle) living in headlessly-testable code; shell state does not feed into spec-derived layout — placed_plots/placed_inputs/placed_legends receive the same dashboard-local viewport whether presentation is on or off."
    verification: "fww_ac03: toggle() flips Authoring<->Presentation and is defined in a module with no gpui import; a layout-invariance test computes placed rects for a spec once and asserts the presentation flag appears nowhere in the layout call chain (same inputs, same outputs). verifies: capability"
  - id: ac-04
    ac_type: code
    description: "LegendElement scene construction is a gpui-free function: given a LegendPlacement (scale + rect), it builds a vello scene via render_colour_legend_at for categorical Colour scales and render_sequential_legend_at for Sequential scales, sized by the matching size fn. The GPUI element wraps it through the same RGBA->RenderImage raster path ChartElement uses."
    verification: "fww_ac04 in brightfield-ui: scene built for a categorical Colour scale has path_tags > 0 and differs from the scene for a Sequential scale (swatches vs gradient bar); construction fn compiles in a gpui-free test target. verifies: capability (scene construction); the on-screen pixels are covered by ac-10. verifies: stand-in (real thing is the legend visible in the macOS window), accepted because window pixels need the app"
  - id: ac-05
    ac_type: code
    description: "The window hosts legends: for a spec with standalone legend: nodes, the live path builds LegendPlacements via the existing resolve_legends and mounts one display-only LegendElement child per placement at its placed_legends rect. ComponentKind::Legend is promoted to Implemented; preflight on a legend: color spec reports no Unimplemented component."
    verification: "fww_ac05: the vocab guard test asserts ComponentKind::Legend == Implemented; a conformance fixture with legend: color preflights clean; a unit test over the view-model (not the GPUI tree) asserts one legend child descriptor per resolved placement with the placement's rect. verifies: capability (placement/vocab); visible hosting is ac-10's stand-in"
  - id: ac-06
    ac_type: code
    description: "colorScheme reaches the live path: the live rebuild constructs the raster renderer with the mark's declared scheme (default viridis, unknown warns + defaults), so live window cells and the hosted gradient legend match the headless PNG for colorScheme: blues."
    verification: "fww_ac06: drive the live-path seam (the Entity-free render_plot_scene/rebuild helper from #36) for a raster mark with colorScheme: blues and assert the resulting Fill Sequential stops == SequentialScheme::Blues.stops(); unknown scheme falls back to viridis. No SQL/plan_hash source files change in the diff. verifies: capability"
  - id: ac-07
    ac_type: code
    description: "TogglePresentation is a registered GPUI action bound to bare `p` in the workspace/canvas key context; its handler flips the ac-03 state machine and requests repaint. The binding lives in data (keymap/binding declaration), not hardcoded in an event match."
    verification: "fww_ac07: the action type exists and its handler unit-testably flips the state machine; the binding declaration maps 'p' -> TogglePresentation in the canvas context. The physical keypress is ac-11's manual check. verifies: capability (handler + binding data); keypress delivery is stand-in (real thing is pressing p in the app), accepted because GPUI event dispatch needs the window"
  - id: ac-08
    ac_type: code
    description: "New examples pin the feature: a framed-window example with meta.title, and the existing legend examples (categorical + a raster/sequential legend) render through the new window path headlessly unchanged — the composite PNG output for ALL pre-existing examples is byte-identical to main."
    verification: "fww_ac08: a script/test compares BRIGHTFIELD_DUMP_PNG output for every pre-existing example against baselines captured from main — zero byte diffs. New examples get fresh baselines. verifies: capability"
  - id: ac-09
    ac_type: manual
    description: "Framed window eyeball: examples open with a header strip showing the resolved title, padded content area, and the native titlebar carrying the same title; no clipping, chrome never overlaps the canvas."
    verification: "cargo run -p brightfield-app -- examples/dashboard.yaml (and the new meta.title example): frame, title in strip + titlebar. Eyeballed. verifies: stand-in (real thing is a human seeing the framed macOS window), accepted because the GPUI render tree cannot run headless"
  - id: ac-10
    ac_type: manual
    description: "Window legends eyeball: legend-standalone.yaml shows categorical swatches and the raster legend example shows the gradient bar, each at its layout rect in the live window, side-by-side identical to the PNG; the blues raster's live cells + legend match the PNG hues."
    verification: "Run both legend examples in the app next to their PNG dumps; compare placement, swatches/gradient, and blues hues. Eyeballed. verifies: stand-in (eyeball screenshot vs PNG), accepted because window pixels need the app"
  - id: ac-11
    ac_type: manual
    description: "Presentation toggle eyeball: pressing p hides the header (and any shell chrome), the canvas re-centres in the unchanged window; pressing p again restores the chrome exactly."
    verification: "In the app: press p twice; observe hide/re-centre/restore with no window resize. Eyeballed. verifies: stand-in (chrome visibly hides), accepted because window pixels need the app"

gate:
  id: ac-12
  description: >
    cargo test --workspace green (no regressions in render/app/conformance
    suites, including the chart/slider interaction tests — index spaces
    untouched); every pre-existing example PNG byte-identical to main;
    brightfield-render diff limited to vocab.rs (legend.rs read-only,
    no gpui dependency); brightfield-spec diff empty; no SQL, plan_hash,
    or query-cache changes.

implementation_notes:
  - "chart_view.rs:117-122 currently owns the white bg + centring — that decor moves up to the new workspace_view.rs; ChartView keeps only the fixed-size relative canvas with absolutely-positioned children."
  - "legend_element.rs mirrors chart_element.rs: vello scene -> RGBA -> RenderImage (the chart_state.rs:97-135 choke point pattern) with a single paint_image; display-only means no mouse listeners at all."
  - "main.rs:868 is the current window-size call site (bbox-exact); main.rs:166 resolve_legends already produces LegendPlacement{scale, rect} and main.rs:1042 already dispatches sequential_legend_size — the live path reuses, not reimplements."
  - "crossfilter.rs carries LivePlotMeta and the Entity-free render_plot_scene helper from #36 — the scheme field rides the same route draw_inline_legend took."
  - "Index coupling verified absent for display-only legends: charts and sliders enumerate as separate index spaces (chart_view.rs children blocks); a third children block without indices/coordinator is safe."
  - "Chrome dimensions/styling (header height, padding, colours) are the implementer's call, eyeballed at ac-09 — pin them as named constants next to the ac-01 size function."
  - "Tabletop contract (values/halt/kill/escalation): orbit/specs/2026-07-05-framed-window/tabletop.md — read before starting."

deferred:
  - "Legend hit-testing + click-to-filter (as: $sel) — next card; prereqs all land here + #31."
  - "Resize reflow (ChartState::set_dimensions stays dead; resize keeps showing margin)."
  - "Docks/panels/tabs/editor + layout persistence — gpui-component DockArea at the editor milestone, at a tag."
  - "Opacity/symbol legend channels; #30's residuals (legend-followed-by-sibling overlap, dropped-legend blank slot)."
  - "Keyboard grammar beyond `p` (scope prefixes, palette, command log) — keyboard-grammar discovery card."
  - "Presentation-mode variants (window-shrink-to-canvas, fullscreen)."

ambiguity_score: 0.08
ambiguity_notes: >
  Closed design space — the tabletop locked the goal sentence, the load-bearing
  value (window/PNG parity), and every discrete fork (bare `p` canvas-scoped;
  window keeps size on toggle; meta.title in titlebar + header; display-only
  legends; scheme threading in scope). Residual implementer freedom: exact
  chrome dimensions/styling (eyeballed at ac-09), the key-context name, and
  which crate hosts the ac-01/ac-02 pure functions (brightfield-ui preferred;
  app acceptable) — none affect the contract.
